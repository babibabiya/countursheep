/* ================= Function 7：睡前阅读倒计时 ================= */
var READ = {
  dur: 0,            // 默认 00:00（秒）
  remain: 0,
  running: false,
  startedAt: 0,
  timer: null,
  audioOn: false,      // 鼓励音频
  remindOn: false,     // 自定义提醒气泡
  remindText: '不要划出去，继续阅读',
  audioEvery: 300,     // 每 5 分钟一次
  lastAudioAt: 0,
  audioEl: null,
  _inited: false,
  _settingsOpen: false
};

var READ_PHRASES = [
  '继续保持，您做得很好',
  '再坚持一会儿就好',
  '专注阅读，身心都在安顿',
  '把注意力交还给这一页',
  '您的状态很平稳，慢慢来'
];

function readFmt(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return { m: m, s: s };
}

function readRender(){
  var t = readFmt(READ.remain);
  $('#readMin').textContent = String(t.m).padStart(2,'0');
  $('#readSec').textContent = String(t.s).padStart(2,'0');
}

function readTick(){
  if(!READ.running) return;
  var elapsed = Math.floor((Date.now() - READ.startedAt) / 1000);
  READ.remain = Math.max(0, READ.dur - elapsed);
  readRender();
  if(READ.audioOn && elapsed - READ.lastAudioAt >= READ.audioEvery && READ.remain > 30){
    READ.lastAudioAt = elapsed;
    readPlayPhrase(READ_PHRASES[Math.floor(Math.random() * READ_PHRASES.length)]);
  }
  if(READ.remain <= 0){ readFinish(); return; }
  READ.timer = setTimeout(readTick, 250);
}

function readPlayPhrase(text){
  if(!(window.TC_TTS && TC_TTS.synth)){ return; }
  TC_TTS.synth(text, EDGE.voice, -0.3).then(function(blobs){
    if(!blobs || !blobs.length) throw 0;
    if(!READ.audioEl) READ.audioEl = new Audio();
    if(READ.audioEl.src){ try{ URL.revokeObjectURL(READ.audioEl.src); }catch(e){} }
    READ.audioEl.src = URL.createObjectURL(blobs[0]);
    READ.audioEl.volume = 0.55;
    READ.audioEl.play().catch(function(){});
  }).catch(function(){});
}

function readStart(){
  if(READ.running) return;
  if(READ.remain <= 0) return;
  READ.running = true;
  READ.startedAt = Date.now() - ((READ.dur - READ.remain) * 1000);
  READ.lastAudioAt = 0;
  readTick();
  toast('开始阅读');
}
function readPause(){
  READ.running = false;
  clearTimeout(READ.timer);
}
function readStop(){
  readPause();
  readRender();
  hideBubble();
}
function readAdjust(deltaSec){
  READ.dur = Math.max(0, Math.min(30 * 60, READ.dur + deltaSec));
  if(!READ.running) READ.remain = READ.dur;
  readRender();
}
function readClear(){
  readPause();
  READ.dur = 0;
  READ.remain = 0;
  readRender();
  hideBubble();
}

function readFinish(){
  readPause();
  readRender();
  hideBubble();
  // 自动进入后续睡眠流程：goodnight 覆盖层
  $('#goodnight').classList.add('show');
  readPlayPhrase('阅读结束了，放下手机，准备入睡吧。');
}

function showBubble(){
  if(!READ.remindOn || !READ.remindText){ hideBubble(); return; }
  $('#readBubble').textContent = READ.remindText;
  $('#readBubble').classList.add('show');
}
function hideBubble(){
  $('#readBubble').classList.remove('show');
}

function openReadSettings(){
  $('#rsAudio').classList.toggle('on', READ.audioOn);
  $('#rsAudio').setAttribute('aria-checked', READ.audioOn ? 'true':'false');
  $('#rsRemind').classList.toggle('on', READ.remindOn);
  $('#rsRemind').setAttribute('aria-checked', READ.remindOn ? 'true':'false');
  $('#rsInput').value = READ.remindText;
  $$('.rs-preset').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-text') === READ.remindText);
  });
  $('#readSettingsBg').classList.add('show');
  $('#readSettings').classList.add('show');
  READ._settingsOpen = true;
}
function closeReadSettings(){
  $('#readSettingsBg').classList.remove('show');
  $('#readSettings').classList.remove('show');
  READ._settingsOpen = false;
  // 把输入框的值作为当前提醒
  var v = $('#rsInput').value.trim();
  if(v){ READ.remindText = v; }
  if(READ.remindOn && READ.running) showBubble();
  else hideBubble();
}

  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;

  if(MIX.aMusic){
    var s1 = mt && mt.src ? mt.src : '';
    var cur1 = MIX.aMusic.getAttribute('src') || '';
    if(cur1 !== s1 && !(s1 === '' && !cur1)){ try{ MIX.aMusic.pause(); }catch(e){} MIX.aMusic.src = s1; }
  }
  if(MIX.aNoise){
    var s2 = nt && nt.src ? nt.src : '';

    if(cur2 !== s2 && !(s2 === '' && !cur2)){ try{ MIX.aNoise.pause(); }catch(e){} MIX.aNoise.src = s2; }
  }
  if(MIX.selMusic >= 0 || MIX.selNoise >= 0){ startMixPlayback(); }
  else { stopMixPlayback(); }
  if(typeof renderMixFold === 'function') renderMixFold();
  if(typeof updateMixCard === 'function'){ updateMixCard('music'); updateMixCard('noise'); }
  renderQuickMix();
}

/* 视频播放可靠性：自动播放被拒/中途被暂停时自动恢复（muted 循环背景视频，无用户暂停场景） */
function ensureVideoPlay(v){
  function tryPlay(){ if(v.paused && !v.ended){ var p = v.play(); if(p && p.catch) p.catch(function(){}); } }
  tryPlay();
  v.addEventListener('canplay', tryPlay);
  v.addEventListener('loadeddata', tryPlay);
  ['pointerdown','touchstart','click','keydown'].forEach(function(ev){
    document.addEventListener(ev, tryPlay, { passive: true });
  });
  v.addEventListener('pause', function(){ setTimeout(tryPlay, 250); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tryPlay(); });
}

function initReadVideo(){
  var vid = $('#readVid');
  var canvas = $('#readVidCanvas');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;   // 处理分辨率（视频 2160x3840 的 1/4）
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
        /* 色度抠白：白色=高亮且低饱和（不误伤羊的奶白色等浅色主体） */
        if(mx >= 235 && mx - mn < 22){ d[i+3] = 0; }
        else if(mn >= 200 && mx - mn < 45){ d[i+3] = ((255 - mx) * 255 / 40) | 0; }  // 边缘羽化
      }
      /* 擦除底部圆形（音乐按钮）和右侧长条（彩条）：540×960 坐标
         圆形用圆形遮罩、长条用紧贴元素的矩形遮罩，避免矩形外溢显出米色页底 */
      for(var y = 815; y < 960; y++){
        for(var x = 0; x < 165; x++){
          var dx = x - 77, dy = y - 892;
          if(dx*dx + dy*dy <= 72*72){ d[(y * W + x) * 4 + 3] = 0; }
        }
      }
      for(var y = 685; y < 960; y++){
        for(var x = 485; x < 540; x++){
          d[(y * W + x) * 4 + 3] = 0;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  ensureVideoPlay(vid);
  requestAnimationFrame(chromaFrame);
}

function initReadVideo2(){
  var vid = $('#readVid2');
  var canvas = $('#readVidCanvas2');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
        /* 保守抠白：melatonin2 含羊的奶白色，只抠纯白背景 */
        if(mx >= 245 && mx - mn < 14){ d[i+3] = 0; }
        else if(mn >= 228 && mx - mn < 30){ d[i+3] = ((255 - mx) * 255 / 40) | 0; }  // 边缘羽化
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  ensureVideoPlay(vid);
  requestAnimationFrame(chromaFrame);
}

function bind(){
  var _mf=$('#mainFeature'); if(_mf) _mf.addEventListener('click', function(){ showScreen('scr-input'); });

  try {
    var _handoff = localStorage.getItem('thought_box_handoff');
    if (_handoff) {
      localStorage.removeItem('thought_box_handoff');
      $('#worryInput').value = _handoff;
      updateCount();
      toast('已把您在收纳箱里写的带过来了，直接生成即可');
    }
  } catch(e) {}

  $('#btnBackInput').addEventListener('click', function(){ location.href='index.html'; });
  $('#worryInput').addEventListener('input', updateCount);
  $('#boxPickTrigger').addEventListener('click', openBoxPick);
  $('#boxPickClose').addEventListener('click', closeBoxPick);

    if(e.target === $('#boxPickMask')) closeBoxPick();
  });
  $('#btnGenerate').addEventListener('click', function(){
    var input = $('#worryInput').value.trim();
    if(input.length < 4){ toast('再多写几个字，让 AI 更懂您'); $('#worryInput').focus(); return; }
    if(isGarbled(input)){
      toast('我好像没太读懂你的意思，可以换种方式再跟我说说吗？');
      var el = $('#worryInput');
      el.focus();
      try{ el.select(); }catch(e){}
      return;
    }
    /* 烦恼同步收纳箱：每一次生成的烦恼都进箱 */
    try { localStorage.setItem('box_incoming', input); } catch(e) {}
    runGeneration(input);
  });

  $('#btnBackGen').addEventListener('click', function(){
    genSession++;
    if(genCtrl){ try{ genCtrl.abort(); }catch(e){} }
    stopLoadingFx();
    showScreen('scr-input');

  });

  });

  $('#btnPrev').addEventListener('click', function(){ stepSection(-1); });
  $('#btnNext').addEventListener('click', function(){ stepSection(1); });
  $('#btnSpeed').addEventListener('click', cycleRate);
  $('#btnVoice').addEventListener('click', cycleVoice);

  $('#gnHome').addEventListener('click', function(){
    stopAll();

  });

  $('#sheetOk').addEventListener('click', function(){
    var fn = sheetHandlers.onOk;
    if(fn) fn();
  });
  $('#sheetCancel').addEventListener('click', function(){
    var fn = sheetHandlers.onCancel;
    if(fn) fn();
  });
  $('#backdrop').addEventListener('click', closeSheet);

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && player.playing){
      /* 部分浏览器切后台会中断语音，这里静默处理，由 token 机制防止错乱 */
    }
  });
}

  $('#btnNext').innerHTML = IC.next;

  initMix();
  bind();
}

  #mixPageBg{position:absolute;inset:0;background:url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheepimage/bg-yarn.png') center/cover no-repeat;z-index:1;display:none;}
  #mixPageBg.show{display:block;}
  /* 混音模式下隐藏星光条带，状态栏文字翻白 */
  #phone.mix-mode #starfield{display:none;}
  #phone.mix-mode .statusbar{color:#fff;text-shadow:0 1px 6px rgba(40,28,80,.6);}
  #phone.mix-mode .sb-right svg rect[fill="currentColor"]{opacity:1;}

  #scr-mix{padding:0;}
  .mix-content{position:relative;z-index:1;padding:8px 18px calc(28px + env(safe-area-inset-bottom));}
  .mix-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px;}
  .mix-title{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:.3px;color:#fff;
    text-shadow:0 2px 14px rgba(40,28,80,.55),0 1px 3px rgba(0,0,0,.25);}
  .mix-sub{padding:4px 4px 16px;font-size:12.5px;color:rgba(255,255,255,.92);line-height:1.7;letter-spacing:.2px;
    text-shadow:0 1px 8px rgba(40,28,80,.5);}

  /* glossy 3D plastic power button —— 参考图电源按钮 */
  .mix-power{position:relative;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;outline:none;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -4px 8px rgba(40,20,90,.55),
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(110,70,200,.55),
      0 2px 4px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 2px rgba(60,30,120,.7);
    transition:transform .15s, box-shadow .25s, background .25s;}
  .mix-power::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:62%;height:34%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.82) 0%, rgba(255,255,255,.25) 45%, rgba(255,255,255,0) 75%);
    pointer-events:none;}
  .mix-power::after{content:'';position:absolute;inset:6px;border-radius:50%;
    background:radial-gradient(circle at 50% 75%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 50%);
    pointer-events:none;}
  .mix-power svg{width:26px;height:26px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-power:active{transform:scale(.94);}
  .mix-power.off{
    background:radial-gradient(circle at 50% 32%, #d8dcec 0%, #a8b0cc 30%, #8892b0 58%, #5a6880 100%);
    box-shadow:
      inset 0 -4px 8px rgba(30,40,60,.45),
      inset 0 3px 4px rgba(255,255,255,.5),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(80,90,120,.4),
      0 2px 4px rgba(0,0,0,.2);}
  .mix-power.off::before{
    background:radial-gradient(ellipse at center, rgba(255,255,255,.7) 0%, rgba(255,255,255,.18) 45%, rgba(255,255,255,0) 75%);}
  .mix-power.off svg{filter:drop-shadow(0 1px 1px rgba(40,50,70,.5));}

  .mix-section-title{display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:1.5px;color:#fff;
    margin-bottom:10px;padding-left:4px;font-weight:600;
    text-shadow:0 1px 8px rgba(40,28,80,.55);}
  .mix-section-title svg{width:15px;height:15px;opacity:.95;}

  /* foldable list —— 白玻璃折叠列表 */
  .mix-fold{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .fold-cat{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;}
  .fold-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 16px;background:none;border:none;cursor:pointer;color:#2a2f4a;
    font-size:15px;font-weight:700;letter-spacing:.3px;transition:background .15s;text-align:left;}
  .fold-head:active{background:rgba(255,255,255,.45);}
  .fold-title{display:flex;align-items:center;gap:8px;}
  .fold-ico{width:16px;height:16px;color:#8a8faa;flex:none;}
  .fold-tail{display:flex;align-items:center;gap:6px;flex:none;}
  .fold-sel{font-size:12px;font-weight:600;color:#7a5fd0;letter-spacing:.2px;max-width:90px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fold-sel.none{color:#9a9fb5;font-weight:500;}
  .fold-chev{width:16px;height:16px;color:#8a8faa;flex:none;transition:transform .25s ease;}
  .fold-cat.open .fold-chev{transform:rotate(90deg);}
  .fold-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
  .fold-cat.open .fold-body{max-height:560px;}
  .fold-opt{width:100%;display:flex;align-items:center;gap:9px;padding:12px 16px;
    background:none;border:none;border-top:1px solid rgba(120,120,150,.12);cursor:pointer;
    font-size:13.5px;color:#4a5068;text-align:left;transition:background .15s;}
  .fold-opt:active{background:rgba(180,142,242,.14);}
  .fold-opt.active{background:linear-gradient(90deg,rgba(180,142,242,.2),rgba(180,142,242,.04));}
  .fold-opt-name{font-weight:600;color:#2a2f4a;letter-spacing:.2px;flex:none;}
  .fold-opt.active .fold-opt-name{color:#7a5fd0;}
  .fold-opt-sub{flex:1;font-size:11px;color:#9a9fb5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fold-opt-check{width:16px;height:16px;color:#b48ef2;opacity:0;flex:none;transition:opacity .15s;}
  .fold-opt.active .fold-opt-check{opacity:1;}

  /* track card —— 白玻璃 + 渐变专辑封面 + 立体播放按钮 */
  .mix-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:11px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-card-art{position:relative;width:62px;height:62px;border-radius:13px;flex:none;overflow:visible;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.15);}
  .mix-card-art-glyph{font-size:22px;line-height:1;font-weight:800;color:rgba(255,255,255,.94);
    text-shadow:0 1px 3px rgba(0,0,0,.3);}
  .mix-card-play{position:absolute;left:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -3px 6px rgba(40,20,90,.5),
      inset 0 2px 3px rgba(255,255,255,.55),
      0 4px 10px rgba(110,70,200,.45),
      0 1px 2px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 1px rgba(60,30,120,.6);outline:none;}
  .mix-card-play::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:62%;height:32%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;}
  .mix-card-play svg{width:14px;height:14px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-card-body{flex:1;min-width:0;}
  .mix-card-name{font-size:15px;font-weight:700;letter-spacing:.2px;color:#2a2f4a;}
  .mix-card-sub{font-size:11.5px;color:#7a8099;margin-top:2px;}
  .mix-card .mix-vol{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .mix-vol-icon{width:14px;height:14px;color:#8a8faa;flex:none;}
  .mix-vol input[type=range]{flex:1;}
  .mix-vol-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* mix controls */
  .mix-controls{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    padding:10px 14px 6px;box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .mix-row-lbl{font-size:12.5px;color:#3a3f60;width:64px;letter-spacing:.2px;font-weight:600;}
  .mix-row input[type=range]{flex:1;}
  .mix-row-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* sliders —— 紫色轨道 */
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:linear-gradient(90deg,#b48ef2 0%,#b48ef2 var(--p,60%),#dcd6ea var(--p,60%),#dcd6ea 100%);
    border-radius:99px;outline:none;margin:0;padding:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4),inset 0 -1px 2px rgba(110,70,200,.3),inset 0 1px 1px rgba(255,255,255,.8);
    cursor:pointer;border:1px solid rgba(255,255,255,.6);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4);cursor:pointer;}

  /* back button —— 改为透明无背景以融入参考图 */
  #scr-mix .back-btn{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.7);color:#5a6080;
    box-shadow:0 2px 8px rgba(60,40,120,.18);}

  /* ---------- read (Function 7: 睡前阅读倒计时) ---------- */
  #scr-read{padding:0;background:#FAF4E8;top:-46px;bottom:0;overflow:hidden;}
  /* 三段背景：宽 100%，原始 9:16；均色度抠图透明。图层：图15(标题)最上 → 图16(图形)中 → 图17(绵羊)最下，标题栏永不被遮挡 */
  .read-bg-top,.read-bg-mid,.read-vid-canvas{
    position:absolute;left:50%;width:100%;aspect-ratio:9/16;
    background-repeat:no-repeat;
  }
  .read-bg-top{top:0;transform:translateX(-50%);background:url('assets/read/read-top.png?v=5') center/100% 100% no-repeat;z-index:1;}
  .read-vid-canvas{bottom:0;transform:translateX(-50%);z-index:2;}
  .read-vid-canvas2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100%;aspect-ratio:9/16;z-index:4;pointer-events:none;}
  .read-bg-mid{top:50%;transform:translate(-50%,-50%);background:url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheepimage/read-mid.png?v=5') center/100% 100% no-repeat;z-index:3;background-color:transparent;}
  /* 混音/阅读模式：隐藏星光、状态栏文字颜色适配背景 */
  #phone.read-mode #starfield{display:none;}
  #phone.read-mode .statusbar{display:none;}
  /* overlays 相对整屏定位 —— 对齐三张图各自的内容区 */
  .read-top-ctrls{position:absolute;inset:0;z-index:5;pointer-events:none;}
  .read-ico-btn{position:absolute;top:16px;width:44px;height:44px;border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;transform:translateX(-50%);pointer-events:auto;}
  .read-ico-btn:active{background:rgba(0,0,0,.06);}
  #readPlus{left:46.8%;}   /* add 1 min */
  #readMinus{left:57.8%;}  /* minus 1 min */
  #readClear{left:68.3%;}  /* clear */
  #readStart{left:78.6%;}  /* start */
  #readStop{left:88.8%;}   /* stop */
  .read-time{position:absolute;z-index:4;left:50%;top:31%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-weight:800;font-size:92px;letter-spacing:2px;color:#1a1a1a;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(255,255,255,.25);}
  .read-time .colon{opacity:.7;}
  .read-bubble{position:absolute;z-index:4;left:50%;top:72%;transform:translate(-50%,-50%);
    background:rgba(255,255,255,.94);color:#2a2a3a;padding:11px 18px;border-radius:22px;
    font-size:13px;font-weight:700;letter-spacing:.3px;max-width:78%;text-align:center;line-height:1.55;
    box-shadow:0 6px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);display:none;}
  .read-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:rgba(255,255,255,.94);
    box-shadow:2px 2px 4px rgba(0,0,0,.08);}
  .read-bubble.show{display:block;animation:bubblePop .35s ease;}
  @keyframes bubblePop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
  .read-music-btn{position:absolute;z-index:4;left:6%;bottom:8%;width:18%;aspect-ratio:1;
    border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-music-btn:active{background:rgba(0,0,0,.06);}
  .read-home-btn{position:absolute;z-index:4;right:1.5%;bottom:0;width:13%;height:28%;
    border:none;background:transparent;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-home-btn:active{background:rgba(0,0,0,.06);}
  .read-sheep-tap{position:absolute;z-index:4;left:18%;right:18%;top:74%;bottom:18%;
    background:transparent;border:none;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}

  /* quick mix sheet —— 阅读页配色（浅暖色） */
  .qm-bg{position:absolute;inset:0;z-index:45;background:rgba(80,60,30,.18);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  .qm-bg.show{opacity:1;pointer-events:auto;}
  .qm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:46;
    background:linear-gradient(180deg,#FFFDF7,#F6EDDA);border-radius:26px 26px 0 0;
    box-shadow:0 -10px 40px rgba(60,40,20,.18);border-top:1px solid rgba(120,90,40,.12);
    padding:16px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);
    transition:transform .38s cubic-bezier(.32,.72,.28,1);max-height:84%;overflow-y:auto;}
  .qm-sheet.show{transform:none;}
  .qm-grip{width:38px;height:4px;border-radius:99px;background:rgba(120,90,40,.22);margin:0 auto 16px;}
  .qm-title{font-family:var(--serif);font-size:18px;color:#4a3a22;letter-spacing:3px;text-align:center;margin-bottom:16px;font-weight:600;}
  .qm-label{font-size:12px;color:#8a7044;letter-spacing:1.5px;font-weight:700;margin:10px 0 8px;}
  .qm-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .qm-chip{font-size:13px;color:#5a4a2a;border:1px solid rgba(120,90,40,.2);border-radius:99px;
    padding:8px 14px;background:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;font-weight:600;}
  .qm-chip:active{transform:scale(.96);}
  .qm-chip.active{background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(200,150,50,.35);}
  .qm-vol{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .qm-vol-lbl{font-size:13px;color:#5a4a2a;width:64px;font-weight:600;}
  .qm-vol input[type=range]{flex:1;background:linear-gradient(90deg,#E8B84B 0%,#E8B84B var(--p,60%),#E8D9B8 var(--p,60%),#E8D9B8 100%);}
  .qm-vol input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4),inset 0 -1px 2px rgba(200,150,50,.3),inset 0 1px 1px rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.6);}
  .qm-vol input[type=range]::-moz-range-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4);border:1px solid rgba(255,255,255,.6);}
  .qm-vol-val{font-size:12px;color:#8a7044;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:700;}
  .qm-close{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;font-weight:700;border:none;cursor:pointer;
    box-shadow:0 6px 16px rgba(200,150,50,.35);}

  /* read settings sheet */
  .read-settings-bg{position:absolute;inset:0;z-index:45;background:rgba(3,5,11,.62);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  .read-settings-bg.show{opacity:1;pointer-events:auto;}
  .read-settings{position:absolute;left:0;right:0;bottom:0;z-index:46;background:linear-gradient(180deg,#161d3a,#10152c);
    border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:18px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,.28,1);
    max-height:80%;overflow-y:auto;}
  .read-settings.show{transform:none;}
  .read-settings .rs-grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:0 auto 18px;}
  .rs-title{font-family:var(--serif);font-size:18px;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:18px;}
  .rs-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.07);}
  .rs-row-lbl{font-size:14px;color:var(--text);font-weight:600;}
  .rs-row-sub{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.3px;}
  .rs-switch{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background .2s;flex:none;}
  .rs-switch::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
  .rs-switch.on{background:linear-gradient(135deg,#b48ef2,#8fa3ff);border-color:transparent;}
  .rs-switch.on::after{transform:translateX(20px);}
  .rs-presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .rs-preset{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:6px 12px;background:rgba(255,255,255,.04);cursor:pointer;}
  .rs-preset.active{background:rgba(180,142,242,.22);border-color:rgba(180,142,242,.5);color:#fff;}
  .rs-input{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--text);font-size:13px;font-family:inherit;outline:none;}
  .rs-input:focus{border-color:rgba(143,163,255,.5);}
  .rs-close{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;font-weight:600;border:none;cursor:pointer;}

  /* ---------- goodnight overlay ---------- */
  .goodnight{
    position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:radial-gradient(120% 100% at 50% 28%,rgba(10,14,30,.95),rgba(4,6,13,.99));
    opacity:0;pointer-events:none;transition:opacity 1.4s ease;
  }
  .goodnight.show{opacity:1;pointer-events:auto;}
  .gn-moon{
    width:74px;height:74px;border-radius:50%;

<script>
'use strict';
/* ================= 配置 ================= */
/* 三种用法：
   ① 本地开发（当前默认）：先启动中继 python3 luoding_proxy.py，
      再用浏览器打开 http://127.0.0.1:8418/，或在预览面板刷新本页面。
      key 在中继文件里，本 HTML 不需要密钥。
      （预览面板 CSP 拦外网请求但放行 127.0.0.1:*，所以必须走中继）
   ② 直连模式（仅真实浏览器，且需中继未启动时）：PROXY.url 留空，
      用下方 DEEPSEEK_KEY 直连。内嵌面板里会报"网络连接失败"。
   ③ 正式分发：部署 supabase/functions/deepseek-proxy 后，把函数地址填进
      PROXY.url、项目 anon key 填进 PROXY.anonKey，并删除 DEEPSEEK_KEY 一行。
      key 只存服务端 secret（supabase secrets set DEEPSEEK_API_KEY=...），
      泄漏可随时轮换，客户端无感。 */
var PROXY = { url: 'https://u1147881-c7kl-35a69bfe.bjb1.seetacloud.com:8443/v1/chat/completions', anonKey: 'sleep-2026' };
var DEEPSEEK_KEY = ''; // 密钥已移除（安全）：统一走中继，服务端持有真实密钥
var API_URL = PROXY.url || 'https://api.deepseek.com/chat/completions';
/* 自然语音统一走 tc-tts.js（TC_TTS.synth → GPU 服务器 Qwen3-TTS-VoiceDesign）；
   服务不可用时自动降级为系统 Web Speech，无需本地中继 */

var SYSTEM_PROMPT = [
'你是"落定"App 的睡前思绪整理引擎，基于"蔡格尼克效应"工作：未完成的思绪会被大脑反复提起，影响入睡。你的任务是：把用户的睡前担忧整理到一个"暂时可以放下"的位置，再引导身体放松、进入睡眠。',
'',
'用户会输入一段睡前的担忧。你需要：',
'1. 判断它属于以下七种类型之一：',
'   - future：对未来的不确定（考试、评选、面试、等待结果等还没发生的事）',
'   - uncertain_regret：不确定的懊悔（已做出行动但没收到反馈，反复回放自己的言行）',
'   - definite_regret：确定的懊悔（结果已落定、无法撤回的失败或损失）',
'   - sleep_anxiety：对睡眠本身的焦虑（怕睡不着、怕做噩梦）',
'   - hypervigilance：过度警觉与控制欲（反复盘算、想把每个细节都提前安排好）',
'   - flashback：情绪闪回与未愈创伤（过去的画面或感受突然袭来）',
'   - excitement：过度兴奋或期待（开心或期待的事让大脑停不下来）',
'2. 严格按照对应模板的结构与话术生成完整引导词，共五部分：承接与确认、逻辑推演到终点、认知转换、身体放松引导、晚安收尾。',
'',

/* ================= 工具 ================= */
function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }

function showScreen(id){
  $$('.screen').forEach(function(s){ s.classList.toggle('active', s.id === id); });
  var scr = document.getElementById(id);
  if(scr) scr.scrollTop = 0;
  var isMix = (id === 'scr-mix');
  var isRead = (id === 'scr-read');
  $('#phone').classList.toggle('mix-mode', isMix);
  $('#phone').classList.toggle('read-mode', isRead);
  $('#mixPageBg').classList.toggle('show', isMix);
  if(id !== 'scr-read'){
    if(typeof READ !== 'undefined' && READ._inited && READ.running) readPause();
    if(typeof READ !== 'undefined' && READ._settingsOpen) closeReadSettings();
    if(typeof READ !== 'undefined' && READ._inited) hideBubble();
  }
}

var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function fmtTime(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

var sheetHandlers = { onOk:null, onCancel:null };
function openSheet(opts){
  $('#sheetIcon').innerHTML = opts.icon || IC.moon;
  $('#sheetTitle').textContent = opts.title || '';
  $('#sheetDesc').textContent = opts.desc || '';
  $('#sheetOk').textContent = opts.okText || '确定';
  var c = $('#sheetCancel');
  if(opts.cancelText){ c.textContent = opts.cancelText; c.classList.remove('hidden'); }
  else { c.classList.add('hidden'); }
  sheetHandlers.onOk = opts.onOk || null;
  sheetHandlers.onCancel = opts.onCancel || null;
  $('#backdrop').classList.add('show');
  $('#sheet').classList.add('show');
}

  $('#backdrop').classList.remove('show');
  $('#sheet').classList.remove('show');
}

/* ================= 星空 / 时钟 ================= */
function renderStars(){
  var wrap = $('#starfield');
  var n = 64;
  for(var i=0;i<n;i++){
    var s = document.createElement('span');
    s.className = 'star';
    var size = (Math.random()*1.8 + 0.7).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random()*100).toFixed(2) + '%';
    s.style.top = (Math.random()*100).toFixed(2) + '%';
    var dur = (Math.random()*4 + 2.4).toFixed(2);
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = (Math.random()*dur).toFixed(2) + 's';
    if(Math.random() > 0.86){ s.style.boxShadow = '0 0 6px rgba(233,205,154,.8)'; }
    wrap.appendChild(s);
  }
}
function tickClock(){
  var d = new Date();
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  var _sc=$('#statusClock'); if(_sc) _sc.textContent = hh + ':' + mm;
  var wd = ['日','一','二','三','四','五','六'];
  var _hd=$('#homeDate'); if(_hd) _hd.textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 · 星期' + wd[d.getDay()];
}

  var i = 0;

function stopLoadingFx(){

function showError(msg){

function runGeneration(input){
  lastInput = input;
  var sess = ++genSession;
  startLoading();
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  genCtrl = ctrl;
  callAPI(input, ctrl ? ctrl.signal : undefined).then(function(data){
    if(sess !== genSession) return;
    stopLoadingFx();
    buildFromData(data);
    renderPlayer();
    showScreen('scr-player');
  }).catch(function(err){
    if(sess !== genSession) return;
    showError(err && err.message ? err.message : String(err));
  });
}

function callAPI(input, signal){
  return new Promise(function(resolve, reject){
    var ctrl = null;
    var to = null;
    if(signal){
      signal.addEventListener('abort', function(){ reject(new Error('已取消')); });
    } else if('AbortController' in window){
      ctrl = new AbortController();
    }
    if(ctrl){ to = setTimeout(function(){ ctrl.abort(); }, 120000); }

    var body = {
      model: 'deepseek-chat',
      messages: [
        { role:'system', content: SYSTEM_PROMPT },
        { role:'user', content: input }
      ],
      temperature: 0.85,
      max_tokens: 2600,
      stream: false,
      response_format: { type: 'json_object' }
    };
    var headers = { 'Content-Type': 'application/json' };
    if (PROXY.url) {
      headers['apikey'] = PROXY.anonKey;   // 代理模式：anon key 门禁，密钥在服务端
    } else {
      headers['Authorization'] = 'Bearer ' + DEEPSEEK_KEY; // 直连模式
    }
    var opts = {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body)
    };
    if(ctrl) opts.signal = ctrl.signal;

    fetch(API_URL, opts).then(function(res){
      if(to) clearTimeout(to);
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(j){
          var msg = 'HTTP ' + res.status;
          if(j && j.error && j.error.message) msg = j.error.message;
          if(res.status === 401) msg = '鉴权失败：直连模式为 API Key 无效，代理模式为 anon key 不匹配（' + msg + '）';
          throw new Error('生成失败：' + msg);
        });
      }
      return res.json();
    }).then(function(j){
      if(!j || !j.choices || !j.choices[0] || !j.choices[0].message || !j.choices[0].message.content){
        throw new Error('模型没有返回内容，请重试');
      }
      var data;
      try{ data = extractJSON(j.choices[0].message.content); }
      catch(e){ throw new Error('返回内容解析失败，请重试'); }
      if(!data || !Array.isArray(data.sections) || data.sections.length < 3){
        throw new Error('返回结构不完整，请重试');
      }
      resolve(data);
    }).catch(function(e){
      if(to) clearTimeout(to);
      if(e && e.name === 'AbortError'){ reject(new Error('请求超时（超过 120 秒），请检查网络后重试')); return; }
      if(e && e.message && e.message.indexOf('Failed to fetch') >= 0){
        reject(new Error('网络连接失败，请检查网络（或接口跨域受限）后重试')); return;
      }
      reject(e);
    });
  });
}

function extractJSON(s){
  s = String(s).trim().replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a) s = s.slice(a, b+1);
  return JSON.parse(s);
}

/* ================= 文本分句与停顿 ================= */
function splitSentences(text){
  var parts = [], buf = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    buf += ch;
    if('。！？!?；;\n'.indexOf(ch) >= 0){
      if(buf.trim()) parts.push(buf.trim());
      buf = '';
    }
  }
  if(buf.trim()) parts.push(buf.trim());
  var out = [];
  parts.forEach(function(p){
    p = p.replace(/^[\s，,、]+/, '');
    if(!p) return;
    if(p.length <= 90){ out.push(p); return; }
    var sub = '';
    for(var j=0;j<p.length;j++){
      sub += p[j];
      if('，,、：:'.indexOf(p[j]) >= 0 && sub.length >= 40){
        out.push(sub.trim()); sub = '';
      }
    }
    if(sub.trim()) out.push(sub.trim());
  });
  return out.length ? out : [text];
}

/* 4-7-8 呼吸节奏：计数句开启精确计时窗（4/7/8 秒整）。
   两个呼吸指令之间的间歇必须精确等于窗长；窗内解说（吸气时，想象…）
   顺延朗读并算入窗长，装不下的自动顺延到下一窗，本段末窗兜底播完。 */
function holdMs(text){
  var s = text.replace(/[。！？.!?…～\s]+$/, '');
  if(/(四|4)秒$/.test(s)) return 4000;
  if(/(七|7)秒$/.test(s)) return 7000;
  if(/(八|8)秒$/.test(s)) return 8000;
  return 0;
}
/* 通篇排程，生成播放序 player.seq（顺延的解说会被重排进后面的窗）：
   normal 普通句 / wfull 整窗静默 / wstart 计数句开窗 / wmid 窗中解说 / wend 窗尾解说 */
function planHolds(){
  var flat = player.flat, seq = [], carry = [];
  var i = 0;
  while(i < flat.length){
    var W = holdMs(flat[i].text);
    if(!W){ seq.push({ fi: i, role: 'normal' }); i++; continue; }
    /* 本窗自带解说：同段内、非计数结尾的后续句 */
    var own = [], j = i + 1;
    while(j < flat.length && flat[j].si === flat[i].si && !holdMs(flat[j].text)){ own.push(j); j++; }
    /* 段内是否还有更晚的计数窗（末窗需兜底播完所有顺延内容） */
    var lastWin = true;
    for(var k = j; k < flat.length; k++){
      if(flat[k].si !== flat[i].si) break;
      if(holdMs(flat[k].text)){ lastWin = false; break; }
    }
    var queue = carry.concat(own);
    carry = [];
    var used = 0, n = 0;
    if(lastWin){
      n = queue.length;                         /* 末窗：全部装入（可超窗） */
    }else{
      while(n < queue.length){                  /* 贪心装句，保持原顺序 */
        var need = 400 + estMs(flat[queue[n]].text);
        if(used + need <= W){ used += need; n++; } else break;
      }
    }
    if(n === 0){
      seq.push({ fi: i, role: 'wfull', W: W });
    }else{
      seq.push({ fi: i, role: 'wstart', W: W });
      var winUsed = 0;
      for(var m = 0; m < n; m++){
        winUsed += 400 + estMs(flat[queue[m]].text);
        seq.push({ fi: queue[m], role: (m === n - 1) ? 'wend' : 'wmid', W: W, winUsed: winUsed });
      }
    }
    carry = queue.slice(n);
    i = j;
  }
  player.seq = seq;
}
/* 本句读完后停多久：窗按真实朗读耗时结算，两种语音引擎通用 */
function gapAfter(st){
  if(!st) return 420;
  if(st.role === 'wfull') return st.W;                 /* 整窗精确静默 */
  if(st.role === 'wstart'){ player.holdT0 = Date.now(); return 400; }
  if(st.role === 'wmid') return 400;                   /* 窗中解说连读 */
  if(st.role === 'wend'){                              /* 窗尾：补足剩余，保证间歇=窗长 */
    var used = player.holdT0 ? (Date.now() - player.holdT0) : st.W;
    return Math.max(300, st.W - used);
  }
  return 420;
}
function estMs(text){
  return Math.max(1400, text.length / 3.6 * 1000 / player.rate);
}
function estTotal(){
  var t = 0;
  (player.seq || []).forEach(function(st){
    t += estMs(player.flat[st.fi].text);
    if(st.role === 'normal') t += 420;
    else if(st.role === 'wfull') t += st.W;
    else if(st.role === 'wend') t += Math.max(300, st.W - (st.winUsed || st.W));
    else t += 400;
  });
  return t;
}

/* ================= 语音 ================= */
var voices = [];
function loadVoices(){
  try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  if(!voices.length) return null;
  var zh = voices.filter(function(v){ return /zh|cmn/i.test(v.lang || ''); });
  if(!zh.length) return null;
  var prefer = ['Xiaoxiao','Yunxi','Yunyang','Yunye','Tingting','Ting-Ting','Mei-Jia','Meijia','Sinji','Huihui','Yaoyao','Lili','Google'];
  for(var i=0;i<prefer.length;i++){
    for(var j=0;j<zh.length;j++){
      if((zh[j].name || '').indexOf(prefer[i]) >= 0) return zh[j];
    }
  }
  for(var k=0;k<zh.length;k++){ if(/CN/i.test(zh[k].lang || '')) return zh[k]; }
  return zh[0];
}

/* ================= Qwen3-TTS 语音合成（GPU 服务器，自然中文音色） ================= */
var EDGE_VOICES = (window.TC_TTS && TC_TTS.VOICES) || [];
/* 语音合成统一入口（TC_TTS → GPU 服务器 Qwen3-TTS-VoiceDesign；voice 为音色 ID） */
function edgeTTS(text, voice, ratePct){
  if(!(window.TC_TTS && TC_TTS.synth)) return Promise.reject(new Error('TTS 模块未加载'));
  var speed = Math.max(-2, Math.min(6, Math.round(ratePct / 50)));
  return TC_TTS.synth(text, voice, speed).then(function(blobs){
    /* 句子已拆分，通常单段 */
    return blobs[0];
  });
}

var EDGE = {
  ok: true,             /* Qwen3-TTS；连续失败才降级系统语音 */
  warned: false,
  fails: 0,             /* 连续失败计数（成功即清零） */
  voice: EDGE_VOICES.length ? EDGE_VOICES[0].id : 101001,
  cache: new Map(),     /* 'voice|rate|text' → Promise<Blob> */
  audio: null, url: null
};
function edgeFail(){
  EDGE.fails++;
  if(EDGE.fails >= 3 && EDGE.ok){
    EDGE.ok = false;
    if(!EDGE.warned){ EDGE.warned = true; toast('自然语音暂不可用，已切换系统语音'); }
  }
}
try{
  var savedVoice = parseInt(localStorage.getItem('ld_voice'), 10);
  for(var ev=0; ev<EDGE_VOICES.length; ev++){
    if(EDGE_VOICES[ev].id === savedVoice){ EDGE.voice = savedVoice; break; }
  }
}catch(e){}
function voiceLabel(){
  for(var i=0;i<EDGE_VOICES.length;i++){ if(EDGE_VOICES[i].id === EDGE.voice) return EDGE_VOICES[i].label; }
  return '温柔女声';
}

function edgeAudio(text){
  var key = EDGE.voice + '|' + player.rate + '|' + text;
  if(EDGE.cache.has(key)) return EDGE.cache.get(key);
  /* Qwen3-TTS 服务端合成，前端直接播放音频 Blob */
  var p = edgeTTS(text, EDGE.voice, Math.round((player.rate - 1) * 100));
  p.catch(function(){ EDGE.cache.delete(key); });
  if(EDGE.cache.size > 160) EDGE.cache.delete(EDGE.cache.keys().next().value);
  EDGE.cache.set(key, p);
  return p;
}

function stopEdgeAudio(){
  if(EDGE.audio){
    try{ EDGE.audio.pause(); }catch(e){}
    EDGE.audio.onended = null;
    EDGE.audio.onerror = null;
    EDGE.audio = null;
  }
  if(EDGE.url){
    try{ URL.revokeObjectURL(EDGE.url); }catch(e){}
    EDGE.url = null;
  }
}

function playEdgeBlob(blob, st, token, next){
  var it = player.flat[st.fi];
  stopEdgeAudio();
  EDGE.url = URL.createObjectURL(blob);
  var a = new Audio(EDGE.url);
  EDGE.audio = a;
  a.onended = function(){
    if(token !== player.token || !player.playing) return;
    next(gapAfter(st));
  };
  a.onerror = function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  };
  a.play().catch(function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  });
}

/* ================= 播放器 ================= */
var player = {
  data: null, sections: [], flat: [], seq: [], idx: 0,
  playing: false, finished: false, token: 0,
  rate: 0.85, timer: null, tick: null,
  startAt: 0, elapsedBase: 0, ttsOk: true, holdT0: 0
};
try{
  var savedRate = parseFloat(localStorage.getItem('ld_rate'));
  if(savedRate === 0.75 || savedRate === 0.85 || savedRate === 0.95) player.rate = savedRate;
}catch(e){}

var SHORT_LABELS = {
  '承接与确认':'承接', '逻辑推演到终点':'推演', '认知转换':'转换',
  '身体放松引导':'放松', '身体放松':'放松', '晚安收尾':'晚安'
};
function shortLabel(t){
  if(SHORT_LABELS[t]) return SHORT_LABELS[t];
  return t.length > 2 ? t.slice(0,2) : t;
}

function buildFromData(data){
  player.data = data;
  player.sections = (data.sections || []).filter(function(s){
    return s && s.text && String(s.text).trim();
  }).map(function(s){
    return { title: s.title || '引导', sentences: splitSentences(String(s.text).trim()) };
  });
  player.flat = [];
  player.sections.forEach(function(sec, si){
    sec.sentences.forEach(function(t, ii){
      player.flat.push({ si: si, ii: ii, text: t });
    });
  });
  planHolds();
  player.idx = 0;
  player.playing = false;
  player.finished = false;
  player.elapsedBase = 0;
  player.ttsOk = true;
  player.holdT0 = 0;
}

function renderPlayer(){
  var data = player.data || {};
  $('#typeChip').textContent = '思绪类型 · ' + (data.typeName || typeCN(data.type) || '待整理');
  $('#btnSpeed').textContent = player.rate.toFixed(2) + '×';
  $('#btnVoice').textContent = voiceLabel();

  /* 阶段条 */
  var bar = $('#stageBar');
  bar.innerHTML = '';
  player.sections.forEach(function(sec, i){
    var st = document.createElement('div');
    st.className = 'stage';
    st.innerHTML = '<div class="stage-dot"></div><div class="stage-label">' + shortLabel(sec.title) + '</div>';
    st.addEventListener('click', function(){ jumpToSection(i); });
    bar.appendChild(st);
  });

  /* 逐字稿 */
  var tr = $('#transcript');
  tr.innerHTML = '';
  var quote = document.createElement('div');
  quote.className = 'ts-quote';
  quote.innerHTML = '<div class="q-text"></div><div class="q-type"></div>';
  quote.querySelector('.q-text').textContent = data.summary || '';
  quote.querySelector('.q-type').textContent = '— ' + (data.typeName || '今晚的思绪');
  if(data.summary) tr.appendChild(quote);

  player.sections.forEach(function(sec, si){
    var secEl = document.createElement('div');
    secEl.className = 'ts-section';
    secEl.setAttribute('data-s', si);
    var head = document.createElement('div');
    head.className = 'ts-head';
    head.innerHTML = '<span class="ts-num">' + String(si+1).padStart(2,'0') + '</span><span class="ts-title"></span>';
    head.querySelector('.ts-title').textContent = sec.title;
    secEl.appendChild(head);
    sec.sentences.forEach(function(t, ii){
      var p = document.createElement('p');
      p.className = 'sent';
      p.setAttribute('data-i', ii);
      p.textContent = t;
      secEl.appendChild(p);
    });
    tr.appendChild(secEl);
  });

  setPlayIcon(false);
  $('#btnPlay').classList.add('ready');
  $('#elapsed').textContent = '0:00';
  $('#controlsHint').textContent = '点击播放，开始今晚的引导';
  var mins = Math.max(1, Math.round(estTotal() / 60000));
  $('#remainLabel').textContent = '全文约 ' + mins + ' 分钟';
  updateHighlight();
  updateProgress();
}

function typeCN(t){
  var m = {
    future:'未来的不确定', uncertain_regret:'不确定的懊悔', definite_regret:'确定的懊悔',
    sleep_anxiety:'对睡眠的焦虑', hypervigilance:'过度警觉', flashback:'情绪闪回', excitement:'过度兴奋'
  };
  return m[t] || null;
}

function currentSectionIdx(){
  var st = player.seq[player.idx];
  var it = st ? player.flat[st.fi] : null;
  return it ? it.si : Math.max(0, player.sections.length - 1);
}

function updateHighlight(){
  var st = player.seq[player.idx];
  var cur = st ? player.flat[st.fi] : null;
  var csi = cur ? cur.si : Math.max(0, player.sections.length - 1);
  var secs = $$('#transcript .ts-section');
  secs.forEach(function(el, i){
    el.classList.toggle('active', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#stageBar .stage').forEach(function(el, i){
    el.classList.toggle('cur', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#transcript .sent.now').forEach(function(e){ e.classList.remove('now'); });
  if(cur){
    var secEl = document.querySelector('#transcript .ts-section[data-s="' + cur.si + '"]');
    if(secEl){
      var el = secEl.querySelector('.sent[data-i="' + cur.ii + '"]');
      if(el){
        el.classList.add('now');
        var tr = $('#transcript');
        var top = el.offsetTop - tr.clientHeight * 0.4;
        try{ tr.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }catch(e){ tr.scrollTop = Math.max(0, top); }
      }
    }
  }
}

function updateProgress(){
  var pct = player.seq.length ? (player.idx / player.seq.length) * 100 : 0;
  if(player.finished) pct = 100;
  $('#progressFill').style.width = pct.toFixed(1) + '%';
}

function speakCurrent(){
  if(player.idx >= player.seq.length){ finish(); return; }
  var st = player.seq[player.idx];
  var it = player.flat[st.fi];
  updateHighlight();
  updateProgress();
  var token = ++player.token;

  function next(delay){
    player.timer = setTimeout(function(){
      if(token !== player.token || !player.playing) return;
      player.idx++;
      speakCurrent();
    }, delay);
  }

  /* 优先 Qwen3-TTS 自然音色，失败自动降级系统语音 */
  if(EDGE.ok){
    var p1 = player.seq[player.idx + 1], p2 = player.seq[player.idx + 2];
    if(p1) edgeAudio(player.flat[p1.fi].text);
    if(p2) edgeAudio(player.flat[p2.fi].text);
    edgeAudio(it.text).then(function(blob){
      if(token !== player.token || !player.playing) return;
      EDGE.fails = 0;
      playEdgeBlob(blob, st, token, next);
    }).catch(function(){
      if(token !== player.token || !player.playing) return;
      /* 瞬时失败先重试一次（失败缓存已被逐出，会真正重发） */
      edgeAudio(it.text).then(function(blob){
        if(token !== player.token || !player.playing) return;
        EDGE.fails = 0;
        playEdgeBlob(blob, st, token, next);
      }).catch(function(){
        if(token !== player.token || !player.playing) return;
        edgeFail();
        speakWeb(st, token, next);
      });
    });
    return;
  }

  speakWeb(st, token, next);
}

function speakWeb(st, token, next){
  var it = player.flat[st.fi];
  var useTTS = ('speechSynthesis' in window) && player.ttsOk;
  if(useTTS){
    var started = false;
    var u = new SpeechSynthesisUtterance(it.text);
    var v = pickVoice();
    if(v) u.voice = v;
    u.lang = 'zh-CN';
    u.rate = player.rate;
    u.pitch = 0.95;
    u.volume = 1;
    u.onstart = function(){ started = true; };
    u.onend = function(){
      if(token !== player.token || !player.playing) return;
      next(gapAfter(st));
    };
    u.onerror = function(){
      if(token !== player.token || !player.playing) return;
      next(300);
    };
    setTimeout(function(){
      if(token === player.token && player.playing && !started){
        player.ttsOk = false;
        try{ speechSynthesis.cancel(); }catch(e){}
        next(estMs(it.text));
      }
    }, 3500);
    try{
      speechSynthesis.speak(u);
    }catch(e){
      player.ttsOk = false;
      next(estMs(it.text));
    }
  } else {
    next(estMs(it.text));
  }
}

function startTick(){
  stopTick();
  player.tick = setInterval(function(){
    $('#elapsed').textContent = fmtTime(player.elapsedBase + (Date.now() - player.startAt));
  }, 500);
}
function stopTick(){
  if(player.tick){ clearInterval(player.tick); player.tick = null; }
}

function setPlayIcon(playing){
  $('#btnPlay').innerHTML = playing ? IC.pause : IC.play;
}

function play(){
  if(player.playing) return;
  player.playing = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  stopEdgeAudio();
  player.startAt = Date.now();
  startTick();
  setPlayIcon(true);
  $('#btnPlay').classList.remove('ready');
  $('#controlsHint').textContent = '正在播放 · 熄屏可能中断语音';
  speakCurrent();
}
function pause(){
  if(!player.playing) return;
  player.playing = false;
  player.token++;
  clearTimeout(player.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  stopEdgeAudio();
  player.elapsedBase += Date.now() - player.startAt;
  stopTick();
  setPlayIcon(false);
  $('#controlsHint').textContent = '已暂停 · 点击继续';
}
function togglePlay(){
  if(player.playing){ pause(); return; }
  if(player.finished){
    player.idx = 0;
    player.finished = false;
    player.elapsedBase = 0;
    $('#goodnight').classList.remove('show');
    play();
    return;
  }
  play();
}

function finish(){
  player.playing = false;
  player.finished = true;
  player.idx = player.seq.length;
  player.token++;
  clearTimeout(player.timer);
  stopTick();
  setPlayIcon(false);
  updateHighlight();
  updateProgress();
  $('#elapsed').textContent = fmtTime(player.elapsedBase + (Date.now() - player.startAt));
  $('#controlsHint').textContent = '引导已完成 · 点击播放可再听一遍';
  $('#goodnight').classList.add('show');
}

function stopAll(){
  player.playing = false;
  player.token++;
  clearTimeout(player.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  stopEdgeAudio();
  stopTick();
  setPlayIcon(false);
  $('#goodnight').classList.remove('show');
}

function jumpToSection(si){
  if(si < 0 || si >= player.sections.length) return;
  var start = -1;
  for(var i=0;i<player.seq.length;i++){
    if(player.flat[player.seq[i].fi].si === si){ start = i; break; }
  }
  if(start < 0) return;
  var wasPlaying = player.playing;
  player.token++;
  clearTimeout(player.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  stopEdgeAudio();
  if(wasPlaying) player.elapsedBase += Date.now() - player.startAt;
  player.idx = start;
  player.finished = false;
  $('#goodnight').classList.remove('show');
  if(wasPlaying){
    player.startAt = Date.now();
    speakCurrent();
  } else {
    updateHighlight();
    updateProgress();
  }
}
function stepSection(dir){
  var csi = currentSectionIdx();
  jumpToSection(csi + dir);
}

function cycleRate(){
  var rates = [0.75, 0.85, 0.95];
  var i = rates.indexOf(player.rate);
  player.rate = rates[(i + 1) % rates.length];
  try{ localStorage.setItem('ld_rate', String(player.rate)); }catch(e){}
  $('#btnSpeed').textContent = player.rate.toFixed(2) + '×';
  var mins = Math.max(1, Math.round(estTotal() / 60000));
  $('#remainLabel').textContent = '全文约 ' + mins + ' 分钟';
  if(player.playing){
    player.token++;
    clearTimeout(player.timer);
    try{ speechSynthesis.cancel(); }catch(e){}
    stopEdgeAudio();
    speakCurrent();
  }
  toast('语速 ' + player.rate.toFixed(2) + '×');
}

function cycleVoice(){
  if(!EDGE_VOICES.length) return;
  var i = 0;
  for(var k=0;k<EDGE_VOICES.length;k++){ if(EDGE_VOICES[k].id === EDGE.voice){ i = k; break; } }
  var nv = EDGE_VOICES[(i + 1) % EDGE_VOICES.length];
  EDGE.voice = nv.id;
  try{ localStorage.setItem('ld_voice', nv.id); }catch(e){}
  $('#btnVoice').textContent = nv.label;
  if(player.playing){
    player.token++;
    clearTimeout(player.timer);
    try{ speechSynthesis.cancel(); }catch(e){}
    stopEdgeAudio();
    speakCurrent();
  }
  toast('音色 · ' + nv.label);
}

function setMixPowerUI(on){

function renderMixFold(){
  function fill(bodyId, list, selIdx, onClick){
    var c = $(bodyId); c.innerHTML = '';
    list.forEach(function(t, i){
      var b = document.createElement('button');
      b.className = 'fold-opt' + (i === selIdx ? ' active' : '');
      b.innerHTML =
        '<span class="fold-opt-name">' + t.name + '</span>' +
        '<span class="fold-opt-sub">' + t.sub + '</span>' +
        '<svg class="fold-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      b.addEventListener('click', function(){ onClick(i); });
      c.appendChild(b);
    });
  }
  fill('#foldBodyMusic', MIX.music, MIX.selMusic, function(i){
    MIX.selMusic = (MIX.selMusic === i) ? -1 : i;
    onMixTrackChange('music');
  });
  fill('#foldBodyNoise', MIX.noise, MIX.selNoise, function(i){
    MIX.selNoise = (MIX.selNoise === i) ? -1 : i;
    onMixTrackChange('noise');
  });
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  var mSel = $('#foldSelMusic');
  mSel.textContent = mt ? mt.name : '未选择';
  mSel.classList.toggle('none', !mt);
  var nSel = $('#foldSelNoise');
  nSel.textContent = nt ? nt.name : '未选择';
  nSel.classList.toggle('none', !nt);
}

function updateMixCard(kind){
  var list = kind === 'music' ? MIX.music : MIX.noise;
  var idx  = kind === 'music' ? MIX.selMusic : MIX.selNoise;
  var t    = idx >= 0 ? list[idx] : null;
  var artEl   = $(kind === 'music' ? '#musicCardArt'  : '#noiseCardArt');
  var glyphEl = $(kind === 'music' ? '#musicCardGlyph' : '#noiseCardGlyph');
  var nameEl  = $(kind === 'music' ? '#musicName' : '#noiseName');
  var subEl   = $(kind === 'music' ? '#musicSub'  : '#noiseSub');
  if(t){
    artEl.style.background = t.bg;
    glyphEl.textContent = t.name.charAt(0);
  } else {
    artEl.style.background = kind === 'music' ? 'linear-gradient(135deg,#b48ef2,#6b4fb8)' : 'linear-gradient(135deg,#5a6a88,#2a3450)';
    glyphEl.textContent = '';
  }
  nameEl.textContent = t ? t.name : '—';
  if(!t){ subEl.textContent = '未选择'; subEl.style.color = ''; }
  else if(!t.src){ subEl.textContent = '占位 · 即将上线'; subEl.style.color = ''; }
  else { subEl.textContent = t.sub; subEl.style.color = ''; }
}

function onMixTrackChange(kind){
  renderMixFold();
  if(kind) updateMixCard(kind);
  if(!MIX._inited) return;
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  if(MIX.aMusic){
    var newSrc = mt && mt.src ? mt.src : '';
    if(MIX.aMusic.src !== location.origin + '/' + newSrc && !(newSrc === '' && !MIX.aMusic.src)){
      try { MIX.aMusic.pause(); } catch(e){}
      MIX.aMusic.src = newSrc;
    }
  }
  if(MIX.aNoise){
    var newSrc2 = nt && nt.src ? nt.src : '';
    if(MIX.aNoise.src !== location.origin + '/' + newSrc2 && !(newSrc2 === '' && !MIX.aNoise.src)){
      try { MIX.aNoise.pause(); } catch(e){}
      MIX.aNoise.src = newSrc2;
    }
  }
  if(MIX.playing) startMixPlayback();
}

function getNoiseBase(){
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  return (nt && nt.base) ? nt.base : 1;
}

function startMixPlayback(){
  var any = false;
  if(MIX.aMusic && MIX.aMusic.src){
    MIX.aMusic.volume = MIX.musicVol;
    MIX.aMusic.loop = true;
    MIX.aMusic.currentTime = 0;
    MIX.aMusic.play().catch(function(){});
    any = true;
  }
  if(MIX.aNoise && MIX.aNoise.src){
    MIX.aNoise.volume = Math.min(1, MIX.noiseVol * getNoiseBase());
    MIX.aNoise.loop = true;
    MIX.aNoise.currentTime = 0;
    MIX.aNoise.play().catch(function(){});
    any = true;
  }
  setMixPowerUI(any);
  if(!any) toast('所选项暂未提供音源');
}

function stopMixPlayback(){
  if(MIX.aMusic){ try{ MIX.aMusic.pause(); }catch(e){} }
  if(MIX.aNoise){ try{ MIX.aNoise.pause(); }catch(e){} }
  setMixPowerUI(false);
}

function toggleMixPower(){
  if(MIX.playing){ stopMixPlayback(); return; }
  if(MIX.selMusic < 0 && MIX.selNoise < 0){ toast('请先选择音乐或白噪音'); return; }
  startMixPlayback();
}

function bindMixSlider(id, labelId, setVol){
  var el = $(id);
  el.value = Math.round(setVol() * 100);
  $(labelId).textContent = el.value + '%';
  el.style.setProperty('--p', el.value + '%');
  el.addEventListener('input', function(){
    var v = el.value / 100;
    setVol(v);
    $(labelId).textContent = el.value + '%';
    el.style.setProperty('--p', el.value + '%');
  });
}

  MIX.aMusic = new Audio(); MIX.aMusic.loop = true; MIX.aMusic.volume = MIX.musicVol; MIX.aMusic.preload = 'auto';

  bindMixSlider('#mixNoiseVol', '#mixNoiseVolLabel', function(v){ if(v !== undefined) MIX.noiseVol = v; return MIX.noiseVol; });
}

/* ================= Function 7：睡前阅读倒计时 ================= */
var READ = {
  dur: 0,            // 默认 00:00（秒）
  remain: 0,
  running: false,
  startedAt: 0,
  timer: null,
  audioOn: false,      // 鼓励音频
  remindOn: false,     // 自定义提醒气泡
  remindText: '不要划出去，继续阅读',
  audioEvery: 300,     // 每 5 分钟一次
  lastAudioAt: 0,
  audioEl: null,
  _inited: false,
  _settingsOpen: false
};

var READ_PHRASES = [
  '继续保持，您做得很好',
  '再坚持一会儿就好',
  '专注阅读，身心都在安顿',
  '把注意力交还给这一页',
  '您的状态很平稳，慢慢来'
];

function readFmt(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return { m: m, s: s };
}

function readRender(){
  var t = readFmt(READ.remain);
  $('#readMin').textContent = String(t.m).padStart(2,'0');
  $('#readSec').textContent = String(t.s).padStart(2,'0');
}

function readTick(){
  if(!READ.running) return;
  var elapsed = Math.floor((Date.now() - READ.startedAt) / 1000);
  READ.remain = Math.max(0, READ.dur - elapsed);
  readRender();
  if(READ.audioOn && elapsed - READ.lastAudioAt >= READ.audioEvery && READ.remain > 30){
    READ.lastAudioAt = elapsed;
    readPlayPhrase(READ_PHRASES[Math.floor(Math.random() * READ_PHRASES.length)]);
  }
  if(READ.remain <= 0){ readFinish(); return; }
  READ.timer = setTimeout(readTick, 250);
}

function readPlayPhrase(text){
  if(!(window.TC_TTS && TC_TTS.synth)){ return; }
  TC_TTS.synth(text, EDGE.voice, -0.3).then(function(blobs){
    if(!blobs || !blobs.length) throw 0;
    if(!READ.audioEl) READ.audioEl = new Audio();
    if(READ.audioEl.src){ try{ URL.revokeObjectURL(READ.audioEl.src); }catch(e){} }
    READ.audioEl.src = URL.createObjectURL(blobs[0]);
    READ.audioEl.volume = 0.55;
    READ.audioEl.play().catch(function(){});
  }).catch(function(){});
}

function readStart(){
  if(READ.running) return;
  if(READ.remain <= 0) return;
  READ.running = true;
  READ.startedAt = Date.now() - ((READ.dur - READ.remain) * 1000);
  READ.lastAudioAt = 0;
  readTick();
  toast('开始阅读');
}
function readPause(){
  READ.running = false;
  clearTimeout(READ.timer);
}
function readStop(){
  readPause();
  readRender();
  hideBubble();
}
function readAdjust(deltaSec){
  READ.dur = Math.max(0, Math.min(30 * 60, READ.dur + deltaSec));
  if(!READ.running) READ.remain = READ.dur;
  readRender();
}
function readClear(){
  readPause();
  READ.dur = 0;
  READ.remain = 0;
  readRender();
  hideBubble();
}

function readFinish(){
  readPause();
  readRender();
  hideBubble();
  // 自动进入后续睡眠流程：goodnight 覆盖层
  $('#goodnight').classList.add('show');
  readPlayPhrase('阅读结束了，放下手机，准备入睡吧。');
}

function showBubble(){
  if(!READ.remindOn || !READ.remindText){ hideBubble(); return; }
  $('#readBubble').textContent = READ.remindText;
  $('#readBubble').classList.add('show');
}
function hideBubble(){
  $('#readBubble').classList.remove('show');
}

function openReadSettings(){
  $('#rsAudio').classList.toggle('on', READ.audioOn);
  $('#rsAudio').setAttribute('aria-checked', READ.audioOn ? 'true':'false');
  $('#rsRemind').classList.toggle('on', READ.remindOn);
  $('#rsRemind').setAttribute('aria-checked', READ.remindOn ? 'true':'false');
  $('#rsInput').value = READ.remindText;
  $$('.rs-preset').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-text') === READ.remindText);
  });
  $('#readSettingsBg').classList.add('show');
  $('#readSettings').classList.add('show');
  READ._settingsOpen = true;
}
function closeReadSettings(){
  $('#readSettingsBg').classList.remove('show');
  $('#readSettings').classList.remove('show');
  READ._settingsOpen = false;

/* ---- 快捷混音弹窗（复用 MIX 引擎，阅读页内完成设置） ---- */
function openQuickMix(){
  if(typeof MIX !== 'undefined' && !MIX._inited) initMix();

  $('#qmSheet').classList.add('show');
}
function closeQuickMix(){
  $('#qmBg').classList.remove('show');
  $('#qmSheet').classList.remove('show');
}
function renderQuickMix(){
  var mc = $('#qmMusicChips'); mc.innerHTML = '';
  MIX.music.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'qm-chip' + (i === MIX.selMusic ? ' active' : '');
    b.textContent = t.name;
    b.addEventListener('click', function(){ quickMixSelect('music', i); });
    mc.appendChild(b);
  });
  var nc = $('#qmNoiseChips'); nc.innerHTML = '';
  MIX.noise.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'qm-chip' + (i === MIX.selNoise ? ' active' : '');
    b.textContent = t.name;
    b.addEventListener('click', function(){ quickMixSelect('noise', i); });
    nc.appendChild(b);
  });
  var mv = $('#qmMusicVol'); mv.value = Math.round(MIX.musicVol * 100);
  mv.style.setProperty('--p', mv.value + '%');
  $('#qmMusicVolLabel').textContent = mv.value + '%';
  var nv = $('#qmNoiseVol'); nv.value = Math.round(MIX.noiseVol * 100);
  nv.style.setProperty('--p', nv.value + '%');
  $('#qmNoiseVolLabel').textContent = nv.value + '%';
}
function quickMixSelect(kind, i){
  if(kind === 'music') MIX.selMusic = (MIX.selMusic === i) ? -1 : i;
  else MIX.selNoise = (MIX.selNoise === i) ? -1 : i;
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  if(MIX.aMusic){
    var s1 = mt && mt.src ? mt.src : '';
    var cur1 = MIX.aMusic.getAttribute('src') || '';
    if(cur1 !== s1 && !(s1 === '' && !cur1)){ try{ MIX.aMusic.pause(); }catch(e){} MIX.aMusic.src = s1; }
  }
  if(MIX.aNoise){
    var s2 = nt && nt.src ? nt.src : '';
    var cur2 = MIX.aNoise.getAttribute('src') || '';
    if(cur2 !== s2 && !(s2 === '' && !cur2)){ try{ MIX.aNoise.pause(); }catch(e){} MIX.aNoise.src = s2; }
  }
  if(MIX.selMusic >= 0 || MIX.selNoise >= 0){ startMixPlayback(); }
  else { stopMixPlayback(); }
  if(typeof renderMixFold === 'function') renderMixFold();
  if(typeof updateMixCard === 'function'){ updateMixCard('music'); updateMixCard('noise'); }
  renderQuickMix();
}

/* 视频播放可靠性：自动播放被拒/中途被暂停时自动恢复（muted 循环背景视频，无用户暂停场景） */
function ensureVideoPlay(v){
  function tryPlay(){ if(v.paused && !v.ended){ var p = v.play(); if(p && p.catch) p.catch(function(){}); } }
  tryPlay();
  v.addEventListener('canplay', tryPlay);
  v.addEventListener('loadeddata', tryPlay);
  ['pointerdown','touchstart','click','keydown'].forEach(function(ev){
    document.addEventListener(ev, tryPlay, { passive: true });
  });
  v.addEventListener('pause', function(){ setTimeout(tryPlay, 250); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tryPlay(); });
}

function initReadVideo(){
  var vid = $('#readVid');
  var canvas = $('#readVidCanvas');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;   // 处理分辨率（视频 2160x3840 的 1/4）
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
        /* 色度抠白：白色=高亮且低饱和（不误伤羊的奶白色等浅色主体） */
        if(mx >= 235 && mx - mn < 22){ d[i+3] = 0; }
        else if(mn >= 200 && mx - mn < 45){ d[i+3] = ((255 - mx) * 255 / 40) | 0; }  // 边缘羽化
      }
      /* 擦除底部圆形（音乐按钮）和右侧长条（彩条）：540×960 坐标
         圆形用圆形遮罩、长条用紧贴元素的矩形遮罩，避免矩形外溢显出米色页底 */
      for(var y = 815; y < 960; y++){
        for(var x = 0; x < 165; x++){
          var dx = x - 77, dy = y - 892;
          if(dx*dx + dy*dy <= 72*72){ d[(y * W + x) * 4 + 3] = 0; }
        }
      }
      for(var y = 685; y < 960; y++){
        for(var x = 485; x < 540; x++){
          d[(y * W + x) * 4 + 3] = 0;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  ensureVideoPlay(vid);
  requestAnimationFrame(chromaFrame);
}

function initReadVideo2(){
  var vid = $('#readVid2');
  var canvas = $('#readVidCanvas2');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        var mx = Math.max(r,g,b), mn = Math.min(r,g,b);
        /* 保守抠白：melatonin2 含羊的奶白色，只抠纯白背景 */
        if(mx >= 245 && mx - mn < 14){ d[i+3] = 0; }
        else if(mn >= 228 && mx - mn < 30){ d[i+3] = ((255 - mx) * 255 / 40) | 0; }  // 边缘羽化
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  ensureVideoPlay(vid);
  requestAnimationFrame(chromaFrame);
}

function initRead(){

  $$('.rs-preset').forEach(function(el){

(function() {

  /* ===== 阅读音乐 ===== */
  var MUSIC = [
    { name:'钢琴', sub:'轻柔琴键', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/sleep.m4a' },
    { name:'自然', sub:'林间清风', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/soft-lullaby.m4a' },
    { name:'朝霞', sub:'晨光微曦', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/soft-morning-light.m4a' },
    { name:'柔弦', sub:'舒缓漂移', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/Soft%20Sine%20Drift.mp3' },
    { name:'弦梦', sub:'梦境漂浮', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/Soft%20Sine%20Drift%20(1).mp3' }
  ];

  var musicBtn = document.getElementById('musicBtn');
  var musicMask = document.getElementById('musicMask');
  var musicList = document.getElementById('musicList');
  var musicClose = document.getElementById('musicClose');
  var musicAudio = new Audio();
  musicAudio.loop = true;
  musicAudio.volume = 0.6;
  var curMusic = -1;
  var musicPlaying = false;

  function renderMusicList() {
    musicList.innerHTML = '';
    MUSIC.forEach(function(m, i) {
      var btn = document.createElement('button');
      btn.className = 'music-item' + (i === curMusic ? ' active' : '');
      btn.innerHTML = '<svg class="m-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><div><div class="m-name"></div><div class="m-sub"></div></div>';
      btn.querySelector('.m-name').textContent = m.name;
      btn.querySelector('.m-sub').textContent = m.sub;
      btn.addEventListener('click', function() { playMusic(i); });
      musicList.appendChild(btn);
    });
  }

  function playMusic(i) {
    if (i === curMusic && musicPlaying) { pauseMusic(); return; }
    curMusic = i;
    var m = MUSIC[i];
    musicAudio.src = m.src;
    musicAudio.play().then(function() {
      musicPlaying = true;
      musicBtn.classList.add('playing');
      renderMusicList();
    }).catch(function() {
      musicPlaying = false;
    });
    closeMusic();
  }

  function pauseMusic() {
    musicAudio.pause();
    musicPlaying = false;
    musicBtn.classList.remove('playing');
    renderMusicList();
  }

  function resumeMusic() {
    musicAudio.play().then(function() {
      musicPlaying = true;
      musicBtn.classList.add('playing');
    }).catch(function(){});
  }

  function toggleMusic() {
    if (musicPlaying) { pauseMusic(); }
    else if (curMusic >= 0) { resumeMusic(); }
    else { openMusic(); }
  }

  function openMusic() {
    renderMusicList();
    musicMask.classList.add('show');
  }
  function closeMusic() {
    musicMask.classList.remove('show');
  }

  musicBtn.addEventListener('click', toggleMusic);
  musicClose.addEventListener('click', closeMusic);
  musicMask.addEventListener('click', function(e) {
    if (e.target === musicMask) closeMusic();
  });

  /* ===== 倒计时圆形进度条 ===== */
  var CIRC = 2 * Math.PI * 88; // 圆环周长 ≈ 552.92

  var total = 30 * 60, remain = total;
  var running = false, finished = false, timer = null;

  var timeText = document.getElementById('timeText');
  var statusText = document.getElementById('statusText');
  var ringFg = document.getElementById('ringFg');
  var btnStart = document.getElementById('btnStart');
  var btnStartText = document.getElementById('btnStartText');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');

  // 初始化圆环
  ringFg.style.strokeDasharray = CIRC;
  ringFg.style.strokeDashoffset = 0;

  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    timeText.textContent = pad(Math.floor(remain / 60)) + ':' + pad(remain % 60);
    // 环从满到空：remain/total
    var ratio = total > 0 ? (remain / total) : 0;
    ringFg.style.strokeDashoffset = CIRC * (1 - ratio);
  }

  function renderState() {
    btnStartText.textContent = running ? '暂停一下' : (finished ? '再读一次' : '开始阅读');
    iconPlay.style.display = running ? 'none' : '';
    iconPause.style.display = running ? '' : 'none';
    btnStart.classList.toggle('running', running);
  }

  function tick() {
    remain--;
    if (remain <= 0) {
      remain = 0;
      running = false; finished = true;
      clearInterval(timer); timer = null;
      if (musicPlaying) pauseMusic();
      statusText.textContent = '读完啦，合上书，晚安 ✦';
      render(); renderState();
      return;
    }
    render();
  }

  function startPause() {
    if (finished) { resetTo(total / 60); startPause(); return; }
    running = !running;
    if (running) {
      statusText.textContent = '慢慢读，不着急';
      timer = setInterval(tick, 1000);
    } else {
      clearInterval(timer); timer = null;
      statusText.textContent = '歇一会儿也没关系';
    }
    renderState();
  }

  function resetTo(min) {
    clearInterval(timer); timer = null;
    running = false; finished = false;
    total = remain = Math.max(5, Math.round(min)) * 60;
    statusText.textContent = '挑个时长，开读吧';
    render(); renderState();
  }

  btnStart.addEventListener('click', startPause);

  function adjust(delta) {
    var min = Math.max(5, Math.round(total / 60) + delta);
    min = Math.min(min, 120);
    var wasRunning = running;
    resetTo(min);
    if (wasRunning) { startPause(); }
    statusText.textContent = min + ' 分钟';
  }
  document.getElementById('btnPlus').addEventListener('click', function() { adjust(5); });
  document.getElementById('btnMinus').addEventListener('click', function() { adjust(-5); });

  render();
})();
</script>

<script src="tc-tts.js?v=2"></script>
<script>
(function() {
  'use strict';

  const BG1 = "url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheepimage/bg-page1.png') center/cover no-repeat";

  pagesEl.addEventListener('scroll', () => {
    const w = pagesEl.clientWidth;

  dots.forEach(dot => {
    dot.addEventListener('click', () => {

  document.querySelectorAll('.shell').forEach(shell => {
    shell.addEventListener('click', e => {
      e.stopPropagation();
      const name = shell.dataset.name || '';

        showToast('选择了：' + name);

  // ===== 三个放松练习语音脚本（不展示文字，只朗读） =====

    '渐进式肌肉放松': { text: [
