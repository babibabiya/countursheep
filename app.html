.celestial .star.s6 { width: 1px; height: 1px; bottom: 16%; right: 22%; animation-delay: 0.8s; }
.celestial .star.s7 { width: 1.5px; height: 1.5px; top: 42%; right: 10%; animation-delay: 1.3s; }
.celestial .star.s8 { width: 1px; height: 1px; bottom: 26%; left: 28%; animation-delay: 2.2s; }
.celestial .star.s9 { width: 1px; height: 1px; top: 22%; left: 40%; animation-delay: 0.3s; }
.celestial .star.s10 { width: 1.5px; height: 1.5px; top: 6%; left: 34%; animation-delay: 1.0s; }
.celestial .star.s11 { width: 1px; height: 1px; top: 30%; left: 6%; animation-delay: 0.7s; }
.celestial .star.s12 { width: 1.5px; height: 1.5px; top: 48%; left: 30%; animation-delay: 1.9s; }
.celestial .star.s13 { width: 1px; height: 1px; top: 66%; left: 34%; animation-delay: 0.4s; }
.celestial .star.s14 { width: 1px; height: 1px; bottom: 20%; left: 44%; animation-delay: 1.5s; }
.celestial .star.s15 { width: 1.5px; height: 1.5px; top: 36%; left: 44%; animation-delay: 2.4s; }
.celestial .star.s16 { width: 1px; height: 1px; top: 18%; left: 60%; animation-delay: 0.9s; }

@keyframes twinkle {
  0%, 100% { opacity: 0.12; transform: scale(0.75); }
  50% { opacity: 0.8; transform: scale(1.1); }

.rec-q { font-size: 15px; font-weight: 700; color: #3a2e1e; }
.rec-sub { font-size: 11px; color: #9a8a70; margin: 3px 0 8px; line-height: 1.5; }
.rec-input {

}
.rec-input:focus { border-color: #c8a878; }
.rec-btn {

  border: none; border-radius: 20px;

  cursor: pointer;
  box-shadow: 0 3px 8px rgba(90, 122, 168, 0.25);
}
.rec-btn:active { transform: scale(0.97); }
.rec-btn:disabled { opacity: 0.55; pointer-events: none; }

/* ============ 按钮列表 ============ */
.cards {
  flex: 1;
  display: flex;

  overflow-y: hidden;
  scroll-snap-type: x mandatory;

  -ms-overflow-style: none;

}
.cards::-webkit-scrollbar { display: none; }
.cards .page {
  flex: 0 0 100%;

  scrollbar-width: none;

}
.cards .page::-webkit-scrollbar { display: none; }

/* 分页导航栏 */
.pager {

}
.pager-arrow {

  background: rgba(255, 255, 255, 0.65); color: #4a6a98;

}
.pager-arrow:active { transform: scale(.88); }
.pager-arrow:disabled { opacity: .3; cursor: default; }
.pager-dots { display: flex; gap: 8px; }
.pager-dot {

  transition: background .2s, transform .2s;
}
.pager-dot.active { background: #4a6a98; transform: scale(1.3); }

.card {

}
.card:active { transform: scale(0.97); }
.card img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  filter: drop-shadow(0 4px 5px rgba(46, 34, 20, 0.55));

/* ============ 推荐结果弹层 ============ */
.rec-mask {

.rec-mask.show { opacity: 1; pointer-events: auto; }
.rec-modal {

.rec-desc { font-size: 13px; color: #7a6a50; line-height: 1.6; margin-bottom: 16px; }
.rec-actions { display: flex; gap: 10px; }
.rec-actions button {

.rec-start { background: linear-gradient(180deg, #7a9cc8 0%, #5a7aa8 100%); color: #fff; box-shadow: 0 3px 10px rgba(90,122,168,0.3); }

.rec-sec {

}
.rec-sec span { color: #6a5a42; font-weight: 600; }
.rec-close {
  margin-top: 14px; font-size: 12px; color: #b0a088;
  background: none; border: none; cursor: pointer; font-family: inherit;
}

/* ============ Toast ============ */
.toast {
  position: absolute;
  bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(40, 30, 20, 0.9);
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 400;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  max-width: 88%;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============ 用户协议弹窗 ============ */
.terms-mask {

</style>

          <div class="rec-sec" id="recSec" hidden>也可以试试：<span id="recSecName"></span></div>
          <button class="rec-close" id="recClose">先不用了，我自己逛逛</button>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 用户协议弹窗 -->
    <div class="terms-mask" id="termsMask">
      <div class="terms-modal">
        <div class="terms-title">欢迎使用「落定」</div>
        <div class="terms-app">L U Ò D Ì N G</div>
        <div class="terms-body">
          使用本应用前，请仔细阅读并同意<strong>《用户服务协议》</strong>。本应用提供睡眠引导与辅助服务，内容仅为生活辅助与信息参考，<strong>不构成医疗诊断或治疗建议</strong>。点击"同意并继续"即表示您已阅读并同意协议全部条款。
        </div>
        <button class="terms-view" id="termsView">查看《用户服务协议》全文</button>
        <div class="terms-actions">
          <button class="terms-agree" id="termsAgree">同意并继续</button>
          <button class="terms-disagree" id="termsDisagree">暂不同意</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function() {
  'use strict';

  // ====== DOM ======
  const toast = document.getElementById('toast');
  const recInput = document.getElementById('recInput');
  const recBtn = document.getElementById('recBtn');
  const recMask = document.getElementById('recMask');
  const recLoading = document.getElementById('recLoading');
  const recResult = document.getElementById('recResult');
  const recMsg = document.getElementById('recMsg');
  const recName = document.getElementById('recName');
  const recDesc = document.getElementById('recDesc');
  const recStart = document.getElementById('recStart');
  const recAdd = document.getElementById('recAdd');
  const recSec = document.getElementById('recSec');
  const recSecName = document.getElementById('recSecName');
  const recClose = document.getElementById('recClose');

  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ====== 内容审核（纯前端本地规则，不依赖 DeepSeek，拦截乱码/无意义输入） ======
  function isGarbled(text) {
    const s = String(text || '').trim();
    if (s.length < 2) return true;   // 过短
    if (s.length > 400) return true; // 超长

    const hasChinese = /[\u4e00-\u9fa5]/.test(s);
    const hasWord = /[a-zA-Z]{2,}/.test(s);

    // 1. 既无中文也无英文单词 → 纯符号/数字/emoji/乱码
    if (!hasChinese && !hasWord) return true;

    // 2. 键盘乱敲（同一行/相邻键连击，如 asdf、qwer、zxcv、hjkl 等）
    if (/(asdf|qwer|zxcv|hjkl|wert|sdfg|dfgh|fghj|ghjk|tyui|rtyu|yuiop|asd|qwe|zxc|hjk|jkl|fdsa|rewq|lkjh)/i.test(s)) return true;

    // 3. 无中文的随机字母数字混合（如 a8f3k9d2）
    if (!hasChinese && /^(?=.*[a-z])(?=.*\d)[a-z0-9]{6,}$/i.test(s)) return true;

    // 4. 纯数字 / 纯标点 / 纯符号
    if (/^[\d\s\p{P}\p{S}]+$/u.test(s)) return true;

    // 5. 去空格标点数字后有效字符种类过少（重复单字符，如 啊啊啊啊 / hahahaha / 哈哈哈哈）
    const compact = s.replace(/[\s\p{P}\d]/gu, '');
    if (compact.length >= 4 && new Set(compact).size <= 2) return true;

    return false;
  }

  // ====== 功能映射 ======
  const FUNC = {
    thought_box:       { name: '烦恼收纳箱',     desc: '把想说的话、放不下的事先写下来，收进箱子里。', page: 'box.html', dur: 10 },
    thought_completion:{ name: '引导入睡音频',   desc: '一段专属的睡前思绪整理，帮你把这件事想完、放下。', page: 'caignick.html?v=3', dur: 10 },
    reading:           { name: '睡前阅读',       desc: '放下手机，读一会儿，让脑子慢慢安静下来。', page: 'read.html', dur: 30 },
    relaxation:        { name: '放松练习',       desc: '呼吸、冥想、渐进放松，让紧绷的身体松弛下来。', page: 'relax.html', dur: 10 },
    white_noise:       { name: '白噪音',         desc: '自然声音盖住杂音，营造安静入睡的氛围。', page: 'sound.html', dur: 0 },
    music:             { name: '音乐',           desc: '听点轻柔安神的音乐，陪你慢慢入睡。', page: 'sound.html', dur: 0 },
    sleep_audio:       { name: '助眠音频',       desc: '舒缓的声音引导，帮你放松入睡。', page: 'sound.html', dur: 0 },
    safety:            { name: '陪伴与支持',     desc: '此刻你并不孤单，我们更想先陪你聊一聊。', page: 'safety', dur: 0 }
  };

  // ====== 推荐引擎 prompt（只做需求识别+功能推荐，不做心理诊断） ======
  const REC_PROMPT = [
    '你是一个睡眠辅助应用的「需求识别与功能推荐」引擎。用户会描述自己为什么睡不着。请判断用户此刻最需要什么，从下面的功能里选一个最合适的作为主推荐（primary_function），再选一个作为次推荐（secondary_function）。',
    '',
    '功能列表（只能从这些 id 里选）：',
    '- thought_box：烦恼收纳箱——表达、倾诉、把想法写下来、记录明天要做的事、安放悬而未决的担心',
    '- thought_completion：引导入睡音频——反复回想某件事、后悔、反刍、对未来的担忧、需要把一件事"想完放下"',
    '- reading：睡前阅读——脑子活跃但没有具体烦恼、单纯不困、想转移注意力',
    '- relaxation：放松练习——身体紧绷、心跳快、坐立不安、身体很清醒',
    '- white_noise：白噪音——被环境噪音干扰、想要安静氛围',
    '- music：音乐——想听点安神的东西',
    '- sleep_audio：助眠音频——想要舒缓声音引导入睡',
    '',
    '映射提示：想表达/倾诉/心里堵得慌 → thought_box；回想过去/后悔/反刍/翻来覆去想一件事 → thought_completion；对未来担忧/焦虑明天 → thought_completion；需要记住明天的事/任务清单 → thought_box；身体紧绷/心跳快/坐立不安/浑身酸痛 → relaxation；脑子活跃但无具体担忧 → reading；单纯不困/想刷手机又停不下来 → reading；环境噪音/室友吵/窗外吵 → white_noise；想听点安神的声音/有点孤单空落落 → music 或 white_noise；做噩梦/害怕/惊醒了 → thought_completion 或 sleep_audio；跟人吵架/生气/委屈/被误解 → thought_box；说不清具体原因、单纯睡不着（"不知道""没什么原因就是睡不着"）→ reading。',
    '',
    '要求：',
    '1. 不要诊断用户。不要写"你有焦虑症""你有情绪压抑"这类话；如需提及心理概念，用"这有点像……的模式"。',
    '2. message 用温暖、口语化的中文，一句话点出用户此刻的需求（例如"听起来你脑子里装了很多话，需要一个地方把它们安放下来。"），统一用"你"，不要长篇大论。',
    '3. 安全：如果用户提到自残、自杀、立即危险、被虐待等严重情况，primary_function 固定返回 "safety"，message 给予安抚与陪伴，并温和建议联系信任的人或专业帮助；此时 secondary_function 也返回 "safety"。',
    '4. 重要——不要轻易返回 "unclear"：用户输入常常是口语化、碎片化、带错别字甚至只有半句话。只要你能大致猜到方向（哪怕线索很少），就选最接近的功能推荐，并在 message 里温柔地回应用户可能想表达的意思。宁可合理地猜一个方向，也不要轻易说"没读懂"。只有输入是明显乱码（无意义字符、随机字母数字、键盘乱敲、纯符号）时才返回 "unclear"，并用温和、高情商、口语化的方式请用户重新表达（例如"我好像没太读懂你的意思，可以换个方式再跟我说说吗？"），不要指责。',
    '',
    '只输出 JSON，不要输出任何其他文字：',
    '{"need_type":"需求类型英文","primary_function":"主推荐功能id","secondary_function":"次推荐功能id","message":"一句话安抚+点出需求"}'
  ].join('\n');

  const PROXY = { url: 'https://u1147881-c7kl-35a69bfe.bjb1.seetacloud.com:8443/v1/chat/completions', anonKey: 'sleep-2026' };
  const DEEPSEEK_KEY = ''; // 密钥已移除（安全）：统一走中继，服务端持有真实密钥
  const API_URL = PROXY.url || 'https://api.deepseek.com/chat/completions';

  function analyzeReason(input) {
    /* 代理优先；代理网络失败时自动降级直连（两层保障） */
    if (PROXY.url) {
      return analyzeOnce(input, PROXY.url, true).catch(function(e) {
        if (e && e.name === 'AbortError') throw e;
        return analyzeOnce(input, 'https://api.deepseek.com/chat/completions', false);
      });
    }
    return analyzeOnce(input, API_URL, false);
  }

  function analyzeOnce(input, url, viaProxy) {
    return new Promise(function(resolve, reject) {
      const ctrl = ('AbortController' in window) ? new AbortController() : null;
      const to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 60000) : null;
      const body = {
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: REC_PROMPT },
          { role: 'user', content: input }
        ],
        temperature: 0.5,
        max_tokens: 400,
        stream: false,
        response_format: { type: 'json_object' }
      };
      const headers = {};
      if (viaProxy) {
        // 代理模式：key 放 body、Content-Type 用 text/plain（简单请求，避免手机浏览器 CORS 预检失败）
        body.key = PROXY.anonKey;
        headers['Content-Type'] = 'text/plain';
      } else {
        // 直连模式
        headers['Content-Type'] = 'application/json';
        headers['Authorization'] = 'Bearer ' + DEEPSEEK_KEY;
      }
      const opts = {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
      };
      if (ctrl) opts.signal = ctrl.signal;

      fetch(url, opts).then(function(res) {
        if (to) clearTimeout(to);
        if (!res.ok) {
          return res.json().catch(function(){ return null; }).then(function(j) {
            const msg = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + res.status);
            throw new Error(msg);
          });
        }
        return res.json();
      }).then(function(j) {
        if (!j || !j.choices || !j.choices[0] || !j.choices[0].message || !j.choices[0].message.content) {
          throw new Error('模型没有返回内容，请重试');
        }
        let raw = String(j.choices[0].message.content).trim();
        raw = raw.replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
        const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
        if (a >= 0 && b > a) raw = raw.slice(a, b + 1);
        const data = JSON.parse(raw);
        if (!data.primary_function) throw new Error('返回结构不完整');
        resolve(data);
      }).catch(function(e) {
        if (to) clearTimeout(to);
        if (e && e.name === 'AbortError') { reject(new Error('请求超时，请重试')); return; }
        reject(e);
      });
    });
  }

  // ====== 展示推荐 ======
  let currentRec = null;

  function showRecommend(data) {
    const pf = data.primary_function;
    const sec = data.secondary_function;
    const func = FUNC[pf] || FUNC.thought_box;
    currentRec = data;

    recLoading.hidden = true;
    recResult.hidden = false;
    recMsg.textContent = data.message || '';
    recName.textContent = func.name;
    recDesc.textContent = func.desc;

    // 安全路由：不推荐正常功能
    if (pf === 'safety') {
      recName.textContent = FUNC.safety.name;
      recDesc.textContent = '请优先联系你信任的人，或寻求专业帮助。你不是一个人，我们一直都在。';
      recStart.textContent = '我知道了';
      recAdd.hidden = true;
      recSec.hidden = true;
      currentRec.safety = true;
    } else if (pf === 'unclear') {
      // 高情商退回：没读懂，请用户重新输入
      recName.textContent = '再跟我说说';
      recDesc.textContent = '可以说说具体发生了什么，或者你此刻身体、心里的感觉。';
      recStart.textContent = '重新输入';
      recAdd.hidden = true;
      recSec.hidden = true;
      currentRec = { safety: true, unclear: true };
    } else {
      recStart.textContent = '立即开始';
      recAdd.hidden = false;
      if (sec && FUNC[sec] && sec !== pf) {
        recSec.hidden = false;
        recSecName.textContent = FUNC[sec].name;
      } else {
        recSec.hidden = true;
      }
      currentRec.safety = false;
    }
  }

  recBtn.addEventListener('click', function() {
    const text = recInput.value.trim();
    if (!text) { showToast('先写两句，告诉我你此刻的心情吧'); return; }
    if (isGarbled(text)) {
      showToast('我好像没太读懂你的意思，可以换种方式再跟我说说吗？');
      return;
    }
    recBtn.disabled = true;
    recBtn.textContent = '正在理解你的心情…';
    recLoading.hidden = false;
    recResult.hidden = true;
    recMask.classList.add('show');

    analyzeReason(text).then(function(data) {
      showRecommend(data);
    }).catch(function(e) {
      recMask.classList.remove('show');
      showToast('没能连上服务：' + (e.message || '请稍后再试'));
    }).finally(function() {
      recBtn.disabled = false;
      recBtn.textContent = '看看什么能帮到你';
    });
  });

  // 立即开始
  recStart.addEventListener('click', function() {
    if (!currentRec) return;
    if (currentRec.unclear) {
      recMask.classList.remove('show');
      recInput.focus();
      return;
    }
    if (currentRec.safety) {
      recMask.classList.remove('show');
      return;
    }
    const func = FUNC[currentRec.primary_function];
    if (func && func.page && func.page !== 'safety') {
      location.href = func.page;
    }
  });

  // 加入睡前流程
  recAdd.addEventListener('click', function() {
    if (!currentRec || currentRec.safety) return;
    const func = FUNC[currentRec.primary_function];
    try {
      localStorage.setItem('routine_add', JSON.stringify({
        type: currentRec.primary_function,
        name: func.name,
        dur: func.dur
      }));
    } catch(e) {}
    location.href = 'routine.html';
  });

  recClose.addEventListener('click', function() {
    recMask.classList.remove('show');
  });
  recMask.addEventListener('click', function(e) {
    if (e.target === recMask) recMask.classList.remove('show');
  });

  // ====== 各功能按钮跳转到对应独立页面 ======
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      const name = card.dataset.name;
      const map = {
        '引导入睡音频': 'caignick.html?v=3',
        '蔡格尼克': 'caignick.html?v=3',
        '白噪音': 'sound.html',
        '阅读倒计时': 'read.html',
        '放松练习': 'relax.html',
        '烦恼收藏箱': 'box.html',
        '日程': 'routine.html'
      };
      if (map[name]) {
        location.href = map[name];
      } else {
        showToast('点击了 ' + name);
      }
    });
  });

  // 月亮 → 查看用户协议
  const moonBtn = document.getElementById('moonBtn');
  if (moonBtn) {
    moonBtn.addEventListener('click', () => { location.href = 'agreement.html'; });
  }

  // ===== 用户协议：首次使用必须同意，否则不进入主页 =====
  const termsMask = document.getElementById('termsMask');
  const termsView = document.getElementById('termsView');
  const termsAgree = document.getElementById('termsAgree');
  const termsDisagree = document.getElementById('termsDisagree');

  // 查看协议全文
  if (termsView) termsView.addEventListener('click', () => { location.href = 'agreement.html'; });

  // 同意并继续
  if (termsAgree) termsAgree.addEventListener('click', () => {
    try { localStorage.setItem('agreed_terms', '1'); } catch (e) {}
    termsMask.classList.remove('show');
  });

  // 暂不同意：给出提示，不关闭（必须同意才能进主页）
  if (termsDisagree) termsDisagree.addEventListener('click', () => {
    showToast('同意协议后才能开始使用，谢谢理解');
  });

  // 首次使用检查：未同意则弹协议，且无法进入主页
  try {
    if (localStorage.getItem('agreed_terms') !== '1') {
      termsMask.classList.add('show');
    }
  } catch (e) {
    termsMask.classList.add('show');
  }

  // ===== 陪伴天数：温柔陪伴你的第 X 天（首次使用自动记录） =====
  const subtitleEl = document.getElementById('subtitle');
  if (subtitleEl) {
    (function() {
      let days = 1;
      try {
        const key = 'first_use_date';
        const today = new Date();
        const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        let first = localStorage.getItem(key);
        if (!first) {
          first = todayStr;
          localStorage.setItem(key, first);
        }
        const f = new Date(first + 'T00:00:00');
        const t = new Date(todayStr + 'T00:00:00');
        const diff = Math.round((t - f) / 86400000);
        days = Math.max(1, diff + 1);
      } catch (e) {}
      subtitleEl.textContent = '温柔陪伴你的第 ' + days + ' 个夜晚';
    })();
  }

  // ===== 底部左右分页导航 =====
  (function() {
    const cards = document.getElementById('cards');
    const prev = document.getElementById('pagerPrev');
    const next = document.getElementById('pagerNext');
    const dots = document.querySelectorAll('.pager-dot');
    if (!cards || !prev || !next) return;
    const totalPages = dots.length || 2;
    function curPage() { return Math.round(cards.scrollLeft / cards.clientWidth); }
    function update() {
      const p = Math.max(0, Math.min(totalPages - 1, curPage()));
      prev.disabled = p <= 0;
      next.disabled = p >= totalPages - 1;
      dots.forEach((d, i) => d.classList.toggle('active', i === p));
    }
    function go(p) {
      cards.scrollTo({ left: p * cards.clientWidth, behavior: 'smooth' });
    }
    prev.addEventListener('click', () => go(Math.max(0, curPage() - 1)));
    next.addEventListener('click', () => go(Math.min(totalPages - 1, curPage() + 1)));
    dots.forEach((d) => d.addEventListener('click', () => go(parseInt(d.dataset.page, 10))));
    cards.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();

})();
</script>

</body>
</html>
</template>

  .phone{
    position:relative;width:min(100vw, calc(100vh * 9 / 16));aspect-ratio:9/16;
    overflow:hidden;background:
      radial-gradient(90% 42% at 82% -6%, rgba(233,205,154,.10), transparent 60%),
      radial-gradient(70% 40% at 12% 106%, rgba(143,120,255,.14), transparent 60%),
      linear-gradient(180deg,#0c1126 0%,#0a0e1f 55%,#070a16 100%);
  }

  /* ---------- starfield ---------- */
  #starfield{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;border-radius:50%;background:#fff;animation:tw linear infinite;}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}

  /* ---------- status bar ---------- */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:46px;z-index:6;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 4px;font-size:13px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.4px;
  }
  .sb-right{display:flex;align-items:center;gap:5px;opacity:.85;}
  .sb-right svg{width:20px;height:11px;}

  /* ---------- screens ---------- */
  .screens{position:absolute;inset:0;top:46px;z-index:2;}
  .screen{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;transform:translateX(26px);pointer-events:none;
    transition:opacity .34s ease,transform .34s ease;
    padding:14px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .screen.active{opacity:1;transform:none;pointer-events:auto;}
  #scr-player{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(14px + env(safe-area-inset-bottom));}

  /* ===== 输入页背景图（紫色星空） ===== */
  #scr-input{
    background-color:#0b0d2a;
    background-image:url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/read/WechatIMG8373.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  /* 背景图已包含"安睡引导"标题+大标题+副标题+山水剪影，隐藏前端的重复元素 + 清掉 .screen padding 避免 absolute 定位溢出 */
  #scr-input{padding:0 !important; overflow-x:hidden !important;}
  #scr-input .input-hero{display:none;}
  #scr-input .nav-title{display:none;}
  #scr-input .nav{position:absolute; top:14px; left:14px; right:14px; margin:0; min-height:auto; justify-content:flex-start; z-index:7; overflow:visible;}
  #scr-input .back-btn{position:relative; z-index:9; background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.3); color:#fff; backdrop-filter:blur(4px); font-size:22px; line-height:1;}
  /* 遮罩：盖住背景图里自带的"返回箭头"和"安睡引导"标题（避免和我们的 back-btn + 视觉元素重叠） */
  #scr-input .bg-mask-top{position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(180deg, rgba(11,13,42,0.85) 0%, rgba(11,13,42,0.55) 60%, rgba(11,13,42,0) 100%); z-index:6; pointer-events:none;}
  /* 输入页专属闪烁星星（浮在背景图之上） */
  #scr-input #inputStars{position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden;}
  #scr-input #inputStars .star{position:absolute; border-radius:50%; background:#fff; animation:tw linear infinite;}
  /* textarea 和按钮放到背景图下半部分（山水剪影区上方） */
  #scr-input #worryInput{
    position:absolute; left:24px; right:24px; bottom:140px;
    background:rgba(255,255,255,0.10);
    border:1.5px solid rgba(255,255,255,0.22);
    border-radius:16px; color:#e9edf8;
    padding:12px 14px; font-size:13px; line-height:1.6; height:88px; min-height:88px;
    backdrop-filter:blur(6px);
    max-width:calc(100% - 48px);
  }
  #scr-input #worryInput::placeholder{color:rgba(233,237,248,0.5); white-space:normal;}
  #scr-input .count{position:absolute; right:30px; bottom:120px; color:rgba(233,237,248,0.6); font-size:11px;}
  #scr-input .cta{
    position:absolute; left:24px; right:24px; bottom:38px;
    margin:0; height:48px;
    background:linear-gradient(135deg,#a982d4 0%,#b48ad6 100%);
    color:#fff;
    box-shadow:0 6px 18px rgba(140,100,200,0.45);
    max-width:calc(100% - 48px);
  }

  /* ---------- home ---------- */
  .home-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;}
  .brand{font-family:var(--serif);font-size:22px;letter-spacing:10px;text-indent:10px;color:var(--gold);}
  .home-date{font-size:12px;color:var(--faint);letter-spacing:.5px;}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:34px 0 30px;}
  .moon{
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#fdf7e4,#e7d5a4 62%,#c9b27c);
    box-shadow:0 0 34px rgba(233,205,154,.35),0 0 90px rgba(233,205,154,.14);
    margin-bottom:22px;
  }
  .moon::after{
    content:'';display:block;width:14px;height:14px;border-radius:50%;
    background:rgba(160,138,95,.28);margin:26px 0 0 30px;
    box-shadow:-16px -12px 0 -3px rgba(160,138,95,.22),6px 12px 0 -5px rgba(160,138,95,.18);
  }
  .hero h1{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.55;margin:0 0 14px;letter-spacing:2px;}
  .hero-sub{font-size:13px;color:var(--muted);line-height:1.9;margin:0;letter-spacing:.3px;}

  .feature-main{
    display:flex;align-items:center;gap:16px;padding:18px;
    background:linear-gradient(135deg,rgba(143,163,255,.13),rgba(180,142,242,.10));
    border:1px solid rgba(143,163,255,.22);border-radius:22px;
    transition:transform .18s ease;
  }
  .feature-main:active{transform:scale(.975);}
  .fm-icon{
    width:50px;height:50px;border-radius:16px;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--gold);
    background:var(--gold-dim);border:1px solid rgba(233,205,154,.25);
  }
  .fm-icon svg{width:25px;height:25px;}
  .fm-body{flex:1;min-width:0;}
  .fm-title{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.5px;}
  .fm-desc{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55;}
  .fm-arrow{font-size:22px;color:var(--faint);padding-left:2px;}
  .tag{
    font-size:10px;color:var(--gold);border:1px solid rgba(233,205,154,.4);
    padding:2px 7px;border-radius:99px;letter-spacing:1px;font-weight:500;
  }

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .cell{
    background:var(--card);border:1px solid var(--line);border-radius:19px;
    padding:16px 14px 14px;transition:transform .18s ease,background .2s;
    display:flex;flex-direction:column;gap:9px;min-height:112px;
  }
  .cell:active{transform:scale(.965);background:var(--card2);}
  .cell-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(143,163,255,.10);color:var(--accent);}
  .cell-icon svg{width:19px;height:19px;}
  .cell-name{font-size:14px;font-weight:600;letter-spacing:.4px;}
  .cell-desc{font-size:11.5px;color:var(--faint);line-height:1.5;}
  .cell-soon{font-size:10px;color:var(--faint);letter-spacing:1px;margin-top:auto;opacity:.8;}
  .foot{margin:26px 0 4px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:1.5px;}

  /* ---------- nav ---------- */
  .nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;min-height:38px;}
  .back-btn{
    width:38px;height:38px;border-radius:13px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;line-height:1;
    transition:transform .15s;
  }
  .back-btn:active{transform:scale(.92);}
  .nav-title{font-size:16px;font-weight:600;letter-spacing:1px;}
  .nav-right{width:38px;}

  /* ---------- input screen ---------- */
  .input-hero h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:16px 0 12px;line-height:1.6;letter-spacing:1px;}
  .input-hero p{font-size:13px;color:var(--muted);line-height:1.85;margin:0 0 20px;}
  textarea{
    width:100%;min-height:150px;resize:none;border-radius:19px;padding:17px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--text);
    font-size:15px;line-height:1.8;font-family:inherit;outline:none;letter-spacing:.3px;
    transition:border-color .2s;
  }
  textarea:focus{border-color:rgba(143,163,255,.45);}
  textarea::placeholder{color:var(--faint);}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 6px;}
  .chip{
    font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:7px 14px;background:rgba(255,255,255,.025);transition:all .18s;
  }
  .chip:active{border-color:rgba(143,163,255,.5);color:var(--accent);}
  .count{font-size:11px;color:var(--faint);text-align:right;margin:4px 2px 18px;font-variant-numeric:tabular-nums;}
  .cta{
    width:100%;padding:17px;border-radius:17px;font-size:16px;font-weight:600;letter-spacing:3px;
    background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;
    box-shadow:0 10px 34px rgba(143,163,255,.28);transition:transform .18s,opacity .2s;
  }
  .cta:active{transform:scale(.975);}
  .cta:disabled{opacity:.45;box-shadow:none;}
  .tiny{margin:14px 2px 0;font-size:11px;color:var(--faint);text-align:center;line-height:1.8;letter-spacing:.3px;}

  /* ---------- loading ---------- */
  #scr-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .orb-wrap{position:relative;width:150px;height:150px;margin-bottom:38px;}
  .orb{
    position:absolute;inset:24px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,rgba(233,205,154,.85),rgba(180,142,242,.55) 70%);
    filter:blur(1px);animation:breathe 9.5s ease-in-out infinite;
  }
  .orb-ring{
    position:absolute;inset:6px;border-radius:50%;
    border:1px solid rgba(233,205,154,.3);animation:ringPulse 9.5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(.62);opacity:.5}42%{transform:scale(1);opacity:1}58%{transform:scale(1);opacity:1}}
  @keyframes ringPulse{0%,100%{transform:scale(.7);opacity:.15}45%{transform:scale(1.06);opacity:.6}}
  .loading-title{font-size:16px;letter-spacing:2px;color:var(--text);min-height:24px;transition:opacity .5s;}
  .loading-sub{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.9;letter-spacing:.5px;}
  .ghost-btn{
    margin-top:34px;padding:11px 30px;border-radius:99px;font-size:13px;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.03);letter-spacing:2px;
  }
  .error-card{
    background:var(--card);border:1px solid rgba(232,138,138,.3);border-radius:22px;
    padding:28px 24px;width:100%;max-width:320px;
  }
  .ec-title{font-size:16px;font-weight:600;letter-spacing:1px;margin-bottom:10px;}
  .ec-msg{font-size:12.5px;color:var(--muted);line-height:1.8;word-break:break-all;}
  .ec-btns{display:flex;gap:10px;margin-top:22px;}
  .ec-btns button{
    flex:1;padding:12px;border-radius:13px;font-size:13.5px;letter-spacing:1px;transition:transform .15s;
  }
  .ec-btns button:active{transform:scale(.95);}
  .ec-retry{background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;font-weight:600;}
  .ec-back{border:1px solid var(--line);color:var(--muted);}

  /* ---------- player ---------- */
  .type-chip{
    align-self:flex-start;font-size:11px;color:var(--gold);letter-spacing:1px;
    border:1px solid rgba(233,205,154,.35);background:var(--gold-dim);
    padding:4px 11px;border-radius:99px;margin-bottom:12px;
  }
  .stages{display:flex;align-items:flex-start;gap:4px;margin-bottom:12px;}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;}
  .stage-dot{
    width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);transition:all .3s;
  }
  .stage-label{font-size:10px;color:var(--faint);letter-spacing:1px;white-space:nowrap;}
  .stage.done .stage-dot{background:rgba(233,205,154,.5);border-color:transparent;}
  .stage.done .stage-label{color:rgba(233,205,154,.55);}
  .stage.cur .stage-dot{background:var(--gold);border-color:transparent;box-shadow:0 0 12px rgba(233,205,154,.8);}
  .stage.cur .stage-label{color:var(--gold);}
  .meta-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--faint);margin-bottom:7px;font-variant-numeric:tabular-nums;}
  .meta-row .el{color:var(--muted);letter-spacing:.5px;}
  .progress{height:3px;border-radius:99px;background:rgba(255,255,255,.08);margin-bottom:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#8fa3ff,var(--gold));transition:width .5s ease;}

  .transcript{
    position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 4px 20px;margin-top:8px;
  }
  .ts-quote{
    border-left:2px solid rgba(233,205,154,.5);padding:4px 0 4px 14px;margin:2px 0 22px;
  }
  .ts-quote .q-text{font-size:13.5px;color:var(--gold);line-height:1.8;letter-spacing:.4px;}
  .ts-section{margin-bottom:26px;transition:opacity .4s;opacity:.42;}
  .ts-section.active{opacity:1;}
  .ts-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;}
  .ts-num{font-family:var(--serif);font-size:12px;color:var(--faint);letter-spacing:1px;}
  .ts-title{font-size:14px;font-weight:600;letter-spacing:2px;color:var(--muted);}
  .ts-section.active .ts-title{color:var(--gold);}
  .sent{
    font-size:15px;line-height:2.05;color:var(--text);margin:0 0 7px;letter-spacing:.4px;
    border-radius:8px;padding:1px 8px;margin-left:-8px;transition:background .3s,color .3s;
  }
  .sent.now{color:var(--gold);background:rgba(233,205,154,.08);}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:34px;
    padding:14px 0 4px;border-top:1px solid rgba(255,255,255,.06);
  }
  .ctrl-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .15s;}
  .ctrl-btn:active{transform:scale(.88);}
  .ctrl-btn svg{width:26px;height:26px;}
  .play{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(143,163,255,.35);transition:transform .15s;
  }
  .play:active{transform:scale(.92);}
  .play svg{width:30px;height:30px;}
  .play.ready{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(143,163,255,.3)}50%{box-shadow:0 10px 46px rgba(143,163,255,.62)}}
  .speed-chip{
    font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:6px 12px;letter-spacing:.5px;font-variant-numeric:tabular-nums;min-width:64px;text-align:center;
  }
  .nav-chips{display:flex;gap:8px;align-items:center;}
  .controls-hint{text-align:center;font-size:11.5px;color:var(--faint);letter-spacing:1.5px;padding-bottom:2px;min-height:16px;}

  /* ---------- mix (Function 2: 音乐 + 白噪音) —— 对照 Wooly Mix 参考图 */
  /* 混音页全屏羊毛背景：挂在 phone 层以覆盖状态栏区域 */
  #mixPageBg{position:absolute;inset:0;background:url('bg-yarn.png') center/cover no-repeat;z-index:1;display:none;}
  #mixPageBg.show{display:block;}
  /* 混音模式下隐藏星光条带，状态栏文字翻白 */
  #phone.mix-mode #starfield{display:none;}
  #phone.mix-mode .statusbar{color:#fff;text-shadow:0 1px 6px rgba(40,28,80,.6);}
  #phone.mix-mode .sb-right svg rect[fill="currentColor"]{opacity:1;}

  #scr-mix{padding:0;}
  .mix-content{position:relative;z-index:1;padding:8px 18px calc(28px + env(safe-area-inset-bottom));}
  .mix-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px;}
  .mix-title{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:.3px;color:#fff;
    text-shadow:0 2px 14px rgba(40,28,80,.55),0 1px 3px rgba(0,0,0,.25);}
  .mix-sub{padding:4px 4px 16px;font-size:12.5px;color:rgba(255,255,255,.92);line-height:1.7;letter-spacing:.2px;
    text-shadow:0 1px 8px rgba(40,28,80,.5);}

  /* glossy 3D plastic power button —— 参考图电源按钮 */
  .mix-power{position:relative;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;outline:none;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -4px 8px rgba(40,20,90,.55),
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(110,70,200,.55),
      0 2px 4px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 2px rgba(60,30,120,.7);
    transition:transform .15s, box-shadow .25s, background .25s;}
  .mix-power::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:62%;height:34%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.82) 0%, rgba(255,255,255,.25) 45%, rgba(255,255,255,0) 75%);
    pointer-events:none;}
  .mix-power::after{content:'';position:absolute;inset:6px;border-radius:50%;
    background:radial-gradient(circle at 50% 75%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 50%);
    pointer-events:none;}
  .mix-power svg{width:26px;height:26px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-power:active{transform:scale(.94);}
  .mix-power.off{
    background:radial-gradient(circle at 50% 32%, #d8dcec 0%, #a8b0cc 30%, #8892b0 58%, #5a6880 100%);
    box-shadow:
      inset 0 -4px 8px rgba(30,40,60,.45),
      inset 0 3px 4px rgba(255,255,255,.5),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(80,90,120,.4),
      0 2px 4px rgba(0,0,0,.2);}
  .mix-power.off::before{
    background:radial-gradient(ellipse at center, rgba(255,255,255,.7) 0%, rgba(255,255,255,.18) 45%, rgba(255,255,255,0) 75%);}
  .mix-power.off svg{filter:drop-shadow(0 1px 1px rgba(40,50,70,.5));}

  .mix-section-title{display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:1.5px;color:#fff;
    margin-bottom:10px;padding-left:4px;font-weight:600;
    text-shadow:0 1px 8px rgba(40,28,80,.55);}
  .mix-section-title svg{width:15px;height:15px;opacity:.95;}

  /* foldable list —— 白玻璃折叠列表 */
  .mix-fold{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .fold-cat{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;}
  .fold-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 16px;background:none;border:none;cursor:pointer;color:#2a2f4a;
    font-size:15px;font-weight:700;letter-spacing:.3px;transition:background .15s;text-align:left;}
  .fold-head:active{background:rgba(255,255,255,.45);}
  .fold-title{display:flex;align-items:center;gap:8px;}
  .fold-ico{width:16px;height:16px;color:#8a8faa;flex:none;}
  .fold-tail{display:flex;align-items:center;gap:6px;flex:none;}
  .fold-sel{font-size:12px;font-weight:600;color:#7a5fd0;letter-spacing:.2px;max-width:90px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fold-sel.none{color:#9a9fb5;font-weight:500;}
  .fold-chev{width:16px;height:16px;color:#8a8faa;flex:none;transition:transform .25s ease;}
  .fold-cat.open .fold-chev{transform:rotate(90deg);}
  .fold-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
  .fold-cat.open .fold-body{max-height:560px;}
  .fold-opt{width:100%;display:flex;align-items:center;gap:9px;padding:12px 16px;
    background:none;border:none;border-top:1px solid rgba(120,120,150,.12);cursor:pointer;
    font-size:13.5px;color:#4a5068;text-align:left;transition:background .15s;}
  .fold-opt:active{background:rgba(180,142,242,.14);}
  .fold-opt.active{background:linear-gradient(90deg,rgba(180,142,242,.2),rgba(180,142,242,.04));}
  .fold-opt-name{font-weight:600;color:#2a2f4a;letter-spacing:.2px;flex:none;}
  .fold-opt.active .fold-opt-name{color:#7a5fd0;}
  .fold-opt-sub{flex:1;font-size:11px;color:#9a9fb5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* track card —— 白玻璃 + 渐变专辑封面 + 立体播放按钮 */
  .mix-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:11px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-card-art{position:relative;width:62px;height:62px;border-radius:13px;flex:none;overflow:visible;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.15);}
  .mix-card-art-glyph{font-size:22px;line-height:1;font-weight:800;color:rgba(255,255,255,.94);
    text-shadow:0 1px 3px rgba(0,0,0,.3);}
  .mix-card-play{position:absolute;left:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -3px 6px rgba(40,20,90,.5),
      inset 0 2px 3px rgba(255,255,255,.55),
      0 4px 10px rgba(110,70,200,.45),
      0 1px 2px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 1px rgba(60,30,120,.6);outline:none;}
  .mix-card-play::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:62%;height:32%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;}
  .mix-card-play svg{width:14px;height:14px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-card-body{flex:1;min-width:0;}
  .mix-card-name{font-size:15px;font-weight:700;letter-spacing:.2px;color:#2a2f4a;}
  .mix-card-sub{font-size:11.5px;color:#7a8099;margin-top:2px;}
  .mix-card .mix-vol{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .mix-vol-icon{width:14px;height:14px;color:#8a8faa;flex:none;}
  .mix-vol input[type=range]{flex:1;}
  .mix-vol-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* mix controls */
  .mix-controls{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    padding:10px 14px 6px;box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .mix-row-lbl{font-size:12.5px;color:#3a3f60;width:64px;letter-spacing:.2px;font-weight:600;}
  .mix-row input[type=range]{flex:1;}
  .mix-row-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* sliders —— 紫色轨道 */
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:linear-gradient(90deg,#b48ef2 0%,#b48ef2 var(--p,60%),#dcd6ea var(--p,60%),#dcd6ea 100%);
    border-radius:99px;outline:none;margin:0;padding:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4),inset 0 -1px 2px rgba(110,70,200,.3),inset 0 1px 1px rgba(255,255,255,.8);
    cursor:pointer;border:1px solid rgba(255,255,255,.6);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4);cursor:pointer;}

  /* back button —— 改为透明无背景以融入参考图 */
  #scr-mix .back-btn{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.7);color:#5a6080;
    box-shadow:0 2px 8px rgba(60,40,120,.18);}

  /* ---------- read (Function 7: 睡前阅读倒计时) ---------- */
  #scr-read{padding:0;background:#FAF4E8;top:-46px;bottom:0;overflow:hidden;}
  /* 三段背景：宽 100%，原始 9:16；均色度抠图透明。图层：图15(标题)最上 → 图16(图形)中 → 图17(绵羊)最下，标题栏永不被遮挡 */
  .read-bg-top,.read-bg-mid,.read-vid-canvas{
    position:absolute;left:50%;width:100%;aspect-ratio:9/16;
    background-repeat:no-repeat;
  }
  .read-bg-top{top:0;transform:translateX(-50%);background:url('read-top.png?v=5') center/100% 100% no-repeat;z-index:1;}
  .read-vid-canvas{bottom:0;transform:translateX(-50%);z-index:2;}
  .read-vid-canvas2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100%;aspect-ratio:9/16;z-index:4;pointer-events:none;}
  .read-bg-mid{top:50%;transform:translate(-50%,-50%);background:url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheepimage/read-mid.png?v=5') center/100% 100% no-repeat;z-index:3;background-color:transparent;}
  /* 混音/阅读模式：隐藏星光、状态栏文字颜色适配背景 */
  #phone.read-mode #starfield{display:none;}
  #phone.read-mode .statusbar{display:none;}
  /* overlays 相对整屏定位 —— 对齐三张图各自的内容区 */
  .read-top-ctrls{position:absolute;inset:0;z-index:5;pointer-events:none;}
  .read-ico-btn{position:absolute;top:16px;width:44px;height:44px;border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;transform:translateX(-50%);pointer-events:auto;}
  .read-ico-btn:active{background:rgba(0,0,0,.06);}
  #readPlus{left:46.8%;}   /* add 1 min */
  #readMinus{left:57.8%;}  /* minus 1 min */
  #readClear{left:68.3%;}  /* clear */
  #readStart{left:78.6%;}  /* start */
  #readStop{left:88.8%;}   /* stop */
  .read-time{position:absolute;z-index:4;left:50%;top:31%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-weight:800;font-size:92px;letter-spacing:2px;color:#1a1a1a;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(255,255,255,.25);}
  .read-time .colon{opacity:.7;}
  .read-bubble{position:absolute;z-index:4;left:50%;top:72%;transform:translate(-50%,-50%);
    background:rgba(255,255,255,.94);color:#2a2a3a;padding:11px 18px;border-radius:22px;
    font-size:13px;font-weight:700;letter-spacing:.3px;max-width:78%;text-align:center;line-height:1.55;
    box-shadow:0 6px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);display:none;}
  .read-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:rgba(255,255,255,.94);
    box-shadow:2px 2px 4px rgba(0,0,0,.08);}
  .read-bubble.show{display:block;animation:bubblePop .35s ease;}
  @keyframes bubblePop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
  .read-music-btn{position:absolute;z-index:4;left:6%;bottom:8%;width:18%;aspect-ratio:1;
    border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-music-btn:active{background:rgba(0,0,0,.06);}
  .read-home-btn{position:absolute;z-index:4;right:1.5%;bottom:0;width:13%;height:28%;
    border:none;background:transparent;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-home-btn:active{background:rgba(0,0,0,.06);}
  .read-sheep-tap{position:absolute;z-index:4;left:18%;right:18%;top:74%;bottom:18%;
    background:transparent;border:none;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}

  /* quick mix sheet —— 阅读页配色（浅暖色） */
  .qm-bg{position:absolute;inset:0;z-index:45;background:rgba(80,60,30,.18);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  .qm-bg.show{opacity:1;pointer-events:auto;}
  .qm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:46;
    background:linear-gradient(180deg,#FFFDF7,#F6EDDA);border-radius:26px 26px 0 0;
    box-shadow:0 -10px 40px rgba(60,40,20,.18);border-top:1px solid rgba(120,90,40,.12);
    padding:16px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);
    transition:transform .38s cubic-bezier(.32,.72,.28,1);max-height:84%;overflow-y:auto;}
  .qm-sheet.show{transform:none;}
  .qm-grip{width:38px;height:4px;border-radius:99px;background:rgba(120,90,40,.22);margin:0 auto 16px;}
  .qm-title{font-family:var(--serif);font-size:18px;color:#4a3a22;letter-spacing:3px;text-align:center;margin-bottom:16px;font-weight:600;}
  .qm-label{font-size:12px;color:#8a7044;letter-spacing:1.5px;font-weight:700;margin:10px 0 8px;}
  .qm-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .qm-chip{font-size:13px;color:#5a4a2a;border:1px solid rgba(120,90,40,.2);border-radius:99px;
    padding:8px 14px;background:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;font-weight:600;}
  .qm-chip:active{transform:scale(.96);}
  .qm-chip.active{background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(200,150,50,.35);}
  .qm-vol{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .qm-vol-lbl{font-size:13px;color:#5a4a2a;width:64px;font-weight:600;}
  .qm-vol input[type=range]{flex:1;background:linear-gradient(90deg,#E8B84B 0%,#E8B84B var(--p,60%),#E8D9B8 var(--p,60%),#E8D9B8 100%);}
  .qm-vol input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4),inset 0 -1px 2px rgba(200,150,50,.3),inset 0 1px 1px rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.6);}
  .qm-vol input[type=range]::-moz-range-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4);border:1px solid rgba(255,255,255,.6);}
  .qm-vol-val{font-size:12px;color:#8a7044;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:700;}
  .qm-close{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;font-weight:700;border:none;cursor:pointer;
    box-shadow:0 6px 16px rgba(200,150,50,.35);}

  /* read settings sheet */
  .read-settings-bg{position:absolute;inset:0;z-index:45;background:rgba(3,5,11,.62);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  .read-settings-bg.show{opacity:1;pointer-events:auto;}
  .read-settings{position:absolute;left:0;right:0;bottom:0;z-index:46;background:linear-gradient(180deg,#161d3a,#10152c);
    border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:18px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,.28,1);
    max-height:80%;overflow-y:auto;}
  .read-settings.show{transform:none;}
  .read-settings .rs-grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:0 auto 18px;}
  .rs-title{font-family:var(--serif);font-size:18px;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:18px;}
  .rs-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.07);}
  .rs-row-lbl{font-size:14px;color:var(--text);font-weight:600;}
  .rs-row-sub{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.3px;}
  .rs-switch{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background .2s;flex:none;}
  .rs-switch::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
  .rs-switch.on{background:linear-gradient(135deg,#b48ef2,#8fa3ff);border-color:transparent;}
  .rs-switch.on::after{transform:translateX(20px);}
  .rs-presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .rs-preset{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:6px 12px;background:rgba(255,255,255,.04);cursor:pointer;}
  .rs-preset.active{background:rgba(180,142,242,.22);border-color:rgba(180,142,242,.5);color:#fff;}
  .rs-input{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:var(--text);font-size:13px;font-family:inherit;outline:none;}
  .rs-input:focus{border-color:rgba(143,163,255,.5);}
  .rs-close{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;font-weight:600;border:none;cursor:pointer;}

  /* ---------- goodnight overlay ---------- */
  .goodnight{
    position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:radial-gradient(120% 100% at 50% 28%,rgba(10,14,30,.95),rgba(4,6,13,.99));
    opacity:0;pointer-events:none;transition:opacity 1.4s ease;
  }
  .goodnight.show{opacity:1;pointer-events:auto;}
  .gn-moon{
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#fdf7e4,#e7d5a4 62%,#c9b27c);
    box-shadow:0 0 44px rgba(233,205,154,.4),0 0 120px rgba(233,205,154,.16);
    animation:gnFloat 6s ease-in-out infinite;margin-bottom:20px;
  }
  @keyframes gnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .gn-title{font-family:var(--serif);font-size:38px;letter-spacing:16px;text-indent:16px;color:var(--gold);}
  .gn-sub{font-size:13px;color:var(--muted);letter-spacing:3px;margin-top:6px;}
  .gn-btn{
    margin-top:44px;padding:12px 34px;border-radius:99px;font-size:13px;color:var(--muted);
    border:1px solid var(--line);letter-spacing:2px;
  }

  /* ---------- sheet ---------- */
  .backdrop{position:absolute;inset:0;z-index:38;background:rgba(3,5,11,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(180deg,#161d3a,#10152c);
    border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:14px 24px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,.28,1);
  }
  .sheet.show{transform:none;}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:0 auto 20px;}
  .sheet-icon{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:rgba(143,163,255,.1);color:var(--accent);margin-bottom:14px;}
  .sheet-icon svg{width:24px;height:24px;}
  .sheet-title{font-size:17px;font-weight:600;letter-spacing:1px;margin-bottom:8px;}
  .sheet-desc{font-size:13px;color:var(--muted);line-height:1.85;margin-bottom:22px;}
  .sheet-btns{display:flex;gap:10px;}
  .sbtn{flex:1;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;transition:transform .15s;}
  .sbtn:active{transform:scale(.96);}
  .sbtn.main{background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;font-weight:600;}
  .sbtn.ghost{border:1px solid var(--line);color:var(--muted);}

  /* ---------- toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:110px;z-index:50;transform:translate(-50%,16px);
    background:rgba(20,26,50,.94);border:1px solid var(--line);color:var(--text);

    opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 从收纳箱选择烦恼 ---------- */
  #scr-input .box-pick-trigger{
    position:absolute; left:24px; bottom:240px; z-index:8;
    display:inline-flex; align-items:center; gap:6px;
    color:rgba(233,237,248,0.9); font-size:12px; letter-spacing:.5px;
    background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22);
    border-radius:99px; padding:7px 13px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    white-space:nowrap;
    cursor:pointer; transition:background .15s, transform .15s;
  }
  #scr-input .box-pick-trigger:active{background:rgba(255,255,255,0.18);transform:scale(.96);}
  #scr-input .box-pick-trigger svg{width:14px;height:14px;flex-shrink:0;}

  .box-pick-mask{
    position:absolute; inset:0; z-index:60;
    background:rgba(3,5,11,.6); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .box-pick-mask.show{opacity:1; pointer-events:auto;}
  .box-pick-panel{
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(180deg,#161d3a,#10152c);
    border-radius:26px 26px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:16px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:72%; display:flex; flex-direction:column;
    transform:translateY(105%); transition:transform .38s cubic-bezier(.32,.72,.28,1);
  }
  .box-pick-mask.show .box-pick-panel{transform:none;}
  .box-pick-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .box-pick-title{font-size:16px; font-weight:600; letter-spacing:1px; color:var(--text);}
  .box-pick-close{background:none; border:none; color:var(--muted); font-size:26px; line-height:1; cursor:pointer; padding:0 4px;}
  .box-pick-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0 4px; scrollbar-width:none;}
  .box-pick-list::-webkit-scrollbar{display:none;}
  .box-pick-item{
    text-align:left; width:100%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    border-radius:14px; padding:12px 14px; cursor:pointer;
    transition:background .15s;
  }

/* 判断输入是否为乱码/无意义内容 */
function isGarbled(text){
  var s = String(text || '').trim();
  if(s.length < 2) return true;
  var hasChinese = /[\u4e00-\u9fa5]/.test(s);
  var hasWord = /[a-zA-Z]{2,}/.test(s);
  /* 既无中文也无英文单词 → 乱码（纯数字/符号/乱字节） */
  if(!hasChinese && !hasWord) return true;
  var compact = s.replace(/[\s\p{P}]/gu, '');
  /* 去掉空白标点后只剩同一种字符 → 乱码（如 aaaaa、11111、!!!!!） */
  if(compact && new Set(compact).size === 1) return true;
  /* 无中文时：纯字母串若无元音、或整串是键盘同一行，通常是键盘乱按 */
  if(!hasChinese){
    var letters = s.replace(/[^a-zA-Z]/g, '').toLowerCase();
    if(letters.length >= 4){
      if(!/[aeiou]/.test(letters)) return true;
      if(/^[asdfghjkl]+$/.test(letters) || /^[qwertyuiop]+$/.test(letters) || /^[zxcvbnm]+$/.test(letters)) return true;
    }
  }
  return false;
}

}

function callAPI(input, signal){
  /* 代理优先；代理网络失败时自动降级直连（两层保障） */
  if (PROXY.url) {
    return callAPIOnce(input, signal, PROXY.url, true).catch(function(err){
      if (err && err.name === 'AbortError') throw err;
      return callAPIOnce(input, signal, 'https://api.deepseek.com/chat/completions', false);
    });
  }
  return callAPIOnce(input, signal, API_URL, false);
}

function callAPIOnce(input, signal, url, viaProxy){
  return new Promise(function(resolve, reject){
    var ctrl = null;
    var to = null;
    if(signal){
      signal.addEventListener('abort', function(){ reject(new Error('已取消')); });
    } else if('AbortController' in window){
      ctrl = new AbortController();
    }
    if(ctrl){ to = setTimeout(function(){ ctrl.abort(); }, 120000); }

    var body = {
      model: 'deepseek-chat',
      messages: [
        { role:'system', content: SYSTEM_PROMPT },
        { role:'user', content: input }
      ],
      temperature: 0.85,
      max_tokens: 3200,
      stream: false,
      response_format: { type: 'json_object' }
    };
    var headers = {};
    if (viaProxy) {
      // 代理模式：key 放 body、Content-Type 用 text/plain（简单请求，避免手机浏览器 CORS 预检失败）
      body.key = PROXY.anonKey;
      headers['Content-Type'] = 'text/plain';
    } else {
      // 直连模式
      headers['Content-Type'] = 'application/json';
      headers['Authorization'] = 'Bearer ' + DEEPSEEK_KEY;
    }
    var opts = {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body)
    };
    if(ctrl) opts.signal = ctrl.signal;

    fetch(url, opts).then(function(res){
      if(to) clearTimeout(to);
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(j){
          var msg = 'HTTP ' + res.status;
          if(j && j.error && j.error.message) msg = j.error.message;
          if(res.status === 401) msg = '鉴权失败：直连模式为 API Key 无效，代理模式为 anon key 不匹配（' + msg + '）';
          throw new Error('生成失败：' + msg);
        });
      }
      return res.json();
    }).then(function(j){
      if(!j || !j.choices || !j.choices[0] || !j.choices[0].message || !j.choices[0].message.content){
        throw new Error('模型没有返回内容，请重试');
      }
      var data;
      try{ data = extractJSON(j.choices[0].message.content); }
      catch(e){ throw new Error('返回内容解析失败，请重试'); }
      if(!data || !data.analysis || !String(data.analysis).trim()){
        throw new Error('返回结构不完整，请重试');
      }
      // 固定部分（承接/放松/晚安）+ DeepSeek 生成的深度分析，拼接成 sections
      data.sections = [
        { title: '承接与确认', text: FIXED_OPEN },
        { title: '深度分析', text: String(data.analysis).trim() },
        { title: '身体放松引导', text: FIXED_RELAX },
        { title: '晚安收尾', text: FIXED_END }
      ];
      resolve(data);
    }).catch(function(e){
      if(to) clearTimeout(to);
      if(e && e.name === 'AbortError'){ reject(new Error('请求超时（超过 120 秒），请检查网络后重试')); return; }
      if(e && e.message && e.message.indexOf('Failed to fetch') >= 0){
        reject(new Error('网络连接失败，请检查网络（或接口跨域受限）后重试')); return;
      }
      reject(e);
    });
  });
}

function extractJSON(s){
  s = String(s).trim().replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a) s = s.slice(a, b+1);
  return JSON.parse(s);
}

/* ================= 文本分句与停顿 ================= */
function splitSentences(text){
  var parts = [], buf = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    buf += ch;
    if('。！？!?；;\n'.indexOf(ch) >= 0){
      if(buf.trim()) parts.push(buf.trim());
      buf = '';
    }
  }
  if(buf.trim()) parts.push(buf.trim());
  var out = [];
  parts.forEach(function(p){
    p = p.replace(/^[\s，,、]+/, '');
    if(!p) return;
    if(p.length <= 90){ out.push(p); return; }
    var sub = '';
    for(var j=0;j<p.length;j++){
      sub += p[j];
      if('，,、：:'.indexOf(p[j]) >= 0 && sub.length >= 40){
        out.push(sub.trim()); sub = '';
      }
    }
    if(sub.trim()) out.push(sub.trim());
  });
  return out.length ? out : [text];
}

/* 4-7-8 呼吸节奏：计数句开启精确计时窗（4/7/8 秒整）。
   两个呼吸指令之间的间歇必须精确等于窗长；窗内解说（吸气时，想象…）
   顺延朗读并算入窗长，装不下的自动顺延到下一窗，本段末窗兜底播完。 */
function holdMs(text){
  var s = text.replace(/[。！？.!?…～\s]+$/, '');
  if(/(四|4)秒$/.test(s)) return 4000;
  if(/(七|7)秒$/.test(s)) return 7000;
  if(/(八|8)秒$/.test(s)) return 8000;
  return 0;
}
/* 通篇排程，生成播放序 player.seq（顺延的解说会被重排进后面的窗）：
   normal 普通句 / wfull 整窗静默 / wstart 计数句开窗 / wmid 窗中解说 / wend 窗尾解说 */
function planHolds(){
  var flat = player.flat, seq = [], carry = [];
  var i = 0;
  while(i < flat.length){
    var W = holdMs(flat[i].text);
    if(!W){ seq.push({ fi: i, role: 'normal' }); i++; continue; }
    /* 本窗自带解说：同段内、非计数结尾的后续句 */
    var own = [], j = i + 1;
    while(j < flat.length && flat[j].si === flat[i].si && !holdMs(flat[j].text)){ own.push(j); j++; }
    /* 段内是否还有更晚的计数窗（末窗需兜底播完所有顺延内容） */
    var lastWin = true;
    for(var k = j; k < flat.length; k++){
      if(flat[k].si !== flat[i].si) break;
      if(holdMs(flat[k].text)){ lastWin = false; break; }
    }
    var queue = carry.concat(own);
    carry = [];
    var used = 0, n = 0;
    if(lastWin){
      n = queue.length;                         /* 末窗：全部装入（可超窗） */
    }else{
      while(n < queue.length){                  /* 贪心装句，保持原顺序 */
        var need = 400 + estMs(flat[queue[n]].text);
        if(used + need <= W){ used += need; n++; } else break;
      }
    }
    if(n === 0){
      seq.push({ fi: i, role: 'wfull', W: W });
    }else{
      seq.push({ fi: i, role: 'wstart', W: W });
      var winUsed = 0;
      for(var m = 0; m < n; m++){
        winUsed += 400 + estMs(flat[queue[m]].text);
        seq.push({ fi: queue[m], role: (m === n - 1) ? 'wend' : 'wmid', W: W, winUsed: winUsed });
      }
    }
    carry = queue.slice(n);
    i = j;
  }
  player.seq = seq;
}
/* 本句读完后停多久：窗按真实朗读耗时结算，两种语音引擎通用 */
function gapAfter(st){
  if(!st) return 420;
  if(st.role === 'wfull') return st.W;                 /* 整窗精确静默 */
  if(st.role === 'wstart'){ player.holdT0 = Date.now(); return 400; }
  if(st.role === 'wmid') return 400;                   /* 窗中解说连读 */
  if(st.role === 'wend'){                              /* 窗尾：补足剩余，保证间歇=窗长 */
    var used = player.holdT0 ? (Date.now() - player.holdT0) : st.W;
    return Math.max(300, st.W - used);
  }
  return 420;
}
function estMs(text){
  return Math.max(1400, text.length / 3.6 * 1000 / player.rate);
}
function estTotal(){
  var t = 0;
  (player.seq || []).forEach(function(st){
    t += estMs(player.flat[st.fi].text);
    if(st.role === 'normal') t += 420;
    else if(st.role === 'wfull') t += st.W;
    else if(st.role === 'wend') t += Math.max(300, st.W - (st.winUsed || st.W));
    else t += 400;
  });
  return t;
}

/* ================= Qwen3-TTS 语音合成（GPU 服务器，自然中文音色） ================= */
var EDGE_VOICES = (window.TC_TTS && TC_TTS.VOICES) || [];
/* 语音合成统一入口（TC_TTS → GPU 服务器 Qwen3-TTS-VoiceDesign；voice 为音色 ID） */
function edgeTTS(text, voice, ratePct){
  if(!(window.TC_TTS && TC_TTS.synth)) return Promise.reject(new Error('TTS 模块未加载'));
  var speed = Math.max(-2, Math.min(6, Math.round(ratePct / 50)));
  return TC_TTS.synth(text, voice, speed).then(function(blobs){
    /* 句子已按 ≤90 字拆分，通常单段 */
    return blobs[0];
  });
}
var EDGE = {
  ok: true,             /* Qwen3-TTS；连续失败才降级系统语音 */
  warned: false,
  fails: 0,             /* 连续失败计数（成功即清零） */
  voice: EDGE_VOICES.length ? EDGE_VOICES[0].id : 101001,
  cache: new Map(),     /* 'voice|rate|text' → Promise<Blob> */
  audio: null, url: null
};
function edgeFail(){
  EDGE.fails++;
  if(EDGE.fails >= 3 && EDGE.ok){
    EDGE.ok = false;
    if(!EDGE.warned){ EDGE.warned = true; toast('自然语音暂不可用，已切换系统语音'); }
  }
}
try{
  var savedVoice = parseInt(localStorage.getItem('ld_voice'), 10);
  for(var ev=0; ev<EDGE_VOICES.length; ev++){
    if(EDGE_VOICES[ev].id === savedVoice){ EDGE.voice = savedVoice; break; }
  }
}catch(e){}
function voiceLabel(){
  for(var i=0;i<EDGE_VOICES.length;i++){ if(EDGE_VOICES[i].id === EDGE.voice) return EDGE_VOICES[i].label; }
  return '温柔女声';
}

function edgeAudio(text){
  var key = EDGE.voice + '|' + player.rate + '|' + text;
  if(EDGE.cache.has(key)) return EDGE.cache.get(key);
  var ratePct = Math.round((player.rate - 1) * 100);
  /* Qwen3-TTS 服务端合成，前端直接播放音频 Blob */
  var p = edgeTTS(text, EDGE.voice, ratePct);
  p.catch(function(){ EDGE.cache.delete(key); });
  if(EDGE.cache.size > 160) EDGE.cache.delete(EDGE.cache.keys().next().value);
  EDGE.cache.set(key, p);
  return p;
}

function stopEdgeAudio(){
  if(EDGE.audio){
    try{ EDGE.audio.pause(); }catch(e){}
    EDGE.audio.onended = null;
    EDGE.audio.onerror = null;
    EDGE.audio = null;
  }
  if(EDGE.url){
    try{ URL.revokeObjectURL(EDGE.url); }catch(e){}
    EDGE.url = null;
  }
}

function playEdgeBlob(blob, st, token, next){
  var it = player.flat[st.fi];
  stopEdgeAudio();
  EDGE.url = URL.createObjectURL(blob);
  var a = new Audio(EDGE.url);
  EDGE.audio = a;
  a.onended = function(){
    if(token !== player.token || !player.playing) return;
    next(gapAfter(st));
  };
  a.onerror = function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  };
  a.play().catch(function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  });
}

var SHORT_LABELS = {
  '承接与确认':'承接', '深度分析':'分析',
  '身体放松引导':'放松', '身体放松':'放松', '晚安收尾':'晚安'
};
function shortLabel(t){
  if(SHORT_LABELS[t]) return SHORT_LABELS[t];
  return t.length > 2 ? t.slice(0,2) : t;
}

function buildFromData(data){
  player.data = data;
  player.sections = (data.sections || []).filter(function(s){
    return s && s.text && String(s.text).trim();
  }).map(function(s){

  });
  player.flat = [];
  player.sections.forEach(function(sec, si){
    sec.sentences.forEach(function(t, ii){
      player.flat.push({ si: si, ii: ii, text: t });
    });
  });
  planHolds();

  player.finished = false;

function renderPlayer(){

function currentSectionIdx(){
  var st = player.seq[player.idx];
  var it = st ? player.flat[st.fi] : null;
  return it ? it.si : Math.max(0, player.sections.length - 1);
}

function updateHighlight(){
  var st = player.seq[player.idx];
  var cur = st ? player.flat[st.fi] : null;
  var csi = cur ? cur.si : Math.max(0, player.sections.length - 1);
  var secs = $$('#transcript .ts-section');
  secs.forEach(function(el, i){
    el.classList.toggle('active', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#stageBar .stage').forEach(function(el, i){
    el.classList.toggle('cur', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#transcript .sent.now').forEach(function(e){ e.classList.remove('now'); });
  if(cur){
    var secEl = document.querySelector('#transcript .ts-section[data-s="' + cur.si + '"]');
    if(secEl){
      var el = secEl.querySelector('.sent[data-i="' + cur.ii + '"]');
      if(el){
        el.classList.add('now');
        var tr = $('#transcript');
        var top = el.offsetTop - tr.clientHeight * 0.4;
        try{ tr.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }catch(e){ tr.scrollTop = Math.max(0, top); }
      }
    }
  }
}

function updateProgress(){
  var pct = player.seq.length ? (player.idx / player.seq.length) * 100 : 0;
  if(player.finished) pct = 100;
  $('#progressFill').style.width = pct.toFixed(1) + '%';
}

function speakCurrent(){
  if(player.idx >= player.seq.length){ finish(); return; }
  var st = player.seq[player.idx];
  var it = player.flat[st.fi];
  updateHighlight();
  updateProgress();
  var token = ++player.token;

  function next(delay){
    player.timer = setTimeout(function(){
      if(token !== player.token || !player.playing) return;
      player.idx++;
      speakCurrent();
    }, delay);
  }

  /* 优先 Qwen3-TTS 自然音色，失败自动降级系统语音 */
  if(EDGE.ok){
    var p1 = player.seq[player.idx + 1], p2 = player.seq[player.idx + 2];
    if(p1) edgeAudio(player.flat[p1.fi].text);
    if(p2) edgeAudio(player.flat[p2.fi].text);
    edgeAudio(it.text).then(function(blob){
      if(token !== player.token || !player.playing) return;
      EDGE.fails = 0;
      playEdgeBlob(blob, st, token, next);
    }).catch(function(){
      if(token !== player.token || !player.playing) return;
      /* 瞬时失败先重试一次（失败缓存已被逐出，会真正重发） */
      edgeAudio(it.text).then(function(blob){
        if(token !== player.token || !player.playing) return;
        EDGE.fails = 0;
        playEdgeBlob(blob, st, token, next);
      }).catch(function(){
        if(token !== player.token || !player.playing) return;
        edgeFail();
        speakWeb(st, token, next);
      });
    });
    return;
  }

  speakWeb(st, token, next);
}

function speakWeb(st, token, next){
  var it = player.flat[st.fi];
  /* 优先 Qwen3-TTS 自然朗读；失败降级系统语音，保证离线也能读 */
  edgeAudio(it.text).then(function(blob){
    if(token !== player.token || !player.playing) return;
    playEdgeBlob(blob, st, token, next);
  }).catch(function(){
    if(token !== player.token || !player.playing) return;
    speakSystem(st, token, next);
  });
}

/* 选择系统里最自然的中文音色 */
function pickZhVoice(){
  try {
    if(!('speechSynthesis' in window)) return null;
    var voices = speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    var zh = voices.filter(function(v){ return /^zh|^cmn|chinese/i.test(v.lang || ''); });
    if(!zh.length) return null;
    // 优先已知的自然音色（macOS Ting-Ting、Windows Huihui、Edge Xiaoxiao 等）
    var preferred = ['ting-ting','tingting','huihui','xiaoxiao','xiaoyi','yunxi','yunjian','yunjie','meijia','sinji'];
    for(var i=0;i<preferred.length;i++){
      for(var j=0;j<zh.length;j++){
        if((zh[j].name||'').toLowerCase().indexOf(preferred[i]) >= 0) return zh[j];
      }
    }
    // 其次本地服务音色
    var local = zh.filter(function(v){ return v.localService; });
    if(local.length) return local[0];
    return zh[0];
  } catch(e){ return null; }
}

/* 系统语音兜底：Edge 全部失败/离线时，用 speechSynthesis 保证出声 */
function speakSystem(st, token, next){
  var it = player.flat[st.fi];
  var estimated = Math.max(800, estMs(it.text));
  function done(){ if(token === player.token && player.playing) next(300); }
  try {
    if('speechSynthesis' in window){
      var u = new SpeechSynthesisUtterance(it.text);
      var v = pickZhVoice();
      if(v) u.voice = v;
      u.lang = 'zh-CN';
      u.rate = 0.95;
      u.pitch = 1;
      var finished = false;
      function finish(){ if(!finished){ finished = true; done(); } }
      u.onend = finish;
      u.onerror = finish;
      try { speechSynthesis.cancel(); } catch(e) {}
      speechSynthesis.speak(u);
      // 兜底：超过估算时长仍未结束则强制推进
      setTimeout(function(){ if(!finished){ finished = true; try{ speechSynthesis.cancel(); }catch(e){} done(); } }, estimated + 1500);
      return;
    }
  } catch(e) {}
  done();
}

  clearTimeout(player.timer);
  stopTick();
  setPlayIcon(false);
  updateHighlight();
  updateProgress();
  $('#elapsed').textContent = fmtTime(player.elapsedBase + (Date.now() - player.startAt));

function stopAll(){

  player.token++;

  stopEdgeAudio();
  stopEdgeAudio();
  stopTick();
  setPlayIcon(false);
  $('#goodnight').classList.remove('show');
}

function jumpToSection(si){
  if(si < 0 || si >= player.sections.length) return;
  var start = -1;
  for(var i=0;i<player.seq.length;i++){
    if(player.flat[player.seq[i].fi].si === si){ start = i; break; }
  }
  if(start < 0) return;
  var wasPlaying = player.playing;
  player.token++;
  clearTimeout(player.timer);
  stopEdgeAudio();
  stopEdgeAudio();
  if(wasPlaying) player.elapsedBase += Date.now() - player.startAt;
  player.idx = start;
  player.finished = false;
  $('#goodnight').classList.remove('show');
  if(wasPlaying){
    player.startAt = Date.now();
    speakCurrent();
  } else {
    updateHighlight();
    updateProgress();
  }
}
function stepSection(dir){
  var csi = currentSectionIdx();
  jumpToSection(csi + dir);
}

function cycleRate(){
  var rates = [0.75, 0.85, 0.95];
  var i = rates.indexOf(player.rate);
  player.rate = rates[(i + 1) % rates.length];

  $('#btnSpeed').textContent = player.rate.toFixed(2) + '×';
  var mins = Math.max(1, Math.round(estTotal() / 60000));
  $('#remainLabel').textContent = '全文约 ' + mins + ' 分钟';
  if(player.playing){
    player.token++;
    clearTimeout(player.timer);
    stopEdgeAudio();
    stopEdgeAudio();
    speakCurrent();
  }
  toast('语速 ' + player.rate.toFixed(2) + '×');
}

function cycleVoice(){
  if(!EDGE_VOICES.length) return;
  var i = 0;
  for(var k=0;k<EDGE_VOICES.length;k++){ if(EDGE_VOICES[k].id === EDGE.voice){ i = k; break; } }

}

function setMixPowerUI(on){

function renderMixFold(){
  function fill(bodyId, list, selIdx, onClick){
    var c = $(bodyId); c.innerHTML = '';
    list.forEach(function(t, i){
      var b = document.createElement('button');
      b.className = 'fold-opt' + (i === selIdx ? ' active' : '');
      b.innerHTML =
        '<span class="fold-opt-name">' + t.name + '</span>' +
        '<span class="fold-opt-sub">' + t.sub + '</span>' +
        '<svg class="fold-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      b.addEventListener('click', function(){ onClick(i); });
      c.appendChild(b);
    });
  }
  fill('#foldBodyMusic', MIX.music, MIX.selMusic, function(i){
    MIX.selMusic = (MIX.selMusic === i) ? -1 : i;
    onMixTrackChange('music');
  });
  fill('#foldBodyNoise', MIX.noise, MIX.selNoise, function(i){
    MIX.selNoise = (MIX.selNoise === i) ? -1 : i;
    onMixTrackChange('noise');
  });
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  var mSel = $('#foldSelMusic');
  mSel.textContent = mt ? mt.name : '未选择';
  mSel.classList.toggle('none', !mt);
  var nSel = $('#foldSelNoise');
  nSel.textContent = nt ? nt.name : '未选择';
  nSel.classList.toggle('none', !nt);
}

function updateMixCard(kind){
  var list = kind === 'music' ? MIX.music : MIX.noise;
  var idx  = kind === 'music' ? MIX.selMusic : MIX.selNoise;
  var t    = idx >= 0 ? list[idx] : null;
  var artEl   = $(kind === 'music' ? '#musicCardArt'  : '#noiseCardArt');
  var glyphEl = $(kind === 'music' ? '#musicCardGlyph' : '#noiseCardGlyph');
  var nameEl  = $(kind === 'music' ? '#musicName' : '#noiseName');
  var subEl   = $(kind === 'music' ? '#musicSub'  : '#noiseSub');
  if(t){
    artEl.style.background = t.bg;
    glyphEl.textContent = t.name.charAt(0);
  } else {
    artEl.style.background = kind === 'music' ? 'linear-gradient(135deg,#b48ef2,#6b4fb8)' : 'linear-gradient(135deg,#5a6a88,#2a3450)';
    glyphEl.textContent = '';
  }
  nameEl.textContent = t ? t.name : '—';
  if(!t){ subEl.textContent = '未选择'; subEl.style.color = ''; }
  else if(!t.src){ subEl.textContent = '占位 · 即将上线'; subEl.style.color = ''; }
  else { subEl.textContent = t.sub; subEl.style.color = ''; }
}

function onMixTrackChange(kind){
  renderMixFold();
  if(kind) updateMixCard(kind);
  if(!MIX._inited) return;
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  if(MIX.aMusic){
    var newSrc = mt && mt.src ? mt.src : '';
    if(MIX.aMusic.src !== location.origin + '/' + newSrc && !(newSrc === '' && !MIX.aMusic.src)){
      try { MIX.aMusic.pause(); } catch(e){}
      MIX.aMusic.src = newSrc;
    }
  }
  if(MIX.aNoise){
    var newSrc2 = nt && nt.src ? nt.src : '';
    if(MIX.aNoise.src !== location.origin + '/' + newSrc2 && !(newSrc2 === '' && !MIX.aNoise.src)){
      try { MIX.aNoise.pause(); } catch(e){}
      MIX.aNoise.src = newSrc2;
    }
  }
  if(MIX.playing) startMixPlayback();
}

function startMixPlayback(){
  var any = false;
  if(MIX.aMusic && MIX.aMusic.src){
    MIX.aMusic.volume = MIX.musicVol;
    MIX.aMusic.loop = true;
    MIX.aMusic.currentTime = 0;
    MIX.aMusic.play().catch(function(){});
    any = true;
  }
  if(MIX.aNoise && MIX.aNoise.src){
    MIX.aNoise.volume = MIX.noiseVol;
    MIX.aNoise.loop = true;
    MIX.aNoise.currentTime = 0;
    MIX.aNoise.play().catch(function(){});
    any = true;
  }
  setMixPowerUI(any);
  if(!any) toast('所选项暂未提供音源');
}

function stopMixPlayback(){
  if(MIX.aMusic){ try{ MIX.aMusic.pause(); }catch(e){} }
  if(MIX.aNoise){ try{ MIX.aNoise.pause(); }catch(e){} }
  setMixPowerUI(false);
}

function toggleMixPower(){
  if(MIX.playing){ stopMixPlayback(); return; }
  if(MIX.selMusic < 0 && MIX.selNoise < 0){ toast('请先选择音乐或白噪音'); return; }
  startMixPlayback();
}

function bindMixSlider(id, labelId, setVol){
  var el = $(id);
  el.value = Math.round(setVol() * 100);
  $(labelId).textContent = el.value + '%';

  el.addEventListener('input', function(){
    var v = el.value / 100;
    setVol(v);
    $(labelId).textContent = el.value + '%';
    el.style.setProperty('--p', el.value + '%');

}
