<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>好好睡觉</title>
<style>
/* ============ 基础重置 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #2a2418;
  overflow: hidden;
}

/* ============ 桌面外层：外围纯色 ============ */
.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #f6e8d4;
  position: relative; overflow: hidden;
  padding: 0;
}

/* ============ 9:16 竖屏显示区 ============ */
.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: url('assets/bg.png') center/cover no-repeat;
}

/* ============ 顶部导航区 ============ */
.topbar {
  position: relative;
  padding: 40px 24px 6px;
  flex-shrink: 0;
}

.title-wrap {
  margin-top: 14px;
  position: relative;
  z-index: 2;
}
.title-main {
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.3;
  color: #2d2417;
  letter-spacing: 1.5px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.subtitle {
  margin-top: 10px;
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: #8a7858;
  letter-spacing: 0.5px;
}

/* 撕纸月亮装饰（使用图片） */
.celestial {
  position: absolute;
  top: 22px; right: 14px;
  width: 130px; height: 130px;
  pointer-events: auto;
  z-index: 1;
}
.celestial img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 6px 12px rgba(40, 40, 80, 0.25));
  pointer-events: none;
}

/* 星星闪烁（位于月亮内部的天空区域） */
.celestial .star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 2px 0.5px rgba(255, 244, 200, 0.45);
  animation: twinkle 2.6s ease-in-out infinite;
  pointer-events: none;
}
.celestial .star.s1 { width: 1.5px; height: 1.5px; top: 16%; left: 22%; animation-delay: 0s; }
.celestial .star.s2 { width: 1px; height: 1px; top: 34%; left: 12%; animation-delay: 0.5s; }
.celestial .star.s3 { width: 1px; height: 1px; top: 10%; left: 52%; animation-delay: 1.1s; }
.celestial .star.s4 { width: 1.5px; height: 1.5px; top: 26%; right: 16%; animation-delay: 1.6s; }
.celestial .star.s5 { width: 1px; height: 1px; top: 56%; left: 16%; animation-delay: 2.0s; }
.celestial .star.s6 { width: 1px; height: 1px; bottom: 16%; right: 22%; animation-delay: 0.8s; }
.celestial .star.s7 { width: 1.5px; height: 1.5px; top: 42%; right: 10%; animation-delay: 1.3s; }
.celestial .star.s8 { width: 1px; height: 1px; bottom: 26%; left: 28%; animation-delay: 2.2s; }
.celestial .star.s9 { width: 1px; height: 1px; top: 22%; left: 40%; animation-delay: 0.3s; }
.celestial .star.s10 { width: 1.5px; height: 1.5px; top: 6%; left: 34%; animation-delay: 1.0s; }
.celestial .star.s11 { width: 1px; height: 1px; top: 30%; left: 6%; animation-delay: 0.7s; }
.celestial .star.s12 { width: 1.5px; height: 1.5px; top: 48%; left: 30%; animation-delay: 1.9s; }
.celestial .star.s13 { width: 1px; height: 1px; top: 66%; left: 34%; animation-delay: 0.4s; }
.celestial .star.s14 { width: 1px; height: 1px; bottom: 20%; left: 44%; animation-delay: 1.5s; }
.celestial .star.s15 { width: 1.5px; height: 1.5px; top: 36%; left: 44%; animation-delay: 2.4s; }
.celestial .star.s16 { width: 1px; height: 1px; top: 18%; left: 60%; animation-delay: 0.9s; }

@keyframes twinkle {
  0%, 100% { opacity: 0.12; transform: scale(0.75); }
  50% { opacity: 0.8; transform: scale(1.1); }
}

/* ============ 按钮列表 ============ */
.cards {
  flex: 1;
  padding: 8px 16px 12px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  position: relative;
}
.cards::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
  border-radius: 18px;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(.34,1.4,.64,1);
  user-select: none;
}
.card:active { transform: scale(0.97); }
.card img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  filter: drop-shadow(0 4px 5px rgba(46, 34, 20, 0.55));
}

/* ============ Toast ============ */
.toast {
  position: absolute;
  bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(40, 30, 20, 0.9);
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 200;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">

    <!-- 顶部导航 -->
    <div class="topbar">
      <div class="title-wrap">
        <div class="title-main">好好睡觉</div>
        <div class="title-main">从今天开始</div>
        <div class="subtitle">温柔陪伴每一个夜晚</div>
      </div>

      <!-- 撕纸月亮星星 -->
      <div class="celestial" aria-hidden="true">
        <img id="moonBtn" src="assets/moon-clean.png" alt="月亮">
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
        <span class="star s8"></span>
        <span class="star s9"></span>
        <span class="star s10"></span>
        <span class="star s11"></span>
        <span class="star s12"></span>
        <span class="star s13"></span>
        <span class="star s14"></span>
        <span class="star s15"></span>
        <span class="star s16"></span>
      </div>
    </div>

    <!-- 卡片列表 -->
    <div class="cards" id="cards">
      <div class="card card-01" data-name="引导入睡音频" data-desc="个性化语音引导，帮你整理思绪">
        <img src="assets/btn-01.png" alt="引导入睡音频">
      </div>
      <div class="card card-02" data-name="白噪音" data-desc="多种自然声音，营造宁静氛围">
        <img src="assets/btn-02.png" alt="白噪音">
      </div>
      <div class="card card-03" data-name="论坛" data-desc="分享经验，互相陪伴成长">
        <img src="assets/btn-03.png" alt="论坛">
      </div>
      <div class="card card-04" data-name="百科" data-desc="睡眠知识库，科学改善睡眠">
        <img src="assets/btn-04.png" alt="百科">
      </div>
      <div class="card card-05" data-name="阅读倒计时" data-desc="专注阅读，放松身心">
        <img src="assets/btn-05.png" alt="阅读倒计时">
      </div>
      <div class="card card-06" data-name="放松练习" data-desc="呼吸、冥想、渐进放松等练习">
        <img src="assets/btn-06.png" alt="放松练习">
      </div>
      <div class="card card-07" data-name="烦恼收藏箱" data-desc="写下烦恼，暂时收起来">
        <img src="assets/btn-07.png" alt="烦恼收藏箱">
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

  </div>
</div>

<script>
(function() {
  'use strict';

  // ====== DOM ======
  const toast = document.getElementById('toast');

  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // 各功能按钮跳转到对应独立页面
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      const name = card.dataset.name;
      const map = {
        '引导入睡音频': 'caignick.html',
        '蔡格尼克': 'caignick.html',
        '白噪音': 'sound.html',
        '阅读倒计时': 'read.html',
        '放松练习': 'relax.html',
        '烦恼收藏箱': 'box.html'
      };
      if (map[name]) {
        location.href = map[name];
      } else {
        showToast('点击了 ' + name);
      }
    });
  });

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>落定 · 睡前思绪整理</title>
<style>
  :root{
    --bg0:#070a16;
    --bg1:#0b1024;
    --card:rgba(255,255,255,.045);
    --card2:rgba(255,255,255,.075);
    --line:rgba(255,255,255,.09);
    --text:#e9edf8;
    --muted:#9aa3c0;
    --faint:#6b7394;
    --gold:#e9cd9a;
    --gold-dim:rgba(233,205,154,.14);
    --accent:#8fa3ff;
    --accent2:#b48ef2;
    --danger:#e88a8a;
    --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:#04060d;display:flex;justify-content:center;align-items:center;padding:0;overflow:hidden;
    font-family:var(--sans);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}
  .hidden{display:none!important;}

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;width:min(100vw, calc(100vh * 9 / 16));aspect-ratio:9/16;
    overflow:hidden;background:
      radial-gradient(90% 42% at 82% -6%, rgba(233,205,154,.10), transparent 60%),
      radial-gradient(70% 40% at 12% 106%, rgba(143,120,255,.14), transparent 60%),
      linear-gradient(180deg,#0c1126 0%,#0a0e1f 55%,#070a16 100%);
  }

  /* ---------- starfield ---------- */
  #starfield{position:absolute;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;border-radius:50%;background:#fff;animation:tw linear infinite;}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}

  /* ---------- status bar ---------- */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:46px;z-index:6;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 4px;font-size:13px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.4px;
  }
  .sb-right{display:flex;align-items:center;gap:5px;opacity:.85;}
  .sb-right svg{width:20px;height:11px;}

  /* ---------- screens ---------- */
  .screens{position:absolute;inset:0;top:46px;z-index:2;}
  .screen{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;transform:translateX(26px);pointer-events:none;
    transition:opacity .34s ease,transform .34s ease;
    padding:14px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .screen.active{opacity:1;transform:none;pointer-events:auto;}
  #scr-player{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(14px + env(safe-area-inset-bottom));}

  /* ---------- home ---------- */
  .home-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;}
  .brand{font-family:var(--serif);font-size:22px;letter-spacing:10px;text-indent:10px;color:var(--gold);}
  .home-date{font-size:12px;color:var(--faint);letter-spacing:.5px;}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:34px 0 30px;}
  .moon{
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#fdf7e4,#e7d5a4 62%,#c9b27c);
    box-shadow:0 0 34px rgba(233,205,154,.35),0 0 90px rgba(233,205,154,.14);
    margin-bottom:22px;
  }
  .moon::after{
    content:'';display:block;width:14px;height:14px;border-radius:50%;
    background:rgba(160,138,95,.28);margin:26px 0 0 30px;
    box-shadow:-16px -12px 0 -3px rgba(160,138,95,.22),6px 12px 0 -5px rgba(160,138,95,.18);
  }
  .hero h1{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.55;margin:0 0 14px;letter-spacing:2px;}
  .hero-sub{font-size:13px;color:var(--muted);line-height:1.9;margin:0;letter-spacing:.3px;}

  .feature-main{
    display:flex;align-items:center;gap:16px;padding:18px;
    background:linear-gradient(135deg,rgba(143,163,255,.13),rgba(180,142,242,.10));
    border:1px solid rgba(143,163,255,.22);border-radius:22px;
    transition:transform .18s ease;
  }
  .feature-main:active{transform:scale(.975);}
  .fm-icon{
    width:50px;height:50px;border-radius:16px;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--gold);
    background:var(--gold-dim);border:1px solid rgba(233,205,154,.25);

  .tag{
    font-size:10px;color:var(--gold);border:1px solid rgba(233,205,154,.4);
    padding:2px 7px;border-radius:99px;letter-spacing:1px;font-weight:500;
  }

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .cell{
    background:var(--card);border:1px solid var(--line);border-radius:19px;

  .cell-icon svg{width:19px;height:19px;}
  .cell-name{font-size:14px;font-weight:600;letter-spacing:.4px;}
  .cell-desc{font-size:11.5px;color:var(--faint);line-height:1.5;}
  .cell-soon{font-size:10px;color:var(--faint);letter-spacing:1px;margin-top:auto;opacity:.8;}
  .foot{margin:26px 0 4px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:1.5px;}

  /* ---------- nav ---------- */
  .nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;min-height:38px;}
  .back-btn{
    width:38px;height:38px;border-radius:13px;background:var(--card);border:1px solid var(--line);

  .nav-title{font-size:16px;font-weight:600;letter-spacing:1px;}

  /* ---------- input screen ---------- */

  .cta:disabled{opacity:.45;box-shadow:none;}
  .tiny{margin:14px 2px 0;font-size:11px;color:var(--faint);text-align:center;line-height:1.8;letter-spacing:.3px;}

  @keyframes breathe{0%,100%{transform:scale(.62);opacity:.5}42%{transform:scale(1);opacity:1}58%{transform:scale(1);opacity:1}}
  @keyframes ringPulse{0%,100%{transform:scale(.7);opacity:.15}45%{transform:scale(1.06);opacity:.6}}
  .loading-title{font-size:16px;letter-spacing:2px;color:var(--text);min-height:24px;transition:opacity .5s;}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;}
  .stage-dot{
    width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);transition:all .3s;
  }
  .stage-label{font-size:10px;color:var(--faint);letter-spacing:1px;white-space:nowrap;}
  .stage.done .stage-dot{background:rgba(233,205,154,.5);border-color:transparent;}
  .stage.done .stage-label{color:rgba(233,205,154,.55);}
  .stage.cur .stage-dot{background:var(--gold);border-color:transparent;box-shadow:0 0 12px rgba(233,205,154,.8);}
  .stage.cur .stage-label{color:var(--gold);}
  .meta-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--faint);margin-bottom:7px;font-variant-numeric:tabular-nums;}
  .meta-row .el{color:var(--muted);letter-spacing:.5px;}
  .progress{height:3px;border-radius:99px;background:rgba(255,255,255,.08);margin-bottom:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#8fa3ff,var(--gold));transition:width .5s ease;}

  .transcript{
    position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 4px 20px;margin-top:8px;
  }
  .ts-quote{
    border-left:2px solid rgba(233,205,154,.5);padding:4px 0 4px 14px;margin:2px 0 22px;
  }
  .ts-quote .q-text{font-size:13.5px;color:var(--gold);line-height:1.8;letter-spacing:.4px;}
  .ts-section{margin-bottom:26px;transition:opacity .4s;opacity:.42;}
  .ts-section.active{opacity:1;}
  .ts-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;}
  .ts-num{font-family:var(--serif);font-size:12px;color:var(--faint);letter-spacing:1px;}
  .ts-title{font-size:14px;font-weight:600;letter-spacing:2px;color:var(--muted);}
  .ts-section.active .ts-title{color:var(--gold);}
  .sent{
    font-size:15px;line-height:2.05;color:var(--text);margin:0 0 7px;letter-spacing:.4px;
    border-radius:8px;padding:1px 8px;margin-left:-8px;transition:background .3s,color .3s;
  }
  .sent.now{color:var(--gold);background:rgba(233,205,154,.08);}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:34px;
    padding:14px 0 4px;border-top:1px solid rgba(255,255,255,.06);
  }
  .ctrl-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .15s;}
  .ctrl-btn:active{transform:scale(.88);}
  .ctrl-btn svg{width:26px;height:26px;}
  .play{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(143,163,255,.35);transition:transform .15s;
  }
  .play:active{transform:scale(.92);}
  .play svg{width:30px;height:30px;}
  .play.ready{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(143,163,255,.3)}50%{box-shadow:0 10px 46px rgba(143,163,255,.62)}}
  .speed-chip{
    font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:6px 12px;letter-spacing:.5px;font-variant-numeric:tabular-nums;min-width:64px;text-align:center;
  }
  .nav-chips{display:flex;gap:8px;align-items:center;}
  .controls-hint{text-align:center;font-size:11.5px;color:var(--faint);letter-spacing:1.5px;padding-bottom:2px;min-height:16px;}

  /* ---------- mix (Function 2: 音乐 + 白噪音) —— 对照 Wooly Mix 参考图 */
  /* 混音页全屏羊毛背景：挂在 phone 层以覆盖状态栏区域 */
  #mixPageBg{position:absolute;inset:0;background:url('bg-yarn.png') center/cover no-repeat;z-index:1;display:none;}
  #mixPageBg.show{display:block;}
  /* 混音模式下隐藏星光条带，状态栏文字翻白 */
  #phone.mix-mode #starfield{display:none;}
  #phone.mix-mode .statusbar{color:#fff;text-shadow:0 1px 6px rgba(40,28,80,.6);}
  #phone.mix-mode .sb-right svg rect[fill="currentColor"]{opacity:1;}

  #scr-mix{padding:0;}
  .mix-content{position:relative;z-index:1;padding:8px 18px calc(28px + env(safe-area-inset-bottom));}
  .mix-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px;}
  .mix-title{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:.3px;color:#fff;
    text-shadow:0 2px 14px rgba(40,28,80,.55),0 1px 3px rgba(0,0,0,.25);}
  .mix-sub{padding:4px 4px 16px;font-size:12.5px;color:rgba(255,255,255,.92);line-height:1.7;letter-spacing:.2px;
    text-shadow:0 1px 8px rgba(40,28,80,.5);}

  /* glossy 3D plastic power button —— 参考图电源按钮 */
  .mix-power{position:relative;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;outline:none;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -4px 8px rgba(40,20,90,.55),
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(110,70,200,.55),
      0 2px 4px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 2px rgba(60,30,120,.7);
    transition:transform .15s, box-shadow .25s, background .25s;}
  .mix-power::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:62%;height:34%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.82) 0%, rgba(255,255,255,.25) 45%, rgba(255,255,255,0) 75%);
    pointer-events:none;}
  .mix-power::after{content:'';position:absolute;inset:6px;border-radius:50%;
    background:radial-gradient(circle at 50% 75%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 50%);
    pointer-events:none;}
  .mix-power svg{width:26px;height:26px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-power:active{transform:scale(.94);}
  .mix-power.off{
    background:radial-gradient(circle at 50% 32%, #d8dcec 0%, #a8b0cc 30%, #8892b0 58%, #5a6880 100%);
    box-shadow:
      inset 0 -4px 8px rgba(30,40,60,.45),
      inset 0 3px 4px rgba(255,255,255,.5),
      inset 0 0 0 2px rgba(255,255,255,.18),
      0 6px 18px rgba(80,90,120,.4),
      0 2px 4px rgba(0,0,0,.2);}
  .mix-power.off::before{
    background:radial-gradient(ellipse at center, rgba(255,255,255,.7) 0%, rgba(255,255,255,.18) 45%, rgba(255,255,255,0) 75%);}
  .mix-power.off svg{filter:drop-shadow(0 1px 1px rgba(40,50,70,.5));}

  .mix-section-title{display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:1.5px;color:#fff;
    margin-bottom:10px;padding-left:4px;font-weight:600;
    text-shadow:0 1px 8px rgba(40,28,80,.55);}
  .mix-section-title svg{width:15px;height:15px;opacity:.95;}

  /* foldable list —— 白玻璃折叠列表 */
  .mix-fold{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .fold-cat{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;}
  .fold-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 16px;background:none;border:none;cursor:pointer;color:#2a2f4a;
    font-size:15px;font-weight:700;letter-spacing:.3px;transition:background .15s;text-align:left;}
  .fold-head:active{background:rgba(255,255,255,.45);}
  .fold-title{display:flex;align-items:center;gap:8px;}
  .fold-ico{width:16px;height:16px;color:#8a8faa;flex:none;}
  .fold-tail{display:flex;align-items:center;gap:6px;flex:none;}
  .fold-sel{font-size:12px;font-weight:600;color:#7a5fd0;letter-spacing:.2px;max-width:90px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fold-sel.none{color:#9a9fb5;font-weight:500;}
  .fold-chev{width:16px;height:16px;color:#8a8faa;flex:none;transition:transform .25s ease;}
  .fold-cat.open .fold-chev{transform:rotate(90deg);}
  .fold-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
  .fold-cat.open .fold-body{max-height:560px;}
  .fold-opt{width:100%;display:flex;align-items:center;gap:9px;padding:12px 16px;
    background:none;border:none;border-top:1px solid rgba(120,120,150,.12);cursor:pointer;
    font-size:13.5px;color:#4a5068;text-align:left;transition:background .15s;}
  .fold-opt:active{background:rgba(180,142,242,.14);}
  .fold-opt.active{background:linear-gradient(90deg,rgba(180,142,242,.2),rgba(180,142,242,.04));}
  .fold-opt-name{font-weight:600;color:#2a2f4a;letter-spacing:.2px;flex:none;}
  .fold-opt.active .fold-opt-name{color:#7a5fd0;}
  .fold-opt-sub{flex:1;font-size:11px;color:#9a9fb5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fold-opt-check{width:16px;height:16px;color:#b48ef2;opacity:0;flex:none;transition:opacity .15s;}
  .fold-opt.active .fold-opt-check{opacity:1;}

  /* track card —— 白玻璃 + 渐变专辑封面 + 立体播放按钮 */
  .mix-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:11px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-card-art{position:relative;width:62px;height:62px;border-radius:13px;flex:none;overflow:visible;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.15);}
  .mix-card-art-glyph{font-size:22px;line-height:1;font-weight:800;color:rgba(255,255,255,.94);
    text-shadow:0 1px 3px rgba(0,0,0,.3);}
  .mix-card-play{position:absolute;left:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 50% 32%, #e2c8ff 0%, #b48ef2 28%, #8b6fd6 58%, #5e3fa0 100%);
    box-shadow:
      inset 0 -3px 6px rgba(40,20,90,.5),
      inset 0 2px 3px rgba(255,255,255,.55),
      0 4px 10px rgba(110,70,200,.45),
      0 1px 2px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-shadow:0 1px 1px rgba(60,30,120,.6);outline:none;}
  .mix-card-play::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:62%;height:32%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;}
  .mix-card-play svg{width:14px;height:14px;position:relative;z-index:1;
    filter:drop-shadow(0 1px 1px rgba(40,20,90,.6));}
  .mix-card-body{flex:1;min-width:0;}
  .mix-card-name{font-size:15px;font-weight:700;letter-spacing:.2px;color:#2a2f4a;}
  .mix-card-sub{font-size:11.5px;color:#7a8099;margin-top:2px;}
  .mix-card .mix-vol{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .mix-vol-icon{width:14px;height:14px;color:#8a8faa;flex:none;}
  .mix-vol input[type=range]{flex:1;}
  .mix-vol-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* mix controls */
  .mix-controls{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);border-radius:16px;
    padding:10px 14px 6px;box-shadow:0 6px 20px rgba(60,40,120,.2),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .mix-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .mix-row-lbl{font-size:12.5px;color:#3a3f60;width:64px;letter-spacing:.2px;font-weight:600;}
  .mix-row input[type=range]{flex:1;}
  .mix-row-val{font-size:11px;color:#5a6080;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;}

  /* sliders —— 紫色轨道 */
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;background:linear-gradient(90deg,#b48ef2 0%,#b48ef2 var(--p,60%),#dcd6ea var(--p,60%),#dcd6ea 100%);
    border-radius:99px;outline:none;margin:0;padding:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4),inset 0 -1px 2px rgba(110,70,200,.3),inset 0 1px 1px rgba(255,255,255,.8);
    cursor:pointer;border:1px solid rgba(255,255,255,.6);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f0e6ff 40%, #b48ef2 100%);
    box-shadow:0 2px 6px rgba(110,70,200,.4);cursor:pointer;}

  /* back button —— 改为透明无背景以融入参考图 */
  #scr-mix .back-btn{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.7);color:#5a6080;
    box-shadow:0 2px 8px rgba(60,40,120,.18);}

  /* ---------- read (Function 7: 睡前阅读倒计时) ---------- */
  #scr-read{padding:0;background:#FAF4E8;top:-46px;bottom:0;overflow:hidden;}
  /* 三段背景：宽 100%，原始 9:16；均色度抠图透明。图层：图15(标题)最上 → 图16(图形)中 → 图17(绵羊)最下，标题栏永不被遮挡 */
  .read-bg-top,.read-bg-mid,.read-vid-canvas{
    position:absolute;left:50%;width:100%;aspect-ratio:9/16;
    background-repeat:no-repeat;
  }
  .read-bg-top{top:0;transform:translateX(-50%);background:url('read-top.png?v=5') center/100% 100% no-repeat;z-index:1;}
  .read-vid-canvas{bottom:0;transform:translateX(-50%);z-index:2;}
  .read-vid-canvas2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100%;aspect-ratio:9/16;z-index:4;pointer-events:none;}
  .read-bg-mid{top:50%;transform:translate(-50%,-50%);background:url('read-mid.png?v=5') center/100% 100% no-repeat;z-index:3;background-color:transparent;}
  /* 混音/阅读模式：隐藏星光、状态栏文字颜色适配背景 */
  #phone.read-mode #starfield{display:none;}
  #phone.read-mode .statusbar{display:none;}
  /* overlays 相对整屏定位 —— 对齐三张图各自的内容区 */
  .read-top-ctrls{position:absolute;inset:0;z-index:5;pointer-events:none;}
  .read-ico-btn{position:absolute;top:16px;width:44px;height:44px;border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;transform:translateX(-50%);pointer-events:auto;}
  .read-ico-btn:active{background:rgba(0,0,0,.06);}
  #readPlus{left:46.8%;}   /* add 1 min */
  #readMinus{left:57.8%;}  /* minus 1 min */
  #readClear{left:68.3%;}  /* clear */
  #readStart{left:78.6%;}  /* start */
  #readStop{left:88.8%;}   /* stop */
  .read-time{position:absolute;z-index:4;left:50%;top:31%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-weight:800;font-size:92px;letter-spacing:2px;color:#1a1a1a;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(255,255,255,.25);}
  .read-time .colon{opacity:.7;}
  .read-bubble{position:absolute;z-index:4;left:50%;top:72%;transform:translate(-50%,-50%);
    background:rgba(255,255,255,.94);color:#2a2a3a;padding:11px 18px;border-radius:22px;
    font-size:13px;font-weight:700;letter-spacing:.3px;max-width:78%;text-align:center;line-height:1.55;
    box-shadow:0 6px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);display:none;}
  .read-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:14px;height:14px;background:rgba(255,255,255,.94);
    box-shadow:2px 2px 4px rgba(0,0,0,.08);}
  .read-bubble.show{display:block;animation:bubblePop .35s ease;}
  @keyframes bubblePop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
  .read-music-btn{position:absolute;z-index:4;left:6%;bottom:8%;width:18%;aspect-ratio:1;
    border:none;background:transparent;cursor:pointer;border-radius:50%;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-music-btn:active{background:rgba(0,0,0,.06);}
  .read-home-btn{position:absolute;z-index:4;right:1.5%;bottom:0;width:13%;height:28%;
    border:none;background:transparent;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}
  .read-home-btn:active{background:rgba(0,0,0,.06);}
  .read-sheep-tap{position:absolute;z-index:4;left:18%;right:18%;top:74%;bottom:18%;
    background:transparent;border:none;cursor:pointer;outline:none;
    -webkit-tap-highlight-color:transparent;}

  /* quick mix sheet —— 阅读页配色（浅暖色） */
  .qm-bg{position:absolute;inset:0;z-index:45;background:rgba(80,60,30,.18);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s;}
  .qm-bg.show{opacity:1;pointer-events:auto;}
  .qm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:46;
    background:linear-gradient(180deg,#FFFDF7,#F6EDDA);border-radius:26px 26px 0 0;
    box-shadow:0 -10px 40px rgba(60,40,20,.18);border-top:1px solid rgba(120,90,40,.12);
    padding:16px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);
    transition:transform .38s cubic-bezier(.32,.72,.28,1);max-height:84%;overflow-y:auto;}
  .qm-sheet.show{transform:none;}
  .qm-grip{width:38px;height:4px;border-radius:99px;background:rgba(120,90,40,.22);margin:0 auto 16px;}
  .qm-title{font-family:var(--serif);font-size:18px;color:#4a3a22;letter-spacing:3px;text-align:center;margin-bottom:16px;font-weight:600;}
  .qm-label{font-size:12px;color:#8a7044;letter-spacing:1.5px;font-weight:700;margin:10px 0 8px;}
  .qm-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .qm-chip{font-size:13px;color:#5a4a2a;border:1px solid rgba(120,90,40,.2);border-radius:99px;
    padding:8px 14px;background:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;font-weight:600;}
  .qm-chip:active{transform:scale(.96);}
  .qm-chip.active{background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;border-color:transparent;
    box-shadow:0 3px 10px rgba(200,150,50,.35);}
  .qm-vol{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .qm-vol-lbl{font-size:13px;color:#5a4a2a;width:64px;font-weight:600;}
  .qm-vol input[type=range]{flex:1;background:linear-gradient(90deg,#E8B84B 0%,#E8B84B var(--p,60%),#E8D9B8 var(--p,60%),#E8D9B8 100%);}
  .qm-vol input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4),inset 0 -1px 2px rgba(200,150,50,.3),inset 0 1px 1px rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.6);}
  .qm-vol input[type=range]::-moz-range-thumb{background:radial-gradient(circle at 35% 30%, #fff 0%, #FBE7BD 45%, #E8B84B 100%);
    box-shadow:0 2px 6px rgba(200,150,50,.4);border:1px solid rgba(255,255,255,.6);}
  .qm-vol-val{font-size:12px;color:#8a7044;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:700;}
  .qm-close{width:100%;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(135deg,#E8B84B,#D99A32);color:#fff;font-weight:700;border:none;cursor:pointer;
    box-shadow:0 6px 16px rgba(200,150,50,.35);}

  /* read settings sheet */
  .read-settings-bg{position:absolute;inset:0;z-index:45;background:rgba(3,5,11,.62);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s;}

  .sbtn{flex:1;padding:14px;border-radius:14px;font-size:14px;letter-spacing:2px;transition:transform .15s;}

  .sbtn.main{background:linear-gradient(135deg,#8fa3ff,#b48ef2);color:#0b0f22;font-weight:600;}

function callAPI(input, signal){
  return new Promise(function(resolve, reject){
    var ctrl = null;
    var to = null;
    if(signal){
      signal.addEventListener('abort', function(){ reject(new Error('已取消')); });
    } else if('AbortController' in window){
      ctrl = new AbortController();
    }
    if(ctrl){ to = setTimeout(function(){ ctrl.abort(); }, 120000); }

    var body = {
      model: 'deepseek-chat',
      messages: [
        { role:'system', content: SYSTEM_PROMPT },
        { role:'user', content: input }
      ],
      temperature: 0.85,
      max_tokens: 3200,
      stream: false,
      response_format: { type: 'json_object' }
    };
    var headers = { 'Content-Type': 'application/json' };
    if (PROXY.url) {
      headers['apikey'] = PROXY.anonKey;   // 代理模式：anon key 门禁，密钥在服务端
    } else {
      headers['Authorization'] = 'Bearer ' + DEEPSEEK_KEY; // 直连模式
    }
    headers['X-Tracking-Id'] = TRACKING_ID;
    var opts = {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body)
    };
    if(ctrl) opts.signal = ctrl.signal;

    fetch(API_URL, opts).then(function(res){
      if(to) clearTimeout(to);
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(j){
          var msg = 'HTTP ' + res.status;
          if(j && j.error && j.error.message) msg = j.error.message;
          if(res.status === 401) msg = '鉴权失败：直连模式为 API Key 无效，代理模式为 anon key 不匹配（' + msg + '）';
          throw new Error('生成失败：' + msg);
        });
      }
      return res.json();
    }).then(function(j){
      if(!j || !j.choices || !j.choices[0] || !j.choices[0].message || !j.choices[0].message.content){
        throw new Error('模型没有返回内容，请重试');
      }
      var data;
      try{ data = extractJSON(j.choices[0].message.content); }
      catch(e){ throw new Error('返回内容解析失败，请重试'); }
      if(!data || !data.analysis || !String(data.analysis).trim()){
        throw new Error('返回结构不完整，请重试');
      }
      // 固定部分（承接/放松/晚安）+ DeepSeek 生成的深度分析，拼接成 sections
      data.sections = [
        { title: '承接与确认', text: FIXED_OPEN },
        { title: '深度分析', text: String(data.analysis).trim() },
        { title: '身体放松引导', text: FIXED_RELAX },
        { title: '晚安收尾', text: FIXED_END }
      ];
      resolve(data);
    }).catch(function(e){
      if(to) clearTimeout(to);
      if(e && e.name === 'AbortError'){ reject(new Error('请求超时（超过 120 秒），请检查网络后重试')); return; }
      if(e && e.message && e.message.indexOf('Failed to fetch') >= 0){
        reject(new Error('网络连接失败，请检查网络（或接口跨域受限）后重试')); return;
      }
      reject(e);
    });
  });
}

function extractJSON(s){
  s = String(s).trim().replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a) s = s.slice(a, b+1);
  return JSON.parse(s);
}

/* ================= 文本分句与停顿 ================= */
function splitSentences(text){
  var parts = [], buf = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    buf += ch;
    if('。！？!?；;\n'.indexOf(ch) >= 0){
      if(buf.trim()) parts.push(buf.trim());
      buf = '';
    }
  }
  if(buf.trim()) parts.push(buf.trim());
  var out = [];
  parts.forEach(function(p){
    p = p.replace(/^[\s，,、]+/, '');
    if(!p) return;
    if(p.length <= 90){ out.push(p); return; }
    var sub = '';
    for(var j=0;j<p.length;j++){
      sub += p[j];
      if('，,、：:'.indexOf(p[j]) >= 0 && sub.length >= 40){
        out.push(sub.trim()); sub = '';
      }
    }
    if(sub.trim()) out.push(sub.trim());
  });
  return out.length ? out : [text];
}

/* 4-7-8 呼吸节奏：计数句开启精确计时窗（4/7/8 秒整）。
   两个呼吸指令之间的间歇必须精确等于窗长；窗内解说（吸气时，想象…）
   顺延朗读并算入窗长，装不下的自动顺延到下一窗，本段末窗兜底播完。 */
function holdMs(text){
  var s = text.replace(/[。！？.!?…～\s]+$/, '');
  if(/(四|4)秒$/.test(s)) return 4000;
  if(/(七|7)秒$/.test(s)) return 7000;
  if(/(八|8)秒$/.test(s)) return 8000;
  return 0;
}
/* 通篇排程，生成播放序 player.seq（顺延的解说会被重排进后面的窗）：
   normal 普通句 / wfull 整窗静默 / wstart 计数句开窗 / wmid 窗中解说 / wend 窗尾解说 */
function planHolds(){
  var flat = player.flat, seq = [], carry = [];
  var i = 0;
  while(i < flat.length){
    var W = holdMs(flat[i].text);
    if(!W){ seq.push({ fi: i, role: 'normal' }); i++; continue; }
    /* 本窗自带解说：同段内、非计数结尾的后续句 */
    var own = [], j = i + 1;
    while(j < flat.length && flat[j].si === flat[i].si && !holdMs(flat[j].text)){ own.push(j); j++; }
    /* 段内是否还有更晚的计数窗（末窗需兜底播完所有顺延内容） */
    var lastWin = true;
    for(var k = j; k < flat.length; k++){
      if(flat[k].si !== flat[i].si) break;
      if(holdMs(flat[k].text)){ lastWin = false; break; }
    }
    var queue = carry.concat(own);
    carry = [];
    var used = 0, n = 0;
    if(lastWin){
      n = queue.length;                         /* 末窗：全部装入（可超窗） */
    }else{
      while(n < queue.length){                  /* 贪心装句，保持原顺序 */
        var need = 400 + estMs(flat[queue[n]].text);
        if(used + need <= W){ used += need; n++; } else break;
      }
    }
    if(n === 0){
      seq.push({ fi: i, role: 'wfull', W: W });
    }else{
      seq.push({ fi: i, role: 'wstart', W: W });
      var winUsed = 0;
      for(var m = 0; m < n; m++){
        winUsed += 400 + estMs(flat[queue[m]].text);
        seq.push({ fi: queue[m], role: (m === n - 1) ? 'wend' : 'wmid', W: W, winUsed: winUsed });
      }
    }
    carry = queue.slice(n);
    i = j;
  }
  player.seq = seq;
}
/* 本句读完后停多久：窗按真实朗读耗时结算，两种语音引擎通用 */
function gapAfter(st){
  if(!st) return 420;
  if(st.role === 'wfull') return st.W;                 /* 整窗精确静默 */
  if(st.role === 'wstart'){ player.holdT0 = Date.now(); return 400; }
  if(st.role === 'wmid') return 400;                   /* 窗中解说连读 */
  if(st.role === 'wend'){                              /* 窗尾：补足剩余，保证间歇=窗长 */
    var used = player.holdT0 ? (Date.now() - player.holdT0) : st.W;
    return Math.max(300, st.W - used);
  }
  return 420;
}
function estMs(text){
  return Math.max(1400, text.length / 3.6 * 1000 / player.rate);
}
function estTotal(){
  var t = 0;
  (player.seq || []).forEach(function(st){
    t += estMs(player.flat[st.fi].text);
    if(st.role === 'normal') t += 420;
    else if(st.role === 'wfull') t += st.W;
    else if(st.role === 'wend') t += Math.max(300, st.W - (st.winUsed || st.W));
    else t += 400;
  });
  return t;
}

/* ================= Edge 神经网络语音（前端直连，自然音色） ================= */
var EDGE_VOICES = [
  { id: 'zh-CN-XiaoxiaoNeural', label: '晓晓', desc: '温柔女声' },
  { id: 'zh-CN-YunxiNeural',    label: '云希', desc: '沉静男声' },
  { id: 'zh-CN-YunjianNeural',  label: '云健', desc: '浑厚男声' },
  { id: 'zh-CN-YunyangNeural',  label: '云扬', desc: '清晰男声' },
  { id: 'zh-CN-XiaoyiNeural',   label: '晓伊', desc: '轻柔女声' }
];
/* 前端直连微软 Edge 神经网络语音（无需中继） */
var EDGE_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
var EDGE_VER = '1-143.0.3650.75';
var WIN_EPOCH = 11644473600;
function edgeHexId(){
  var a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.prototype.map.call(a, function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function edgeJsDate(){
  var D = new Date();
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p2 = function(n){ return String(n).padStart(2,'0'); };
  return days[D.getUTCDay()] + ' ' + months[D.getUTCMonth()] + ' ' + p2(D.getUTCDate()) + ' ' +
    D.getUTCFullYear() + ' ' + p2(D.getUTCHours()) + ':' + p2(D.getUTCMinutes()) + ':' + p2(D.getUTCSeconds()) +
    ' GMT+0000 (Coordinated Universal Time)';
}
function edgeSecMsGec(){
  var t = Math.floor(Date.now() / 1000);
  t += WIN_EPOCH;
  t -= t % 300;
  t *= 10000000;
  var data = new TextEncoder().encode(String(t) + EDGE_TOKEN);
  return crypto.subtle.digest('SHA-256', data).then(function(hash){
    return Array.prototype.map.call(new Uint8Array(hash), function(b){ return b.toString(16).padStart(2,'0'); }).join('').toUpperCase();
  });
}
function edgeTTS(text, voice, ratePct){
  return edgeSecMsGec().then(function(gec){
    return new Promise(function(resolve, reject){
      var connId = edgeHexId();
      var qs = '/consumer/speech/synthesize/readaloud/edge/v1' +
        '?TrustedClientToken=' + EDGE_TOKEN +
        '&ConnectionId=' + connId +
        '&Sec-MS-GEC=' + gec +
        '&Sec-MS-GEC-Version=' + EDGE_VER;
      var ws = new WebSocket('wss://speech.platform.bing.com' + qs);
      var chunks = [];
      ws.binaryType = 'arraybuffer';
      var timer = setTimeout(function(){ try{ ws.close(); }catch(e){} reject(new Error('Edge TTS 超时')); }, 30000);
      ws.onopen = function(){
        var ts = edgeJsDate();
        var cfg = 'X-Timestamp:' + ts + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n' +
          JSON.stringify({ context:{ synthesis:{ audio:{ metadataoptions:{ sentenceBoundaryEnabled:'false', wordBoundaryEnabled:'false' }, outputFormat:'audio-24khz-48kbitrate-mono-mp3' } } } });
        ws.send(cfg);
        var rate = (ratePct > 0 ? '+' : '') + ratePct + '%';
        var ssml = "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='zh-CN'>" +
          "<voice name='" + voice + "'><prosody pitch='+0Hz' rate='" + rate + "' volume='+0%'>" + text + '</prosody></voice></speak>';
        var msg = 'X-RequestId:' + connId + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + ts + 'Z\r\nPath:ssml\r\n\r\n' + ssml;
        ws.send(msg);
      };
      ws.onmessage = function(ev){
        if(typeof ev.data === 'string'){
          if(ev.data.indexOf('Path:turn.end') >= 0){
            clearTimeout(timer);
            try{ ws.close(); }catch(e){}
            resolve(new Blob(chunks, { type: 'audio/mpeg' }));
          }
        } else {
          var buf = new Uint8Array(ev.data);
          if(buf.length > 2){
            var hlen = (buf[0] << 8) | buf[1];
            if(buf.length > 2 + hlen) chunks.push(buf.slice(2 + hlen));
          }
        }
      };
      ws.onerror = function(){ clearTimeout(timer); reject(new Error('Edge TTS 连接失败')); };
      ws.onclose = function(){ clearTimeout(timer); reject(new Error('Edge TTS 连接关闭')); };
    });
  });
}
var EDGE = {
  ok: !!TTS_URL,        /* 中继 /tts 可用性；连续失败才降级 */

  warned: false,
  fails: 0,             /* 连续失败计数（成功即清零） */
  voice: EDGE_VOICES[0].id,
  cache: new Map(),     /* 'voice|rate|text' → Promise<Blob> */
  audio: null, url: null
};
function edgeFail(){
  EDGE.fails++;
  if(EDGE.fails >= 3 && EDGE.ok){
    EDGE.ok = false;
    if(!EDGE.warned){ EDGE.warned = true; toast('自然语音暂不可用，已切换系统语音'); }
  }
}
try{
  var savedVoice = localStorage.getItem('ld_voice');
  for(var ev=0; ev<EDGE_VOICES.length; ev++){
    if(EDGE_VOICES[ev].id === savedVoice){ EDGE.voice = savedVoice; break; }
  }
}catch(e){}
function voiceLabel(){
  for(var i=0;i<EDGE_VOICES.length;i++){ if(EDGE_VOICES[i].id === EDGE.voice) return EDGE_VOICES[i].label; }
  return '晓晓';
}

function edgeAudio(text){
  var key = EDGE.voice + '|' + player.rate + '|' + text;
  if(EDGE.cache.has(key)) return EDGE.cache.get(key);
  var p = fetch(TTS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, voice: EDGE.voice, rate: Math.round((player.rate - 1) * 100) })
  }).then(function(r){
    if(!r.ok) throw new Error('tts ' + r.status);
    return r.blob();
  });
  p.catch(function(){ EDGE.cache.delete(key); });
  if(EDGE.cache.size > 160) EDGE.cache.delete(EDGE.cache.keys().next().value);
  EDGE.cache.set(key, p);
  return p;
}

function stopEdgeAudio(){
  if(EDGE.audio){
    try{ EDGE.audio.pause(); }catch(e){}
    EDGE.audio.onended = null;
    EDGE.audio.onerror = null;
    EDGE.audio = null;
  }
  if(EDGE.url){
    try{ URL.revokeObjectURL(EDGE.url); }catch(e){}
    EDGE.url = null;
  }
}

function playEdgeBlob(blob, st, token, next){
  var it = player.flat[st.fi];
  stopEdgeAudio();
  EDGE.url = URL.createObjectURL(blob);
  var a = new Audio(EDGE.url);
  EDGE.audio = a;
  a.onended = function(){
    if(token !== player.token || !player.playing) return;
    next(gapAfter(st));
  };
  a.onerror = function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  };
  a.play().catch(function(){
    if(token !== player.token || !player.playing) return;
    edgeFail();
    speakWeb(st, token, next);
  });
}

function buildFromData(data){

function currentSectionIdx(){
  var st = player.seq[player.idx];
  var it = st ? player.flat[st.fi] : null;
  return it ? it.si : Math.max(0, player.sections.length - 1);
}

function updateHighlight(){
  var st = player.seq[player.idx];
  var cur = st ? player.flat[st.fi] : null;
  var csi = cur ? cur.si : Math.max(0, player.sections.length - 1);
  var secs = $$('#transcript .ts-section');
  secs.forEach(function(el, i){
    el.classList.toggle('active', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#stageBar .stage').forEach(function(el, i){
    el.classList.toggle('cur', i === csi);
    el.classList.toggle('done', i < csi);
  });
  $$('#transcript .sent.now').forEach(function(e){ e.classList.remove('now'); });
  if(cur){
    var secEl = document.querySelector('#transcript .ts-section[data-s="' + cur.si + '"]');
    if(secEl){
      var el = secEl.querySelector('.sent[data-i="' + cur.ii + '"]');
      if(el){
        el.classList.add('now');
        var tr = $('#transcript');
        var top = el.offsetTop - tr.clientHeight * 0.4;
        try{ tr.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }catch(e){ tr.scrollTop = Math.max(0, top); }
      }
    }
  }
}

function updateProgress(){
  var pct = player.seq.length ? (player.idx / player.seq.length) * 100 : 0;
  if(player.finished) pct = 100;
  $('#progressFill').style.width = pct.toFixed(1) + '%';
}

function speakCurrent(){
  if(player.idx >= player.seq.length){ finish(); return; }
  var st = player.seq[player.idx];
  var it = player.flat[st.fi];
  updateHighlight();
  updateProgress();
  var token = ++player.token;

  function next(delay){
    player.timer = setTimeout(function(){
      if(token !== player.token || !player.playing) return;
      player.idx++;
      speakCurrent();
    }, delay);
  }

  /* 优先走中继的 Edge 神经网络语音（自然音色），失败自动降级系统语音 */
  if(EDGE.ok){
    var p1 = player.seq[player.idx + 1], p2 = player.seq[player.idx + 2];
    if(p1) edgeAudio(player.flat[p1.fi].text);
    if(p2) edgeAudio(player.flat[p2.fi].text);
    edgeAudio(it.text).then(function(blob){
      if(token !== player.token || !player.playing) return;
      EDGE.fails = 0;
      playEdgeBlob(blob, st, token, next);
    }).catch(function(){
      if(token !== player.token || !player.playing) return;
      /* 瞬时失败先重试一次（失败缓存已被逐出，会真正重发） */
      edgeAudio(it.text).then(function(blob){
        if(token !== player.token || !player.playing) return;
        EDGE.fails = 0;
        playEdgeBlob(blob, st, token, next);
      }).catch(function(){
        if(token !== player.token || !player.playing) return;
        edgeFail();
        speakWeb(st, token, next);
      });
    });
    return;
  }

  speakWeb(st, token, next);
}

function speakWeb(st, token, next){
  var it = player.flat[st.fi];
  /* 完全使用 Edge 神经网络语音，不再降级系统 Web Speech（机械读音） */
  edgeAudio(it.text).then(function(blob){
    if(token !== player.token || !player.playing) return;
    playEdgeBlob(blob, st, token, next);
  }).catch(function(){
    if(token !== player.token || !player.playing) return;
    /* Edge 直连失败：静默按估算时长推进，不播放机械读音 */
    next(Math.max(800, estMs(it.text)));
  });
}

function startTick(){

function pause(){
  if(!player.playing) return;
  player.playing = false;
  player.token++;
  clearTimeout(player.timer);
  stopEdgeAudio();
  stopEdgeAudio();
  player.elapsedBase += Date.now() - player.startAt;
  stopTick();
  setPlayIcon(false);
  $('#controlsHint').textContent = '已暂停 · 点击继续';
}
function togglePlay(){
  if(player.playing){ pause(); return; }
  if(player.finished){
    player.idx = 0;
    player.finished = false;
    player.elapsedBase = 0;
    $('#goodnight').classList.remove('show');
    play();
    return;
  }
  play();
}

function finish(){
  player.playing = false;
  player.finished = true;
  player.idx = player.seq.length;
  player.token++;
  clearTimeout(player.timer);
  stopTick();
  setPlayIcon(false);
  updateHighlight();
  updateProgress();
  $('#elapsed').textContent = fmtTime(player.elapsedBase + (Date.now() - player.startAt));
  $('#controlsHint').textContent = '引导已完成 · 点击播放可再听一遍';
  $('#goodnight').classList.add('show');
}

function stopAll(){
  player.playing = false;
  player.token++;
  clearTimeout(player.timer);
  stopEdgeAudio();
  stopEdgeAudio();
  stopTick();
  setPlayIcon(false);
  $('#goodnight').classList.remove('show');
}

function jumpToSection(si){
  if(si < 0 || si >= player.sections.length) return;
  var start = -1;
  for(var i=0;i<player.seq.length;i++){
    if(player.flat[player.seq[i].fi].si === si){ start = i; break; }
  }
  if(start < 0) return;
  var wasPlaying = player.playing;
  player.token++;
  clearTimeout(player.timer);
  stopEdgeAudio();
  stopEdgeAudio();
  if(wasPlaying) player.elapsedBase += Date.now() - player.startAt;
  player.idx = start;
  player.finished = false;
  $('#goodnight').classList.remove('show');
  if(wasPlaying){
    player.startAt = Date.now();
    speakCurrent();
  } else {
    updateHighlight();
    updateProgress();
  }
}
function stepSection(dir){
  var csi = currentSectionIdx();
  jumpToSection(csi + dir);
}

function cycleRate(){

  $('#btnSpeed').textContent = player.rate.toFixed(2) + '×';
  var mins = Math.max(1, Math.round(estTotal() / 60000));
  $('#remainLabel').textContent = '全文约 ' + mins + ' 分钟';

    player.token++;
    clearTimeout(player.timer);
    stopEdgeAudio();
    stopEdgeAudio();
    speakCurrent();
  }
  toast('语速 ' + player.rate.toFixed(2) + '×');
}

function cycleVoice(){

    { name:'虫鸣', sub:'夏夜低鸣', bg:'linear-gradient(135deg,#8a7848,#4a3a28)', src:null },
    { name:'雷雨', sub:'远雷阵阵', bg:'linear-gradient(135deg,#5a5a78,#2a2a48)', src:null },
    { name:'静电', sub:'白噪纯音', bg:'linear-gradient(135deg,#c8c8d4,#8888a0)', src:null }
  ],
  selMusic: -1, selNoise: -1,

};

function setMixPowerUI(on){
  MIX.playing = on;
  $('#btnMixPower').classList.toggle('off', !on);
}

function renderMixFold(){
  function fill(bodyId, list, selIdx, onClick){
    var c = $(bodyId); c.innerHTML = '';
    list.forEach(function(t, i){
      var b = document.createElement('button');
      b.className = 'fold-opt' + (i === selIdx ? ' active' : '');
      b.innerHTML =
        '<span class="fold-opt-name">' + t.name + '</span>' +
        '<span class="fold-opt-sub">' + t.sub + '</span>' +
        '<svg class="fold-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      b.addEventListener('click', function(){ onClick(i); });
      c.appendChild(b);
    });
  }
  fill('#foldBodyMusic', MIX.music, MIX.selMusic, function(i){
    MIX.selMusic = (MIX.selMusic === i) ? -1 : i;
    onMixTrackChange('music');
  });
  fill('#foldBodyNoise', MIX.noise, MIX.selNoise, function(i){
    MIX.selNoise = (MIX.selNoise === i) ? -1 : i;
    onMixTrackChange('noise');
  });
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  var mSel = $('#foldSelMusic');
  mSel.textContent = mt ? mt.name : '未选择';
  mSel.classList.toggle('none', !mt);
  var nSel = $('#foldSelNoise');
  nSel.textContent = nt ? nt.name : '未选择';
  nSel.classList.toggle('none', !nt);
}

function updateMixCard(kind){
  var list = kind === 'music' ? MIX.music : MIX.noise;
  var idx  = kind === 'music' ? MIX.selMusic : MIX.selNoise;
  var t    = idx >= 0 ? list[idx] : null;
  var artEl   = $(kind === 'music' ? '#musicCardArt'  : '#noiseCardArt');
  var glyphEl = $(kind === 'music' ? '#musicCardGlyph' : '#noiseCardGlyph');
  var nameEl  = $(kind === 'music' ? '#musicName' : '#noiseName');
  var subEl   = $(kind === 'music' ? '#musicSub'  : '#noiseSub');
  if(t){
    artEl.style.background = t.bg;
    glyphEl.textContent = t.name.charAt(0);
  } else {
    artEl.style.background = kind === 'music' ? 'linear-gradient(135deg,#b48ef2,#6b4fb8)' : 'linear-gradient(135deg,#5a6a88,#2a3450)';
    glyphEl.textContent = '';
  }
  nameEl.textContent = t ? t.name : '—';
  if(!t){ subEl.textContent = '未选择'; subEl.style.color = ''; }
  else if(!t.src){ subEl.textContent = '占位 · 即将上线'; subEl.style.color = ''; }
  else { subEl.textContent = t.sub; subEl.style.color = ''; }
}

function onMixTrackChange(kind){
  renderMixFold();
  if(kind) updateMixCard(kind);
  if(!MIX._inited) return;
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  if(MIX.aMusic){
    var newSrc = mt && mt.src ? mt.src : '';
    if(MIX.aMusic.src !== location.origin + '/' + newSrc && !(newSrc === '' && !MIX.aMusic.src)){
      try { MIX.aMusic.pause(); } catch(e){}
      MIX.aMusic.src = newSrc;
    }
  }
  if(MIX.aNoise){
    var newSrc2 = nt && nt.src ? nt.src : '';
    if(MIX.aNoise.src !== location.origin + '/' + newSrc2 && !(newSrc2 === '' && !MIX.aNoise.src)){
      try { MIX.aNoise.pause(); } catch(e){}
      MIX.aNoise.src = newSrc2;
    }
  }
  if(MIX.playing) startMixPlayback();
}

function startMixPlayback(){
  var any = false;
  if(MIX.aMusic && MIX.aMusic.src){
    MIX.aMusic.volume = MIX.musicVol;
    MIX.aMusic.loop = true;
    MIX.aMusic.currentTime = 0;
    MIX.aMusic.play().catch(function(){});
    any = true;
  }
  if(MIX.aNoise && MIX.aNoise.src){
    MIX.aNoise.volume = MIX.noiseVol;
    MIX.aNoise.loop = true;
    MIX.aNoise.currentTime = 0;
    MIX.aNoise.play().catch(function(){});
    any = true;
  }
  setMixPowerUI(any);
  if(!any) toast('所选项暂未提供音源');
}

function stopMixPlayback(){
  if(MIX.aMusic){ try{ MIX.aMusic.pause(); }catch(e){} }
  if(MIX.aNoise){ try{ MIX.aNoise.pause(); }catch(e){} }
  setMixPowerUI(false);
}

function toggleMixPower(){
  if(MIX.playing){ stopMixPlayback(); return; }
  if(MIX.selMusic < 0 && MIX.selNoise < 0){ toast('请先选择音乐或白噪音'); return; }
  startMixPlayback();
}

function bindMixSlider(id, labelId, setVol){
  var el = $(id);

/* ================= Function 7：睡前阅读倒计时 ================= */
var READ = {
  dur: 0,            // 默认 00:00（秒）
  remain: 0,
  running: false,
  startedAt: 0,
  timer: null,
  audioOn: false,      // 鼓励音频
  remindOn: false,     // 自定义提醒气泡
  remindText: '不要划出去，继续阅读',
  audioEvery: 300,     // 每 5 分钟一次
  lastAudioAt: 0,
  audioEl: null,
  _inited: false,
  _settingsOpen: false
};

var READ_PHRASES = [
  '继续保持，您做得很好',
  '再坚持一会儿就好',
  '专注阅读，身心都在安顿',
  '把注意力交还给这一页',
  '您的状态很平稳，慢慢来'
];

function readFmt(sec){
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return { m: m, s: s };
}

function readRender(){
  var t = readFmt(READ.remain);
  $('#readMin').textContent = String(t.m).padStart(2,'0');
  $('#readSec').textContent = String(t.s).padStart(2,'0');
}

function readTick(){
  if(!READ.running) return;
  var elapsed = Math.floor((Date.now() - READ.startedAt) / 1000);
  READ.remain = Math.max(0, READ.dur - elapsed);
  readRender();
  if(READ.audioOn && elapsed - READ.lastAudioAt >= READ.audioEvery && READ.remain > 30){
    READ.lastAudioAt = elapsed;
    readPlayPhrase(READ_PHRASES[Math.floor(Math.random() * READ_PHRASES.length)]);
  }
  if(READ.remain <= 0){ readFinish(); return; }
  READ.timer = setTimeout(readTick, 250);
}

function readPlayPhrase(text){
  if(!TTS_URL){ return; }
  fetch(TTS_URL, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: text, voice: 'zh-CN-XiaoxiaoNeural', rate: -10 }) })
    .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(blob){
      if(!READ.audioEl) READ.audioEl = new Audio();
      if(READ.audioEl.src){ try{ URL.revokeObjectURL(READ.audioEl.src); }catch(e){} }
      READ.audioEl.src = URL.createObjectURL(blob);
      READ.audioEl.volume = 0.55;
      READ.audioEl.play().catch(function(){});
    }).catch(function(){});
}

function readStart(){
  if(READ.running) return;
  if(READ.remain <= 0) return;
  READ.running = true;
  READ.startedAt = Date.now() - ((READ.dur - READ.remain) * 1000);
  READ.lastAudioAt = 0;
  readTick();
  toast('开始阅读');
}
function readPause(){
  READ.running = false;
  clearTimeout(READ.timer);
}
function readStop(){
  readPause();
  readRender();
  hideBubble();
}
function readAdjust(deltaSec){
  READ.dur = Math.max(0, Math.min(30 * 60, READ.dur + deltaSec));
  if(!READ.running) READ.remain = READ.dur;
  readRender();
}
function readClear(){
  readPause();
  READ.dur = 0;
  READ.remain = 0;
  readRender();
  hideBubble();
}

function readFinish(){
  readPause();
  readRender();
  hideBubble();
  // 自动进入后续睡眠流程：goodnight 覆盖层
  $('#goodnight').classList.add('show');
  if(TTS_URL){
    readPlayPhrase('阅读结束了，放下手机，准备入睡吧。');
  }
}

function showBubble(){
  if(!READ.remindOn || !READ.remindText){ hideBubble(); return; }
  $('#readBubble').textContent = READ.remindText;
  $('#readBubble').classList.add('show');
}
function hideBubble(){
  $('#readBubble').classList.remove('show');
}

function openReadSettings(){
  $('#rsAudio').classList.toggle('on', READ.audioOn);
  $('#rsAudio').setAttribute('aria-checked', READ.audioOn ? 'true':'false');
  $('#rsRemind').classList.toggle('on', READ.remindOn);
  $('#rsRemind').setAttribute('aria-checked', READ.remindOn ? 'true':'false');
  $('#rsInput').value = READ.remindText;
  $$('.rs-preset').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-text') === READ.remindText);
  });
  $('#readSettingsBg').classList.add('show');
  $('#readSettings').classList.add('show');
  READ._settingsOpen = true;
}
function closeReadSettings(){
  $('#readSettingsBg').classList.remove('show');
  $('#readSettings').classList.remove('show');
  READ._settingsOpen = false;
  // 把输入框的值作为当前提醒
  var v = $('#rsInput').value.trim();
  if(v){ READ.remindText = v; }
  if(READ.remindOn && READ.running) showBubble();
  else hideBubble();
}

/* ---- 快捷混音弹窗（复用 MIX 引擎，阅读页内完成设置） ---- */
function openQuickMix(){

function renderQuickMix(){

function quickMixSelect(kind, i){
  if(kind === 'music') MIX.selMusic = (MIX.selMusic === i) ? -1 : i;
  else MIX.selNoise = (MIX.selNoise === i) ? -1 : i;
  var mt = MIX.selMusic >= 0 ? MIX.music[MIX.selMusic] : null;
  var nt = MIX.selNoise >= 0 ? MIX.noise[MIX.selNoise] : null;
  if(MIX.aMusic){
    var s1 = mt && mt.src ? mt.src : '';
    var cur1 = MIX.aMusic.getAttribute('src') || '';
    if(cur1 !== s1 && !(s1 === '' && !cur1)){ try{ MIX.aMusic.pause(); }catch(e){} MIX.aMusic.src = s1; }
  }
  if(MIX.aNoise){
    var s2 = nt && nt.src ? nt.src : '';
    var cur2 = MIX.aNoise.getAttribute('src') || '';
    if(cur2 !== s2 && !(s2 === '' && !cur2)){ try{ MIX.aNoise.pause(); }catch(e){} MIX.aNoise.src = s2; }
  }
  if(MIX.selMusic >= 0 || MIX.selNoise >= 0){ startMixPlayback(); }
  else { stopMixPlayback(); }
  if(typeof renderMixFold === 'function') renderMixFold();
  if(typeof updateMixCard === 'function'){ updateMixCard('music'); updateMixCard('noise'); }
  renderQuickMix();
}

function initReadVideo(){
  var vid = $('#readVid');
  var canvas = $('#readVidCanvas');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;   // 处理分辨率（视频 2160x3840 的 1/4）
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        var minRGB = r < g ? (r < b ? r : b) : (g < b ? g : b);
        if(minRGB >= 228){ d[i+3] = 0; }                          // 白色/米白 → 透明
        else if(minRGB >= 200){ d[i+3] = ((228 - minRGB) * 255 / 28) | 0; }  // 边缘羽化
      }
      /* 擦除底部圆形（音乐按钮）和右侧长条（彩条）：540×960 坐标
         圆形用圆形遮罩、长条用紧贴元素的矩形遮罩，避免矩形外溢显出米色页底 */
      for(var y = 815; y < 960; y++){
        for(var x = 0; x < 165; x++){
          var dx = x - 77, dy = y - 892;
          if(dx*dx + dy*dy <= 72*72){ d[(y * W + x) * 4 + 3] = 0; }
        }
      }
      for(var y = 685; y < 960; y++){
        for(var x = 485; x < 540; x++){
          d[(y * W + x) * 4 + 3] = 0;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  vid.play().catch(function(){});
  requestAnimationFrame(chromaFrame);
}

function initReadVideo2(){
  var vid = $('#readVid2');
  var canvas = $('#readVidCanvas2');
  var ctx = canvas.getContext('2d');
  var W = 540, H = 960;
  canvas.width = W; canvas.height = H;

  function chromaFrame(){
    if(vid.readyState >= 2){
      ctx.drawImage(vid, 0, 0, W, H);
      var img;
      try { img = ctx.getImageData(0, 0, W, H); }
      catch(e){ requestAnimationFrame(chromaFrame); return; }
      var d = img.data;
      for(var i = 0; i < d.length; i += 4){
        var r = d[i], g = d[i+1], b = d[i+2];
        if(r >= 250 && g >= 250 && b >= 250){ d[i+3] = 0; }          // 纯白 → 透明
        else if(r >= 240 && g >= 240 && b >= 240){ d[i+3] = ((250 - ((r+g+b)/3|0)) * 255 / 10) | 0; }  // 边缘羽化
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(chromaFrame);
  }
  vid.play().catch(function(){});
  requestAnimationFrame(chromaFrame);
}
