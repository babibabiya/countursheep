      '用力把双肩向上耸起，尽量去碰你的耳朵，同时把脖子微微缩紧。保持这个状态。数 5 秒：1、2、3、4、5。现在，让双肩瞬间坠落下来，完全放松，脖子也回到自然位置。停留 3 秒，感受肩膀下沉时那种重量和松弛感。',
      '双手握紧拳头，用力到指节发白，同时绷紧你的前臂和上臂。保持这个状态。数 5 秒：1、2、3、4、5。现在，一下子张开双手，手指完全伸直，手臂彻底泄力，垂放在身体两侧或腿上。停留 3 秒，感受手指尖传来微微的酸胀感。',
      '深吸一口气，然后屏住，同时把胸部向前挺，后背微微向后弓，让整个上半身的核心都收紧。保持这个状态。数 5 秒：1、2、3、4、5。现在，用力呼出那口气，同时让胸口和后背一下子塌下来，完全松掉。停留 3 秒，感受呼吸变得平缓，胸腔不再发紧。',
      '用力收紧你的腹部肌肉，把肚脐往脊柱的方向压进去，感觉整个腰腹都变得硬邦邦的。保持这个状态。数 5 秒：1、2、3、4、5。现在，完全松开腹部，让它自然鼓起和回落，不再刻意用力。停留 3 秒，感受小腹区域那种柔软和放松的差异。',
      '用力收紧臀部肌肉，夹紧，同时把骨盆微微向前顶。保持这个状态。数 5 秒：1、2、3、4、5。现在，全部松开，让臀部和骨盆完全沉向椅子或床面。停留 3 秒，感受身体被下方支撑住的那种踏实感。',
      '绷紧大腿和小腿的肌肉，脚尖向前绷直。保持这个状态。数 5 秒：1、2、3、4、5。现在，双腿完全放松，脚踝和脚掌也彻底松弛。停留 3 秒，感受腿部的沉重和酸软感慢慢散开。',
      '用力勾起你的脚尖，脚趾向内蜷曲，同时脚掌收紧，感觉整个足底都绷住。保持这个状态。数 5 秒：1、2、3、4、5。现在，一下子松开，脚趾伸直，脚掌平放或自然垂落。停留 3 秒，感受脚底的温热感和落地感。',
      '现在，从头到脚都不再用力了。不做任何调整，就保持这样，用几秒钟感受一下全身的重量都交给支撑物。留意脸上、脖子、肩膀、手臂、胸背、腹部、臀部、双腿和双脚，每一处都比刚才更沉、更松。',
      '当你准备好了，轻轻动一动手指和脚趾，然后慢慢睁开眼睛。'
    ].join('\n') },
    '5-4-3-2-1 着陆练习': { text: [
      '好的，我们来一起做个小小的练习。先找一个舒服的姿势，坐着、靠着都可以。现在，看向周围，找到 5 件你能看到的东西。不需要是什么特别的物品，可以是光落在墙上的影子，可以是桌角的一缕灰尘，也可以是窗外摇晃的树叶。',
      '接下来，把注意力带到你的身体附近，找到 4 件你能触摸到的东西。用手掌或指尖去感受它，哪怕只是轻轻碰一下。说出它们的名字，感受它们的质地。',
      '然后，找到 3 个你现在能听到的声音。在心里数到第 3 个。',
      '再接着，轻轻吸一口气，找到 2 种你现在能闻到的气味。如果闻不到明显的味道，也没关系，就感受空气本身那种无味的气息。在心里记下它们。',
      '最后，把注意力带到嘴唇或舌尖，找到 1 样你能尝到的味道。可以是嘴里残留的一点点回甘，可以是喝过水后的清冽，也可以只是自己口腔里温暖的气息。不用刻意去找食物，只是感受现在这一刻的味道。',
      '好了，慢慢呼出一口气。你刚刚已经把自己带回了这个房间，这个时刻，这个身体里。你做得很好。',
      '如果愿意，可以再待一会儿，也可以慢慢动动手指、脚趾，然后再缓缓回到接下来的事情中。我在这里陪着你。'
    ].join('\n') },
    '安全空间想象': { text: [
      '第一步：闭上眼睛。轻轻合上眼皮，让外界的光线离开你的视线。',
      '第二步：在脑海中选一个地方。这个地方需要让你觉得安全、平静。可以是安静的海边，也可以是幽静的森林。如果你一时想不出，就选一个没有其他人的、温度适中的地方。',
      '第三步：想象那个地方的声音。如果是海边，想象波浪一次次拍上沙滩又退去的声音，持续而规律。如果是森林，想象风吹过树叶发出的沙沙声，或者远处偶尔的鸟鸣。在心里持续听到那个声音。',
      '第四步：想象那个地方的气味。慢慢地呼吸，让那种气味在你的想象中充满鼻腔。',
      '第五步：感受那个地方的温度和触感。感受空气接触皮肤的温度，再感受脚下的触感，是粗糙的，还是柔软的？',
      '第六步：停留一会儿。不需要做别的，就让自己停留在那个地方的声音、气味和温度里。待多久都可以。',
      '当你准备好了，慢慢做一次深呼吸，然后轻轻动一动手指和脚趾。再缓缓睁开眼睛，回到现在这个房间。',
      '你随时可以再回到那个地方。现在，按你自己的节奏回来就好。'
    ].join('\n') }
  };

  // ===== Qwen3-TTS 语音合成（GPU 服务器，自然中文音色），音色列表来自 tc-tts.js =====
  const VOICES = (window.TC_TTS && TC_TTS.VOICES) || [];

  // ===== 系统语音兜底（Qwen3-TTS 失败/离线时可朗读） =====
  function pickZhVoice() {
    try {
      if (!('speechSynthesis' in window)) return null;
      const voices = speechSynthesis.getVoices() || [];
      const zh = voices.filter(v => /^zh|^cmn|chinese/i.test(v.lang || ''));
      if (!zh.length) return null;
      const prefer = ['ting-ting','tingting','huihui','xiaoxiao','xiaoyi','yunxi','yunjian','meijia','sinji'];
      for (let i = 0; i < prefer.length; i++)
        for (let j = 0; j < zh.length; j++)
          if ((zh[j].name || '').toLowerCase().indexOf(prefer[i]) >= 0) return zh[j];
      const local = zh.filter(v => v.localService);
      return (local.length ? local[0] : zh[0]);
    } catch(e) { return null; }
  }

  // ===== 播放器 =====
  const playPauseBtn = document.getElementById('playPauseBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

  let queue = [], qIdx = 0, isPlaying = false, isPaused = false;
  let curAudio = null, curSystem = false, genToken = 0;
  let curBlobs = [], curBlobIdx = 0;

  // 当前音色（默认智瑜 101001，记住上次选择）
  let currentVoice = VOICES.length ? VOICES[0].id : 101001;
  try {
    const saved = parseInt(localStorage.getItem('relax_voice'), 10);
    if (saved && VOICES.some(v => v.id === saved)) currentVoice = saved;
  } catch(e) {}
  function voiceLabel() {
    for (const v of VOICES) if (v.id === currentVoice) return v.label;
    return '智瑜';
  }
  voiceBtn.textContent = voiceLabel();

  function setPlayBtn(state) {
    if (state === null) { playPauseBtn.hidden = true; return; }
    playPauseBtn.hidden = false;
    playPauseBtn.classList.toggle('playing', state);
    playPauseBtn.innerHTML = state ? ICON_PAUSE : ICON_PLAY;
  }

  function startSpeak(text) {
    stopSpeak();
    queue = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (!queue.length) return;
    qIdx = 0; isPlaying = true; isPaused = false;
    setPlayBtn(true);
    playSegment(queue[qIdx]);
  }

  // 播放一段：优先 Qwen3-TTS 自然音色，失败降级系统语音
  function playSegment(seg) {
    const token = ++genToken;
    curAudio = null; curSystem = false; curBlobs = []; curBlobIdx = 0;
    TC_TTS.synth(seg, currentVoice, -0.3).then(blobs => {
      if (token !== genToken || !isPlaying || isPaused) return;
      curBlobs = blobs; curBlobIdx = 0;
      playBlob(token);
    }).catch(() => {
      if (token !== genToken || !isPlaying || isPaused) return;
      playSystem(seg, token);
    });
  }

  function playBlob(token) {
    if (curBlobIdx >= curBlobs.length) { advance(); return; }
    const blob = curBlobs[curBlobIdx];
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    curAudio = a; curSystem = false;
    const next = () => {
      URL.revokeObjectURL(url);
      if (token !== genToken || !isPlaying || isPaused) return;
      if (curAudio === a) curAudio = null;
      curBlobIdx++;
      playBlob(token);
    };
    a.onended = next;
    a.onerror = next;
    a.play().catch(next);
  }

  function playSystem(seg, token) {
    curSystem = true;
    try {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(seg);
        const v = pickZhVoice(); if (v) u.voice = v;
        u.lang = 'zh-CN'; u.rate = 0.95;
        let finished = false;
        const finish = () => {
          if (finished) return; finished = true;
          if (token === genToken && isPlaying && !isPaused) advance();
        };
        u.onend = finish; u.onerror = finish;
        try { speechSynthesis.cancel(); } catch(e) {}
        speechSynthesis.speak(u);
        // 超时强制推进（防止部分浏览器不触发 onend）
        setTimeout(() => {
          if (!finished) { finished = true; try { speechSynthesis.cancel(); } catch(e){} finish(); }
        }, 45000);
        return;
      }
    } catch(e) {}
    // 无系统语音 → 静默推进
    setTimeout(() => { if (token === genToken && isPlaying && !isPaused) advance(); }, 800);
  }

  function advance() {
    qIdx++;
    if (qIdx >= queue.length) { finishSpeak(); return; }
    playSegment(queue[qIdx]);
  }

  function stopSpeak() {
    genToken++;
    isPlaying = false; isPaused = false;
    if (curAudio) { try { curAudio.pause(); } catch(e){} curAudio = null; }
    curSystem = false;
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e) {}
  }

  function finishSpeak() {
    isPlaying = false; isPaused = false;
    curAudio = null; curSystem = false;
    setPlayBtn(null);
  }

  function togglePlay() {
    if (!isPlaying) return;
    if (isPaused) {
      // 恢复
      isPaused = false; setPlayBtn(true);
      if (curSystem) {
        try { speechSynthesis.resume(); } catch(e) {}
      } else if (curAudio) {
        curAudio.play().catch(() => { advance(); });
      } else {
        playSegment(queue[qIdx]); // 合成中恢复：重播当前段
      }
    } else {
      // 暂停
      isPaused = true; setPlayBtn(false);
      if (curSystem) {
        try { speechSynthesis.pause(); } catch(e) {}
      } else if (curAudio) {
        try { curAudio.pause(); } catch(e) {}
      } else {
        genToken++; // 合成中暂停：使 pending 结果失效
      }
    }
  }
  playPauseBtn.addEventListener('click', togglePlay);

  // 音色切换（Qwen3-TTS 自然音色循环）
  function cycleVoice() {
    if (!VOICES.length) return;
    const i = VOICES.findIndex(v => v.id === currentVoice);
    currentVoice = VOICES[(i + 1) % VOICES.length].id;
    try { localStorage.setItem('relax_voice', String(currentVoice)); } catch(e) {}
    voiceBtn.textContent = voiceLabel();
    showToast('音色 · ' + voiceLabel());
    // 播放中切换：立即用新音色重读当前段
    if (isPlaying) {
      genToken++;
      if (curAudio) { try { curAudio.pause(); } catch(e){} curAudio = null; }
      curSystem = false;
      try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e) {}
      isPaused = false; setPlayBtn(true);
      playSegment(queue[qIdx]);
    }
  }
  voiceBtn.addEventListener('click', cycleVoice);

  // 温度计滑轨
  const ticksEl = document.getElementById('ticks');
  const rail = document.getElementById('sliderRail');
  const handle = document.getElementById('railHandle');
  const bigNum = document.getElementById('bigNum');
  let railValue = 4;
  const TOTAL = 10;

  for (let i = 1; i <= TOTAL; i++) {
    const t = document.createElement('span');
    t.className = 'tick';
    t.textContent = i;
    t.dataset.i = i;
    t.addEventListener('click', () => setValue(i));
    ticksEl.appendChild(t);
  }

  function setValue(v) {
    railValue = Math.max(1, Math.min(TOTAL, v));
    const pct = ((railValue - 1) / (TOTAL - 1)) * 100;
    handle.style.left = pct + '%';
    bigNum.textContent = railValue;
  }

  // 拖动滑块
  let dragging = false;
  function updateFromPointer(clientX) {
    const rect = rail.getBoundingClientRect();
    const x = clientX - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    const v = Math.round(pct * (TOTAL - 1)) + 1;
    setValue(v);
  }
  handle.addEventListener('pointerdown', e => {
    dragging = true;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => { if (dragging) updateFromPointer(e.clientX); });
  handle.addEventListener('pointerup', e => { dragging = false; handle.releasePointerCapture(e.pointerId); });
  handle.addEventListener('pointercancel', () => { dragging = false; });
  rail.addEventListener('click', e => {
    if (e.target === handle || e.target.closest('.rail-handle')) return;
    updateFromPointer(e.clientX);
  });
  setValue(4);

  // 详情按钮（弹窗）
  const modalMask = document.getElementById('modalMask');
  const modalNum = document.getElementById('modalNum');
  const modalText = document.getElementById('modalText');
  const DETAILS = {

<script>
(function() {
  'use strict';

  const notesArea = document.getElementById('notesArea');
  const notesInner = document.getElementById('notesInner');
  const addBtn = document.getElementById('addBtn');
  const boxBottom = document.getElementById('boxBottom');
  const backBtn = document.getElementById('backBtn');
  const expandMask = document.getElementById('expandMask');
  const noteModalContent = document.getElementById('noteModalContent');
  const noteModalDate = document.getElementById('noteModalDate');
  const noteModalClose = document.getElementById('noteModalClose');

  // 回形针 SVG
  const CLIP_SVG = `<svg viewBox="0 0 26 38">
    <path d="M9 4 C 9 2, 11 1, 13 1 C 15 1, 17 2, 17 4 L 17 30 C 17 34, 15 36, 13 36 C 11 36, 9 34, 9 30 L 9 8 C 9 7, 10 6, 11 6 C 12 6, 13 7, 13 8 L 13 28" fill="none" stroke="#a08868" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;

  let noteCount = 0;
  let pendingNote = null;

  function nowStr() {
    const d = new Date();
    const days = ['今天', '昨天'];
    const now = new Date();
    const yest = new Date(now - 86400000);
    function same(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    const day = same(d, now) ? '今天' : (same(d, yest) ? '昨天' : `${d.getMonth()+1}-${String(d.getDate()).padStart(2,'0')}`);
    const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return { day, time };
  }

  // ===== 便签持久化（供引导页 caignick 从收纳箱读取烦恼） =====
  const STORE_KEY = 'box_notes';

  function saveNotes() {
    try {
      const items = notesInner.querySelectorAll('.note-item');
      const list = [];
      items.forEach(function(el) {
        const contentEl = el.querySelector('.content');
        const text = contentEl ? contentEl.textContent.trim() : '';
        if (!text) return;
        const dateEl = el.querySelector('.date');
        const dayEl = dateEl ? dateEl.querySelector('.day') : null;
        const timeEl = dateEl ? dateEl.querySelector('.time') : null;
        list.push({
          text: text,
          day: dayEl ? dayEl.textContent : '',
          time: timeEl ? timeEl.textContent : ''
        });
      });
      localStorage.setItem(STORE_KEY, JSON.stringify(list));
    } catch(e) {}
  }

  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const list = JSON.parse(raw);
      if (!Array.isArray(list)) return;
      list.forEach(function(item) {
        if (item && item.text && item.text.trim()) {
          createNote(item.text, item.day, item.time);
        }
      });
    } catch(e) {}
  }

  function getGridPos(i) {
    const areaW = notesInner.clientWidth;
    const noteW = Math.min(areaW * 0.42, 160);
    const noteH = noteW * 1.05;
    const gap = 12;
    const cols = 2;
    const col = i % cols;
    const row = Math.floor(i / cols);
    const totalW = noteW * cols + gap * (cols - 1);
    const startX = (areaW - totalW) / 2;
    const startY = 14;
    return {
      x: startX + col * (noteW + gap),
      y: startY + row * (noteH + gap),
      w: noteW,
      h: noteH
    };
  }

  // 重排所有便签到网格位置（删除时往前补位）
  function repositionAll() {
    const items = notesInner.querySelectorAll('.note-item');
    let maxBottom = 0;
    items.forEach((el, i) => {
      const pos = getGridPos(i);
      el.style.width = pos.w + 'px';
      el.style.height = pos.h + 'px';
      el.style.position = 'absolute';
      el.style.zIndex = '5';
      el.style.transition = 'left 0.25s ease, top 0.25s ease, width 0.25s ease, height 0.25s ease';
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      maxBottom = Math.max(maxBottom, pos.y + pos.h);
    });
    // 更新 inner 高度，让便签区可上下滚动（+120 让便签能滚到纸箱后面）
    notesInner.style.height = (maxBottom + 140) + 'px';
  }

  function createNote(text = '', day, time) {
    const items = notesInner.querySelectorAll('.note-item');
    const i = items.length;
    const pos = getGridPos(i);
    if (!day || !time) {
      const t = nowStr();
      day = t.day; time = t.time;
    }
    const note = document.createElement('div');
    note.className = 'note-item';
    note.style.left = pos.x + 'px';
    note.style.top = pos.y + 'px';
    note.style.width = pos.w + 'px';
    note.style.height = pos.h + 'px';
    note.innerHTML = `
      <div class="paper"></div>
      <div class="clip">${CLIP_SVG}</div>
      <div class="content" contenteditable="true" spellcheck="false">${text}</div>
      <div class="date">
        <span class="day">${day}</span>
        <span class="time">${time}</span>
      </div>
      <button class="expand-btn">展开</button>
    `;
    notesInner.appendChild(note);

    // 溢出检测 + 展开功能
    const contentEl = note.querySelector('.content');
    const expandBtn = note.querySelector('.expand-btn');

    function checkOverflow() {
      const overflow = contentEl.scrollHeight > contentEl.offsetHeight + 2;
      note.classList.toggle('overflow', overflow);
    }
    requestAnimationFrame(checkOverflow);
    setTimeout(checkOverflow, 250);
    contentEl.addEventListener('input', function(){
      checkOverflow();
      saveNotes();
    });

    // 展开：弹出模态弹窗显示便签内容
    function openNoteModal() {
      noteModalContent.textContent = contentEl.textContent;
      const dateEl = note.querySelector('.date');
      noteModalDate.textContent = dateEl ? dateEl.textContent : '';
      expandMask.classList.add('show');
    }
    expandBtn.addEventListener('click', e => { e.stopPropagation(); openNoteModal(); });

    // 拖动逻辑（拖动时移到 body 置顶，松手恢复）
    let dragging = false;
    let startX, startY, origX, origY;
    note.addEventListener('pointerdown', e => {
      if (e.target.classList.contains('content')) return; // 编辑时不可拖
      if (e.target.closest('.expand-btn')) return; // 展开按钮不拖
      dragging = true;
      note.setPointerCapture(e.pointerId);
      const r = note.getBoundingClientRect();
      origX = r.left;
      origY = r.top;
      startX = e.clientX;
      startY = e.clientY;
      // 移出容器到 body，固定定位 + 最高层级
      document.body.appendChild(note);
      note.style.position = 'fixed';
      note.style.left = r.left + 'px';
      note.style.top = r.top + 'px';
      note.style.zIndex = '9999';
      note.style.transition = 'none';
      note.classList.add('dragging');
    });
    note.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      note.style.left = (origX + dx) + 'px';
      note.style.top = (origY + dy) + 'px';
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      try { note.releasePointerCapture(e.pointerId); } catch(_) {}
      note.classList.remove('dragging');
      // 先判断是否拖到纸箱（此时 note 仍在 body，坐标是视口坐标）
      const noteR = note.getBoundingClientRect();
      const boxR = boxBottom.getBoundingClientRect();
      const noteCx = noteR.left + noteR.width / 2;
      const noteCy = noteR.top + noteR.height / 2;
      const dropped = noteCx > boxR.left && noteCx < boxR.right &&
                     noteCy > boxR.top && noteCy < boxR.bottom;
      if (dropped) {
        // 先移回原位，弹出"您释怀了吗"确认框
        notesInner.appendChild(note);
        note.style.position = 'absolute';
        note.style.zIndex = '5';
        repositionAll();
        pendingNote = note;
        confirmMask.classList.add('show');
      } else {
        // 移回容器，恢复网格位置
        notesInner.appendChild(note);
        note.style.position = 'absolute';
        note.style.zIndex = '5';
        repositionAll();
      }
    }
    note.addEventListener('pointerup', endDrag);
    note.addEventListener('pointercancel', e => {
      if (!dragging) return;
      dragging = false;
      note.classList.remove('dragging');
      notesInner.appendChild(note);
      note.style.position = 'absolute';
      note.style.zIndex = '5';
      repositionAll();
    });

    // 创建后重排（刷新 inner 高度）
    repositionAll();
    saveNotes();
    return note;
  }

  // + 号点击：弹出输入弹窗
  const inputMask = document.getElementById('inputMask');
  const inputText = document.getElementById('inputText');
  const inputCancel = document.getElementById('inputCancel');
  const inputOk = document.getElementById('inputOk');

  function openInput() {
    inputText.value = '';
    inputMask.classList.add('show');
    setTimeout(() => inputText.focus(), 250);
  }
  function closeInput() { inputMask.classList.remove('show'); }

  addBtn.addEventListener('click', openInput);
  inputCancel.addEventListener('click', closeInput);
  inputOk.addEventListener('click', () => {
    const text = inputText.value.trim();
    if (text !== '') createNote(text);
    closeInput();
  });
  inputMask.addEventListener('click', e => {
    if (e.target === inputMask) closeInput();
  });

  // 返回
  backBtn.addEventListener('click', () => {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });

  // 点击弹窗外部空白（遮罩）关闭
  expandMask.addEventListener('click', (e) => {
    if (e.target === expandMask) expandMask.classList.remove('show');
  });
  // 关闭按钮
  noteModalClose.addEventListener('click', () => expandMask.classList.remove('show'));

  // ===== 释怀确认弹窗 =====
  const confirmMask = document.getElementById('confirmMask');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  confirmYes.addEventListener('click', () => {
    confirmMask.classList.remove('show');
    const target = pendingNote;
    pendingNote = null;
    if (target) {
      const contentEl = target.querySelector('.content');
      lastThought = contentEl ? contentEl.textContent.trim() : '';
      target.classList.add('dropping');
      setTimeout(() => {
        target.remove();
        repositionAll();
        saveNotes();
        // 删除后再问：这些想法还觉得没处理完吗？
        unfinishedMask.classList.add('show');
      }, 300);
    }
  });

  confirmNo.addEventListener('click', () => {
    confirmMask.classList.remove('show');
    pendingNote = null;
    showToast('没事，让情绪和您再待一会，不着急');
  });

  // ===== 未完成衔接：传给思绪整理（caignick） =====
  const unfinishedMask = document.getElementById('unfinishedMask');
  const unfinishedYes = document.getElementById('unfinishedYes');
  const unfinishedNo = document.getElementById('unfinishedNo');
  let lastThought = '';

  unfinishedYes.addEventListener('click', () => {
    unfinishedMask.classList.remove('show');
    try { localStorage.setItem('thought_box_handoff', lastThought); } catch(e) {}
    location.href = 'caignick.html?v=3';
  });
  unfinishedNo.addEventListener('click', () => {
    unfinishedMask.classList.remove('show');
    showToast('今晚就让它们安心待着吧，晚安。');
  });

  // ===== 引导页传来的烦恼：自动创建便签 =====
  function checkIncoming() {
    try {
      const incoming = localStorage.getItem('box_incoming');
      if (incoming && incoming.trim()) {
        localStorage.removeItem('box_incoming');
        createNote(incoming.trim());
        repositionAll();
        showToast('从思绪整理收来一条烦恼，已经放进箱子啦');
      }
    } catch(e) {}
  }
  checkIncoming();
  // 恢复已保存的便签（供本页与引导页读取）
  loadNotes();
  // 从浏览器缓存/返回键恢复页面时也检测（bfcache 恢复会触发 pageshow）
  window.addEventListener('pageshow', checkIncoming);
  // 别的标签页（引导页）写入时，本页实时收到并创建
  window.addEventListener('storage', function(e) {
    if (e.key === 'box_incoming') checkIncoming();
  });

})();
</script>

<script src="tc-tts.js?v=2"></script>
<script src="process.js"></script>
</body>

</template>

<iframe id="app-frame" title="好好睡觉"></iframe>

<script>
(function() {
  'use strict';

  var PAGES = ["index", "caignick", "sound", "read", "relax", "box"];
  var DEFAULT_PAGE = 'index';
  var TITLES = {"index": "好好睡觉", "caignick": "落定 · 睡前思绪整理", "sound": "落定 · 睡前思绪整理", "read": "月亮书房 - 好好睡觉", "relax": "情绪练习 - 好好睡觉", "box": "烦恼收纳箱 - 好好睡觉"};

  var frame = document.getElementById('app-frame');
  var stack = [];

  function pageHtml(page) {
    var tpl = document.getElementById('tpl-' + page);
    if (!tpl) { page = DEFAULT_PAGE; tpl = document.getElementById('tpl-' + page); }
    return tpl.innerHTML;
  }

  // 顶层页面：跳转改写为外壳路由
  function transform(html) {
    return html
      .replace(/location\.href\s*=\s*(['"])([^'"\s]+?)\.html\1/g, "parent.nav('$2')")
      .replace(/location\.href\s*=\s*map\[name\]/g, "parent.nav(map[name].replace(/\\.html$/,''))")
      .replace(/\bhistory\.back\(\)/g, 'parent.navBack()');
  }

  function render(page) {
    frame.srcdoc = transform(pageHtml(page));
    if (TITLES[page]) document.title = TITLES[page];
    try { history.replaceState(null, '', '#' + page); } catch (e) {}
  }

  window.nav = function(page) {
    page = String(page || '').replace(/\.html$/, '');
    if (PAGES.indexOf(page) < 0) page = DEFAULT_PAGE;
    stack.push(page);
    render(page);
  };

  window.navBack = function() {
    stack.pop();
    var prev = stack.length ? stack[stack.length - 1] : DEFAULT_PAGE;
    if (stack.length === 0) stack.push(prev);
    render(prev);
  };

  var init = (location.hash || '').replace('#', '').replace(/\.html$/, '');
  if (PAGES.indexOf(init) < 0) init = DEFAULT_PAGE;
  stack.push(init);
  render(init);
})();
</script>
