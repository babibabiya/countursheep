<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月亮书房 - 好好睡觉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #6b5a7e;
  overflow: hidden;
}

.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #e9defa;
}

.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #efe7ff 0%, #ffe6f0 46%, #fff3e0 100%);
}

/* ===== 暮色装饰：眨眼星星 + 飘云 ===== */
.deco { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.star-deco {
  position: absolute;
  animation: twinkle 2.6s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: .35; transform: scale(.82) rotate(-8deg); }
  50%      { opacity: 1;   transform: scale(1.08) rotate(8deg); }
}
.cloud-deco { position: absolute; animation: drift 9s ease-in-out infinite alternate; }
.cloud-deco.c2 { animation-duration: 12s; animation-delay: -4s; }
@keyframes drift {
  from { transform: translateX(-8px); }
  to   { transform: translateX(12px); }
}

/* ===== 顶栏 ===== */
.topbar {
  position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: max(16px, env(safe-area-inset-top)) 16px 4px;
  flex-shrink: 0;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid #fff; background: #fffdf8;
  color: #b48ad6; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(150,110,180,.18);
  transition: transform .15s;
}
.back-btn:active { transform: scale(.88); }
.back-btn svg { width: 20px; height: 20px; }
.title-sticker {
  display: flex; align-items: center; gap: 7px;
  background: #fffdf8; border: 2.5px dashed #e3c9f5;
  border-radius: 999px; padding: 8px 18px;
  font-size: 16px; font-weight: 900; letter-spacing: 2px; color: #a982d4;
  transform: rotate(-2deg);
  box-shadow: 0 4px 10px rgba(150,110,180,.15);
}
.title-sticker svg { width: 18px; height: 18px; }

/* ===== 猫头鹰 ===== */
.owl-zone {
  position: relative; z-index: 4;
  flex-shrink: 0;
  display: flex; justify-content: center;
  height: 128px; margin-bottom: -34px;
}
.owl-wrap {
  width: 138px; height: 138px;
  animation: owlFloat 3.4s ease-in-out infinite;
  transform-origin: 50% 90%;
}
.owl-wrap.running { animation: owlSwing 2.2s ease-in-out infinite; }
.owl-wrap.happy { animation: owlHappy .55s ease-in-out 5; }
@keyframes owlFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}
@keyframes owlSwing {
  0%, 100% { transform: rotate(-2.4deg); }
  50%      { transform: rotate(2.4deg); }
}
@keyframes owlHappy {
  0%, 100% { transform: translateY(0) scale(1); }
  35%      { transform: translateY(-14px) scale(1.05); }
  70%      { transform: translateY(0) scale(.96); }
}

/* ===== 主卡：摊开的书 ===== */
.card {
  position: relative; z-index: 3;
  flex: 1; min-height: 0;
  margin: 0 18px;
  background: #fffdf8;
  border-radius: 30px 30px 34px 34px;
  box-shadow: 0 12px 30px rgba(150,110,180,.20), inset 0 0 0 3px #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 44px 18px 18px;
}
/* 书脊中缝 */
.card::before {
  content: ''; position: absolute; top: 16px; bottom: 16px; left: 50%;
  width: 0; transform: translateX(-50%);
  border-left: 2.5px dashed #f0e6fb;
  border-radius: 2px;
}

.time {
  font-size: clamp(52px, 17vw, 68px);
  font-weight: 900; letter-spacing: 2px;
  color: #6b5a7e; line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 0 #f1e8ff;
}
.time .colon { color: #ffb7ce; animation: colonBlink 1s steps(1) infinite; }
@keyframes colonBlink { 50% { opacity: .25; } }

.status {
  margin-top: 9px;
  font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #bfa8d8;
}

/* 糖霜进度条 */
.frost-track {
  position: relative;
  width: 86%; height: 16px; margin-top: 20px;
  background: #f3edfb; border-radius: 999px;
  box-shadow: inset 0 2px 5px rgba(150,110,180,.14);
}
.frost-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, #c9a6f2, #ffb7ce);
  border-radius: 999px;
  transition: width 1s linear;
}
.frost-star {
  position: absolute; top: 50%; left: 0%;
  width: 26px; height: 26px; margin: -13px 0 0 -13px;
  transition: left 1s linear;
  filter: drop-shadow(0 2px 3px rgba(200,140,120,.35));
}

/* 时长选择 */
.presets {
  margin-top: 20px;
  display: flex; align-items: center; gap: 8px;
}
.chip {
  border: 2.5px solid #efe4fa; background: #faf6ff; color: #b09cd0;
  border-radius: 999px; padding: 7px 15px;
  font-size: 13px; font-weight: 900; letter-spacing: 1px;
  cursor: pointer; transition: all .18s; font-family: inherit;
}
.chip.sel {
  background: linear-gradient(135deg, #c9a6f2, #ffb7ce);
  border-color: transparent; color: #fff;
  box-shadow: 0 4px 10px rgba(201,166,242,.4);
  transform: scale(1.06);
}
.chip:active { transform: scale(.92); }
.mini {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2.5px solid #efe4fa; background: #faf6ff; color: #b09cd0;
  font-size: 17px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-family: inherit;
}
.mini:active { transform: scale(.85); background: #f3e9fd; }

/* ===== 开始大按钮 ===== */
.launch-zone { padding: 16px 18px 8px; flex-shrink: 0; position: relative; z-index: 3; }
.launch {
  width: 100%; height: 60px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, #c9a6f2 0%, #ffb7ce 100%);
  color: #fff; font-size: 19px; font-weight: 900; letter-spacing: 4px;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 20px rgba(201,140,210,.45), inset 0 -4px 0 rgba(120,70,160,.18);
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.launch:active { transform: scale(.96); }
.launch svg { width: 22px; height: 22px; }
.launch.running {
  background: linear-gradient(135deg, #ffb7ce 0%, #ffd08e 100%);
  box-shadow: 0 8px 20px rgba(255,160,190,.45), inset 0 -4px 0 rgba(200,110,140,.18);
  animation: launchBreath 2.4s ease-in-out infinite;
}
@keyframes launchBreath {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.025); }
}
.reset-btn {
  display: flex; align-items: center; gap: 6px;
  margin: 10px auto 0;
  background: none; border: none; cursor: pointer;
  color: #c3b2da; font-size: 12.5px; font-weight: 700; letter-spacing: 2px;
  font-family: inherit; padding: 6px 14px; border-radius: 999px;
  transition: all .15s;
}
.reset-btn:hover { color: #a982d4; }
.reset-btn:active { transform: scale(.9); }
.reset-btn svg { width: 14px; height: 14px; }

/* ===== 底部小场景 ===== */
.scene { flex-shrink: 0; position: relative; z-index: 2; height: 84px; }
.scene svg { display: block; width: 100%; height: 100%; }

.zzz {
  position: absolute; right: 12%; top: -4px; z-index: 4;
  font-weight: 900; color: #c9a6f2; pointer-events: none;
  display: none;
}
.zzz.show { display: block; }
.zzz span {
  position: absolute; right: 0; bottom: 0;
  font-size: 15px; opacity: 0;
  animation: zfloat 2.8s ease-out infinite;
}
.zzz span:nth-child(2) { font-size: 19px; animation-delay: .9s; }
.zzz span:nth-child(3) { font-size: 23px; animation-delay: 1.8s; }
@keyframes zfloat {
  0%   { opacity: 0; transform: translate(0, 6px) rotate(10deg); }
  30%  { opacity: .9; }
  100% { opacity: 0; transform: translate(22px, -34px) rotate(24deg); }
}

/* ===== 庆祝星星 ===== */
.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.confetti i {
  position: absolute; top: -24px; width: 14px; height: 14px; opacity: 0;
}
.confetti.go i { animation: fall 1.6s ease-in forwards; }
.confetti i:nth-child(1) { left: 12%; background: #ffd166; border-radius: 50%; animation-delay: 0s; }
.confetti i:nth-child(2) { left: 26%; background: #ffb7ce; border-radius: 3px; animation-delay: .15s; }
.confetti i:nth-child(3) { left: 42%; background: #c9a6f2; border-radius: 50%; animation-delay: .05s; }
.confetti i:nth-child(4) { left: 58%; background: #a8d8f0; border-radius: 3px; animation-delay: .25s; }
.confetti i:nth-child(5) { left: 72%; background: #ffd166; border-radius: 50%; animation-delay: .1s; }
.confetti i:nth-child(6) { left: 86%; background: #ffb7ce; border-radius: 3px; animation-delay: .3s; }
.confetti i:nth-child(7) { left: 34%; background: #b8e8c8; border-radius: 50%; animation-delay: .4s; }
.confetti i:nth-child(8) { left: 66%; background: #e8c8f0; border-radius: 3px; animation-delay: .2s; }
@keyframes fall {
  0%   { opacity: 0; transform: translateY(0) rotate(0) scale(.6); }
  12%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(78vh) rotate(420deg) scale(1.15); }
}

/* ===== Toast ===== */
.toast {
  position: absolute; left: 50%; bottom: 118px; z-index: 60;
  transform: translateX(-50%) translateY(14px);
  background: rgba(107,90,126,.92); color: #fff;
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
  padding: 9px 20px; border-radius: 999px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 入场弹入 ===== */
.pop-in { animation: popIn .5s cubic-bezier(.34,1.5,.64,1) backwards; }
.pop-in.d1 { animation-delay: .05s; }
.pop-in.d2 { animation-delay: .14s; }
.pop-in.d3 { animation-delay: .23s; }
.pop-in.d4 { animation-delay: .32s; }
.pop-in.d5 { animation-delay: .41s; }
@keyframes popIn {
  from { opacity: 0; transform: translateY(22px) scale(.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">

    <!-- 暮色装饰 -->
    <div class="deco" aria-hidden="true">
      <svg class="star-deco" style="left:11%;top:7%"  width="18" height="18" viewBox="0 0 20 20"><path d="M10 1l2.4 5.9L19 9l-5.4 2.9L12 19l-4-4.6L2 16l2.5-6L1 4l6.6 1.2z" fill="#ffd166"/></svg>
      <svg class="star-deco" style="right:13%;top:10%; animation-delay:.7s" width="14" height="14" viewBox="0 0 20 20"><path d="M10 1l2.4 5.9L19 9l-5.4 2.9L12 19l-4-4.6L2 16l2.5-6L1 4l6.6 1.2z" fill="#ffb7ce"/></svg>
      <svg class="star-deco" style="left:8%;top:38%; animation-delay:1.3s" width="12" height="12" viewBox="0 0 20 20"><path d="M10 1l2.4 5.9L19 9l-5.4 2.9L12 19l-4-4.6L2 16l2.5-6L1 4l6.6 1.2z" fill="#c9a6f2"/></svg>
      <svg class="star-deco" style="right:7%;top:52%; animation-delay:.4s" width="16" height="16" viewBox="0 0 20 20"><path d="M10 1l2.4 5.9L19 9l-5.4 2.9L12 19l-4-4.6L2 16l2.5-6L1 4l6.6 1.2z" fill="#ffd166"/></svg>
      <svg class="star-deco" style="left:16%;top:58%; animation-delay:1.8s" width="11" height="11" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#ffb7ce"/></svg>
      <svg class="cloud-deco" style="left:4%;top:5%" width="70" height="32" viewBox="0 0 64 30"><path d="M12 26a8 8 0 010-16 10 10 0 0119-3 8 8 0 019 14 9 9 0 01-5 5z" fill="#ffffff" opacity=".85"/></svg>
      <svg class="cloud-deco c2" style="right:3%;top:33%" width="58" height="27" viewBox="0 0 64 30"><path d="M12 26a8 8 0 010-16 10 10 0 0119-3 8 8 0 019 14 9 9 0 01-5 5z" fill="#ffffff" opacity=".7"/></svg>
    </div>

    <!-- 顶栏 -->
    <div class="topbar pop-in">
      <button class="back-btn" id="backBtn" aria-label="返回主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <div class="title-sticker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        月亮书房
      </div>
    </div>

    <!-- 守夜小猫头鹰 -->
    <div class="owl-zone pop-in d1">
      <div class="owl-wrap" id="owlWrap">
        <svg viewBox="0 0 140 140" aria-hidden="true">
          <!-- 帽影 -->
          <ellipse cx="70" cy="126" rx="40" ry="7" fill="#e8daf5" opacity=".6"/>
          <!-- 身体 -->
          <path d="M70 36 C 96 36 104 62 102 88 C 100 112 88 122 70 122 C 52 122 40 112 38 88 C 36 62 44 36 70 36 Z"
                fill="#fffdf8" stroke="#dcc8f0" stroke-width="3"/>
          <!-- 腹部羽毛纹理 -->
          <path d="M52 84 q6 7 0 14 M62 88 q6 7 0 14 M72 88 q6 7 0 14 M82 84 q6 7 0 14"
                stroke="#f0e6fb" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 睡帽 -->
          <path d="M40 44 C 44 24 60 16 74 18 C 90 20 100 32 100 44 C 88 38 78 36 70 36 C 58 36 48 38 40 44 Z"
                fill="#c9a6f2" stroke="#b18ce4" stroke-width="2.5"/>
          <path d="M50 30 q10 -5 20 -3 M62 21 q8 -1 15 4" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
          <!-- 帽尖垂坠 + 绒球 -->
          <path d="M96 40 q8 8 4 18" stroke="#c9a6f2" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="99" cy="62" r="6.5" fill="#ffd166" stroke="#f0b84a" stroke-width="2"/>
          <!-- 翅膀（抱书） -->
          <path d="M40 74 C 34 92 42 106 54 110 L 60 96 C 50 92 46 82 48 72 Z" fill="#f3e9fd" stroke="#dcc8f0" stroke-width="2.5"/>
          <path d="M100 74 C 106 92 98 106 86 110 L 80 96 C 90 92 94 82 92 72 Z" fill="#f3e9fd" stroke="#dcc8f0" stroke-width="2.5"/>
          <!-- 眼睛：阅读状态切换（睁眼 / 闭眼享受） -->
          <g id="owlEyesOpen">
            <circle cx="57" cy="66" r="12" fill="#fff"/>
            <circle cx="83" cy="66" r="12" fill="#fff"/>
            <circle class="pupil" cx="59" cy="67" r="5.5" fill="#5a4670"/>
            <circle class="pupil" cx="85" cy="67" r="5.5" fill="#5a4670"/>
            <circle cx="57" cy="64.5" r="2" fill="#fff"/>
            <circle cx="83" cy="64.5" r="2" fill="#fff"/>
          </g>
          <g id="owlEyesClosed" style="display:none">
            <path d="M50 66 q7 6 14 0" stroke="#5a4670" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M76 66 q7 6 14 0" stroke="#5a4670" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <!-- 嘴 + 腮红 -->
          <path d="M66 76 l4 5 l4 -5 z" fill="#ffb26e"/>
          <ellipse cx="49" cy="78" rx="6" ry="4" fill="#ffc4d4" opacity=".8"/>
          <ellipse cx="91" cy="78" rx="6" ry="4" fill="#ffc4d4" opacity=".8"/>
          <!-- 小书 -->
          <g transform="translate(46,92)">
            <path d="M0 8 Q 12 1 24 6 Q 36 1 48 8 L 48 22 Q 36 14 24 20 Q 12 14 0 22 Z" fill="#b79ced" stroke="#9a7cd8" stroke-width="2"/>
            <line x1="24" y1="6" x2="24" y2="20" stroke="#9a7cd8" stroke-width="2"/>
          </g>
          <!-- 小脚 -->
          <path d="M58 121 l-4 6 M58 121 l4 6 M58 121 l0 7" stroke="#ffb26e" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M82 121 l-4 6 M82 121 l4 6 M82 121 l0 7" stroke="#ffb26e" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- 书本主卡 -->
    <div class="card pop-in d2">
      <div class="time" id="timeText"><span id="cdM">30</span><span class="colon">:</span><span id="cdS">00</span></div>
      <div class="status" id="statusText">挑个时长，开读吧</div>

      <div class="frost-track" aria-hidden="true">
        <div class="frost-fill" id="frostFill"></div>
        <svg class="frost-star" id="frostStar" viewBox="0 0 20 20"><path d="M10 1l2.4 5.9L19 9l-5.4 2.9L12 19l-4-4.6L2 16l2.5-6L1 4l6.6 1.2z" fill="#ffd166" stroke="#f0b84a" stroke-width="1.2"/></svg>
      </div>

      <div class="presets">
        <button class="mini" id="btnMinus" aria-label="减少 5 分钟">−</button>
        <button class="chip" data-min="15">15 分</button>
        <button class="chip sel" data-min="30">30 分</button>
        <button class="chip" data-min="45">45 分</button>
        <button class="mini" id="btnPlus" aria-label="增加 5 分钟">＋</button>
      </div>
    </div>

    <!-- 开始按钮 -->
    <div class="launch-zone pop-in d3">
      <button class="launch" id="btnStart">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <span id="btnStartText">开始阅读</span>
      </button>
      <button class="reset-btn" id="btnReset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.4 9.4 0 00-6.5 2.7L3 8"/><path d="M3 3v5h5"/></svg>
        重新来
      </button>
    </div>

    <!-- 底部小场景 + Zzz -->
    <div class="scene pop-in d4" aria-hidden="true">
      <div class="zzz" id="zzz"><span>Z</span><span>z</span><span>Z</span></div>
      <svg viewBox="0 0 400 84" preserveAspectRatio="none">
        <path d="M0 46 Q 90 26 190 42 T 400 38 L 400 84 L 0 84 Z" fill="#ffe4ec"/>
        <path d="M0 62 Q 110 46 210 58 T 400 54 L 400 84 L 0 84 Z" fill="#ffd9e6"/>
        <!-- 小月牙 -->
        <path d="M348 22 a13 13 0 1 1 -6 -24 a10 10 0 1 0 6 24z" fill="#ffd166" opacity=".95"/>
        <!-- 两株小草 -->
        <path d="M40 58 q-2 -12 6 -18 M46 58 q4 -10 -2 -16" stroke="#b8e8c8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M96 64 q-2 -10 5 -15 M101 64 q3 -9 -2 -13" stroke="#c8f0d4" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- 三颗小星星点缀 -->
        <circle cx="150" cy="40" r="3" fill="#fff" opacity=".9"/>
        <circle cx="230" cy="34" r="2.5" fill="#fff" opacity=".8"/>
        <circle cx="300" cy="44" r="3" fill="#fff" opacity=".9"/>
      </svg>
    </div>

    <!-- 庆祝星星 -->
    <div class="confetti" id="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  </div>
</div>

<script>
(function() {
  'use strict';

  var $ = function(s) { return document.querySelector(s); };
  var toastEl = $('#toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2200);
  }

  /* ===== 计时状态 ===== */
  var total = 30 * 60, remain = total;
  var running = false, finished = false, timer = null;

  var timeText = $('#timeText'), cdM = $('#cdM'), cdS = $('#cdS');
  var statusText = $('#statusText'), btnStart = $('#btnStart'), btnStartText = $('#btnStartText');
  var iconPlay = $('#iconPlay'), iconPause = $('#iconPause');
  var frostFill = $('#frostFill'), frostStar = $('#frostStar');
  var owlWrap = $('#owlWrap'), zzz = $('#zzz');

  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    cdM.textContent = pad(Math.floor(remain / 60));
    cdS.textContent = pad(remain % 60);
    var pct = total > 0 ? ((total - remain) / total) * 100 : 0;
    pct = Math.max(0, Math.min(100, pct));
    frostFill.style.width = pct + '%';
    frostStar.style.left = 'clamp(13px, ' + pct + '%, calc(100% - 13px))';
  }

  function setStatus(text) { statusText.textContent = text; }

  function renderState() {
    btnStartText.textContent = running ? '暂停一下' : (finished ? '再读一次' : '开始阅读');
    iconPlay.style.display = running ? 'none' : '';
    iconPause.style.display = running ? '' : 'none';
    btnStart.classList.toggle('running', running);
    owlWrap.classList.toggle('running', running);
    zzz.classList.toggle('show', running);
    $('#owlEyesOpen').style.display = running ? 'none' : '';
    $('#owlEyesClosed').style.display = running ? '' : 'none';
  }

  function finishCelebrate() {
    running = false; finished = true;
    clearInterval(timer); timer = null;
    remain = 0; render(); renderState();
    setStatus('读完啦，今晚真棒！');
    owlWrap.classList.remove('happy');
    void owlWrap.offsetWidth;
    owlWrap.classList.add('happy');
    var c = $('#confetti');
    c.classList.remove('go'); void c.offsetWidth; c.classList.add('go');
    toast('读完啦！合上书，晚安 ✦');
    setTimeout(function() { owlWrap.classList.remove('happy'); }, 3200);
  }

  function tick() {
    remain--;
    if (remain <= 0) { finishCelebrate(); return; }
    render();
  }

  function startPause() {
    if (finished) { resetTo(total / 60); startPause(); return; }
    running = !running;
    if (running) {
      setStatus('猫头鹰陪着你呢');
      timer = setInterval(tick, 1000);
      toast('慢慢读，不着急');
    } else {
      clearInterval(timer); timer = null;
      setStatus('歇一会儿也没关系');
    }
    renderState();
  }

  function resetTo(min) {
    clearInterval(timer); timer = null;
    running = false; finished = false;
    total = remain = Math.max(5, Math.round(min)) * 60;
    render(); renderState();
    setStatus('挑个时长，开读吧');
  }

  btnStart.addEventListener('click', startPause);

  $('#btnReset').addEventListener('click', function() {
    resetTo(total / 60);
    toast('好，重新来');
  });

  document.querySelectorAll('.chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('sel'); });
      chip.classList.add('sel');
      var min = parseInt(chip.dataset.min, 10);
      var wasRunning = running;
      resetTo(min);
      if (wasRunning) { startPause(); toast('切换到 ' + min + ' 分钟，继续'); }
    });
  });

  function adjust(delta) {
    var min = Math.max(5, Math.round(total / 60) + delta);
    var wasRunning = running;
    resetTo(min);
    if (wasRunning) { startPause(); }
    toast(min + ' 分钟');
  }
  $('#btnPlus').addEventListener('click', function() { adjust(5); });
  $('#btnMinus').addEventListener('click', function() { adjust(-5); });

  $('#backBtn').addEventListener('click', function() {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });

  render();
})();
</script>

<script src="tc-tts.js"></script>
<script src="process.js"></script>
</body>
