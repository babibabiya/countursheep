<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月亮书房 - 好好睡觉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #efe7ff;
}

.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  background-color: #efe7ff; /* 加载兜底色 */
  background-image: url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/read/WechatIMG8342.jpg');
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* ===== 顶栏（仅返回键） ===== */
.topbar {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex; align-items: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 4px;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid #fff; background: #fffdf8;
  color: #b48ad6; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(150,110,180,.18);
  transition: transform .15s;
}
.back-btn:active { transform: scale(.88); }
.back-btn svg { width: 20px; height: 20px; }

/* ===== 椅子上读小羊（叠在懒人沙发位置） ===== */
.chair-gif {
  position: absolute;
  /* 定位在背景图右上的紫色懒人沙发坐垫上 */
  left: 33%;
  top: 26%;
  width: 58%;
  height: auto;
  /* gif 1190x1683，实际小羊在中间偏上；让小羊露在沙发中央 */
  object-fit: contain;
  object-position: center 38%;
  z-index: 2;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(60, 30, 80, 0.25));
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="topbar">
      <button class="back-btn" id="backBtn" aria-label="返回主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
    </div>
    <!-- 椅子上的读小羊 -->
    <img class="chair-gif" alt="读小羊" src="https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/read/Step%20by%20step%20guide%20to%20using%20Petal%20canvas%20plug-in.gif">
  </div>
</div>

<script>
(function() {
  'use strict';
  document.getElementById('backBtn').addEventListener('click', function() {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });
})();
</script>

<script src="tc-tts.js"></script>
<script src="process.js"></script>
</body>
</html>
