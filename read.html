<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月亮书房 - 好好睡觉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #efe7ff;
}

.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  background-color: #efe7ff; /* 加载兜底色 */
  background-image: url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/read/WechatIMG8342.jpg');
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* ===== 顶栏（仅返回键） ===== */
.topbar {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex; align-items: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 4px;
}
.back-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid #fff; background: #fffdf8;
  color: #b48ad6; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(150,110,180,.18);
  transition: transform .15s;
}
.back-btn:active { transform: scale(.88); }
.back-btn svg { width: 20px; height: 20px; }

/* ===== 椅子上读小羊（叠在懒人沙发位置） ===== */
.chair-gif {
  position: absolute;
  /* 把小羊"坐"在紫色懒人沙发坐垫上 */
  left: 50%;
  top: 12%;
  width: 34%;
  height: auto;
  z-index: 2;
  pointer-events: none;
  filter: drop-shadow(0 6px 12px rgba(60, 30, 80, 0.25));
}

/* ===== 底部覆盖层：盖住背景图自带的按钮 ===== */
.bottom-cover {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 10%;
  background: #fffdf8;
  z-index: 5;
}

/* ===== 倒计时圆形进度条（下半空白处） ===== */
.timer-zone {
  position: absolute;
  left: 0; right: 0;
  bottom: 9%;
  z-index: 6;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  /* 覆盖背景图白色框区域，把背景图自带的"开始阅读"按钮遮掉 */
  padding: 26px 0 30px;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fffdf8 22%, #fffdf8 100%);
}
.timer-ring {
  position: relative;
  width: 58%;
  aspect-ratio: 1 / 1;
}
.timer-ring svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.ring-track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.72);
  stroke-width: 12;
}
.ring-fg {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 12;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
}
.timer-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
}
.timer-time {
  font-size: 30px; font-weight: 900; letter-spacing: 1px;
  color: #7a5aa8; font-variant-numeric: tabular-nums; line-height: 1;
}
.timer-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #b9a2d8;
}

/* 控制按钮 */
.timer-controls {
  display: flex; align-items: center; gap: 14px;
}
.tc-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2.5px solid rgba(180, 138, 214, 0.5); background: rgba(255, 255, 255, 0.85);
  color: #b48ad6; font-size: 20px; font-weight: 900; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .15s; font-family: inherit;
  box-shadow: 0 3px 8px rgba(150, 110, 180, .15);
}
.tc-btn:active { transform: scale(.86); }
.tc-main {
  width: auto; height: 44px; padding: 0 30px; border-radius: 999px;
  background: linear-gradient(135deg, #c9a6f2 0%, #a982d4 100%);
  color: #fff; font-size: 15px; font-weight: 900; letter-spacing: 2px;
  border: none; cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 16px rgba(170, 130, 210, .4);
  transition: transform .15s, box-shadow .15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tc-main:active { transform: scale(.95); }
.tc-main.running {
  background: linear-gradient(135deg, #ffb7ce 0%, #ffa8c0 100%);
  box-shadow: 0 6px 16px rgba(255, 150, 180, .4);
}
.tc-main svg { width: 17px; height: 17px; }

/* ===== 音乐功能 ===== */
.music-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid #fff; background: #fffdf8;
  color: #b48ad6; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(150,110,180,.18);
  transition: transform .15s, background .15s, color .15s;
  margin-left: auto;
}
.music-btn:active { transform: scale(.88); }
.music-btn svg { width: 20px; height: 20px; }
.music-btn.playing { background: linear-gradient(135deg, #c9a6f2 0%, #a982d4 100%); color: #fff; }

/* 音乐选择面板 */
.music-mask {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(40, 25, 60, 0.42);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.music-mask.show { opacity: 1; pointer-events: auto; }
.music-panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
  background: #fffdf8;
  border-radius: 24px 24px 0 0;
  padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .35s cubic-bezier(.32,.72,.28,1);
}
.music-mask.show .music-panel { transform: none; }
.music-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.music-title { font-size: 16px; font-weight: 700; color: #5a4278; letter-spacing: 1px; }
.music-close { background: none; border: none; color: #b9a2d8; font-size: 26px; line-height: 1; cursor: pointer; padding: 0 4px; }
.music-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; scrollbar-width: none; }
.music-list::-webkit-scrollbar { display: none; }
.music-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 15px; border-radius: 14px;
  background: #f5eefc; border: 1.5px solid transparent;
  cursor: pointer; text-align: left; font-family: inherit; width: 100%;
  transition: border-color .15s, background .15s;
}
.music-item.active { border-color: #c9a6f2; background: #efe4fc; }
.music-item .m-ico { width: 18px; height: 18px; color: #b48ad6; flex-shrink: 0; }
.music-item .m-name { font-size: 14px; font-weight: 700; color: #5a4278; }
.music-item .m-sub { font-size: 11px; color: #b9a2d8; margin-top: 2px; }
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="topbar">
      <button class="back-btn" id="backBtn" aria-label="返回主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <button class="music-btn" id="musicBtn" aria-label="音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
    </div>
    <!-- 椅子上的读小羊 -->
    <img class="chair-gif" alt="读小羊" src="https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/read/Step%20by%20step%20guide%20to%20using%20Petal%20canvas%20plug-in.gif">

    <!-- 底部覆盖层：遮住背景图自带按钮 -->
    <div class="bottom-cover"></div>

    <!-- 倒计时圆形进度条 -->
    <div class="timer-zone">
      <div class="timer-ring">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c9a6f2"/>
              <stop offset="100%" stop-color="#a982d4"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="100" cy="100" r="88"/>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"/>
        </svg>
        <div class="timer-center">
          <div class="timer-time" id="timeText">30:00</div>
          <div class="timer-label" id="statusText">挑个时长，开读吧</div>
        </div>
      </div>

      <div class="timer-controls">
        <button class="tc-btn" id="btnMinus" aria-label="减少 5 分钟">−</button>
        <button class="tc-main" id="btnStart">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          <span id="btnStartText">开始阅读</span>
        </button>
        <button class="tc-btn" id="btnPlus" aria-label="增加 5 分钟">＋</button>
      </div>
    </div>

    <!-- 音乐选择面板 -->
    <div class="music-mask" id="musicMask">
      <div class="music-panel">
        <div class="music-head">
          <div class="music-title">阅读音乐</div>
          <button class="music-close" id="musicClose" aria-label="关闭">×</button>
        </div>
        <div class="music-list" id="musicList"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  document.getElementById('backBtn').addEventListener('click', function() {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });

  /* ===== 阅读音乐 ===== */
  var MUSIC = [
    { name:'钢琴', sub:'轻柔琴键', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/sleep.m4a' },
    { name:'自然', sub:'林间清风', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/soft-lullaby.m4a' },
    { name:'朝霞', sub:'晨光微曦', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/soft-morning-light.m4a' },
    { name:'柔弦', sub:'舒缓漂移', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/Soft%20Sine%20Drift.mp3' },
    { name:'弦梦', sub:'梦境漂浮', src:'https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheep/Soft%20Sine%20Drift%20(1).mp3' }
  ];

  var musicBtn = document.getElementById('musicBtn');
  var musicMask = document.getElementById('musicMask');
  var musicList = document.getElementById('musicList');
  var musicClose = document.getElementById('musicClose');
  var musicAudio = new Audio();
  musicAudio.loop = true;
  musicAudio.volume = 0.6;
  var curMusic = -1;
  var musicPlaying = false;

  function renderMusicList() {
    musicList.innerHTML = '';
    MUSIC.forEach(function(m, i) {
      var btn = document.createElement('button');
      btn.className = 'music-item' + (i === curMusic ? ' active' : '');
      btn.innerHTML = '<svg class="m-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><div><div class="m-name"></div><div class="m-sub"></div></div>';
      btn.querySelector('.m-name').textContent = m.name;
      btn.querySelector('.m-sub').textContent = m.sub;
      btn.addEventListener('click', function() { playMusic(i); });
      musicList.appendChild(btn);
    });
  }

  function playMusic(i) {
    if (i === curMusic && musicPlaying) { pauseMusic(); return; }
    curMusic = i;
    var m = MUSIC[i];
    musicAudio.src = m.src;
    musicAudio.play().then(function() {
      musicPlaying = true;
      musicBtn.classList.add('playing');
      renderMusicList();
    }).catch(function() {
      musicPlaying = false;
    });
    closeMusic();
  }

  function pauseMusic() {
    musicAudio.pause();
    musicPlaying = false;
    musicBtn.classList.remove('playing');
    renderMusicList();
  }

  function resumeMusic() {
    musicAudio.play().then(function() {
      musicPlaying = true;
      musicBtn.classList.add('playing');
    }).catch(function(){});
  }

  function toggleMusic() {
    if (musicPlaying) { pauseMusic(); }
    else if (curMusic >= 0) { resumeMusic(); }
    else { openMusic(); }
  }

  function openMusic() {
    renderMusicList();
    musicMask.classList.add('show');
  }
  function closeMusic() {
    musicMask.classList.remove('show');
  }

  musicBtn.addEventListener('click', toggleMusic);
  musicClose.addEventListener('click', closeMusic);
  musicMask.addEventListener('click', function(e) {
    if (e.target === musicMask) closeMusic();
  });

  /* ===== 倒计时圆形进度条 ===== */
  var CIRC = 2 * Math.PI * 88; // 圆环周长 ≈ 552.92

  var total = 30 * 60, remain = total;
  var running = false, finished = false, timer = null;

  var timeText = document.getElementById('timeText');
  var statusText = document.getElementById('statusText');
  var ringFg = document.getElementById('ringFg');
  var btnStart = document.getElementById('btnStart');
  var btnStartText = document.getElementById('btnStartText');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');

  // 初始化圆环
  ringFg.style.strokeDasharray = CIRC;
  ringFg.style.strokeDashoffset = 0;

  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    timeText.textContent = pad(Math.floor(remain / 60)) + ':' + pad(remain % 60);
    // 环从满到空：remain/total
    var ratio = total > 0 ? (remain / total) : 0;
    ringFg.style.strokeDashoffset = CIRC * (1 - ratio);
  }

  function renderState() {
    btnStartText.textContent = running ? '暂停一下' : (finished ? '再读一次' : '开始阅读');
    iconPlay.style.display = running ? 'none' : '';
    iconPause.style.display = running ? '' : 'none';
    btnStart.classList.toggle('running', running);
  }

  function tick() {
    remain--;
    if (remain <= 0) {
      remain = 0;
      running = false; finished = true;
      clearInterval(timer); timer = null;
      if (musicPlaying) pauseMusic();
      statusText.textContent = '读完啦，合上书，晚安 ✦';
      render(); renderState();
      return;
    }
    render();
  }

  function startPause() {
    if (finished) { resetTo(total / 60); startPause(); return; }
    running = !running;
    if (running) {
      statusText.textContent = '慢慢读，不着急';
      timer = setInterval(tick, 1000);
    } else {
      clearInterval(timer); timer = null;
      statusText.textContent = '歇一会儿也没关系';
    }
    renderState();
  }

  function resetTo(min) {
    clearInterval(timer); timer = null;
    running = false; finished = false;
    total = remain = Math.max(5, Math.round(min)) * 60;
    statusText.textContent = '挑个时长，开读吧';
    render(); renderState();
  }

  btnStart.addEventListener('click', startPause);

  function adjust(delta) {
    var min = Math.max(5, Math.round(total / 60) + delta);
    min = Math.min(min, 120);
    var wasRunning = running;
    resetTo(min);
    if (wasRunning) { startPause(); }
    statusText.textContent = min + ' 分钟';
  }
  document.getElementById('btnPlus').addEventListener('click', function() { adjust(5); });
  document.getElementById('btnMinus').addEventListener('click', function() { adjust(-5); });

  render();
})();
</script>

<script src="tc-tts.js?v=2"></script>
<script src="process.js"></script>
</body>
</html>
