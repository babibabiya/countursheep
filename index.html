<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>好好睡觉</title>
<style>
/* ============ 基础重置 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #2a2418;
  overflow: hidden;
}

/* ============ 桌面外层：外围纯色 ============ */
.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #f6e8d4;
  position: relative; overflow: hidden;
  padding: 0;
}

/* ============ 9:16 竖屏显示区 ============ */
.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: url('https://education-cos-1307366133.cos.ap-shanghai.myqcloud.com/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1/%E5%8C%97%E4%BA%AC%E6%8E%A2%E6%9C%88%E5%AD%A6%E6%A0%A1-%E5%AD%A6%E7%94%9F26/sheepimage/bg.png') center/cover no-repeat;
}

/* ============ 顶部导航区 ============ */
.topbar {
  position: relative;
  padding: 34px 24px 6px;
  flex-shrink: 0;
}

.title-wrap {
  margin-top: 8px;
  position: relative;
  z-index: 2;
}
.title-main {
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.3;
  color: #2d2417;
  letter-spacing: 1.5px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.subtitle {
  margin-top: 8px;
  font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: #8a7858;
  letter-spacing: 0.5px;
}

/* 撕纸月亮装饰（使用图片） */
.celestial {
  position: absolute;
  top: 16px; right: 14px;
  width: 118px; height: 118px;
  pointer-events: auto;
  z-index: 1;
}
.celestial img {
  width: 100%; height: 100%;
  object-fit: contain;
  cursor: pointer;
  filter: drop-shadow(0 6px 12px rgba(40, 40, 80, 0.25));
}
.celestial img:active { transform: scale(0.94); }

/* 星星闪烁 */
.celestial .star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 2px 0.5px rgba(255, 244, 200, 0.45);
  animation: twinkle 2.6s ease-in-out infinite;
  pointer-events: none;
}
.celestial .star.s1 { width: 1.5px; height: 1.5px; top: 16%; left: 22%; animation-delay: 0s; }
.celestial .star.s2 { width: 1px; height: 1px; top: 34%; left: 12%; animation-delay: 0.5s; }
.celestial .star.s3 { width: 1px; height: 1px; top: 10%; left: 52%; animation-delay: 1.1s; }
.celestial .star.s4 { width: 1.5px; height: 1.5px; top: 26%; right: 16%; animation-delay: 1.6s; }
.celestial .star.s5 { width: 1px; height: 1px; top: 56%; left: 16%; animation-delay: 2.0s; }
.celestial .star.s6 { width: 1px; height: 1px; bottom: 16%; right: 22%; animation-delay: 0.8s; }
.celestial .star.s7 { width: 1.5px; height: 1.5px; top: 42%; right: 10%; animation-delay: 1.3s; }
.celestial .star.s8 { width: 1px; height: 1px; bottom: 26%; left: 28%; animation-delay: 2.2s; }
.celestial .star.s9 { width: 1px; height: 1px; top: 22%; left: 40%; animation-delay: 0.3s; }
.celestial .star.s10 { width: 1.5px; height: 1.5px; top: 6%; left: 34%; animation-delay: 1.0s; }
.celestial .star.s11 { width: 1px; height: 1px; top: 30%; left: 6%; animation-delay: 0.7s; }
.celestial .star.s12 { width: 1.5px; height: 1.5px; top: 48%; left: 30%; animation-delay: 1.9s; }
.celestial .star.s13 { width: 1px; height: 1px; top: 66%; left: 34%; animation-delay: 0.4s; }
.celestial .star.s14 { width: 1px; height: 1px; bottom: 20%; left: 44%; animation-delay: 1.5s; }
.celestial .star.s15 { width: 1.5px; height: 1.5px; top: 36%; left: 44%; animation-delay: 2.4s; }
.celestial .star.s16 { width: 1px; height: 1px; top: 18%; left: 60%; animation-delay: 0.9s; }

@keyframes twinkle {
  0%, 100% { opacity: 0.12; transform: scale(0.75); }
  50% { opacity: 0.8; transform: scale(1.1); }
}

/* ============ 睡眠原因推荐 ============ */
.rec-box {
  flex-shrink: 0;
  margin: 8px 16px 4px;
  padding: 14px;
  background: rgba(255, 248, 236, 0.88);
  border-radius: 16px;
  border: 1.5px solid rgba(200, 160, 110, 0.25);
  box-shadow: 0 4px 14px rgba(80, 60, 40, 0.08);
  position: relative;
  z-index: 5;
}
.rec-q { font-size: 15px; font-weight: 700; color: #3a2e1e; padding-right: 48px; }
.cal-btn {
  position: absolute;
  top: 10px; right: 10px;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(90, 122, 168, 0.4);
  border-radius: 10px;
  background: linear-gradient(180deg, #6a8cc0 0%, #4a6a98 100%);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(74, 106, 152, 0.25);
  transition: transform 0.15s, box-shadow 0.15s;
}
.cal-btn:active { transform: scale(0.9); box-shadow: 0 1px 3px rgba(74, 106, 152, 0.3); }
.cal-btn:hover { box-shadow: 0 3px 10px rgba(74, 106, 152, 0.4); }
.cal-btn svg { width: 19px; height: 19px; }
.rec-sub { font-size: 11px; color: #9a8a70; margin: 3px 0 8px; line-height: 1.5; }
.rec-input {
  width: 100%; height: 50px;
  border: 1px solid #e2d2b8; border-radius: 10px;
  padding: 8px 10px; font-size: 13px;
  resize: none; outline: none;
  background: #fffdf8; color: #4a3a2a;
  font-family: inherit; line-height: 1.5;
}
.rec-input:focus { border-color: #c8a878; }
.rec-btn {
  width: 100%; margin-top: 8px; padding: 9px 0;
  border: none; border-radius: 20px;
  background: linear-gradient(180deg, #7a9cc8 0%, #5a7aa8 100%);
  color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(90, 122, 168, 0.25);
}
.rec-btn:active { transform: scale(0.97); }
.rec-btn:disabled { opacity: 0.55; pointer-events: none; }

/* ============ 按钮列表 ============ */
.cards {
  flex: 1;
  padding: 8px 16px 12px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  position: relative;
}
.cards::-webkit-scrollbar { display: none; }

.card {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
  border-radius: 18px;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(.34,1.4,.64,1);
  user-select: none;
}
.card:active { transform: scale(0.97); }
.card img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  filter: drop-shadow(0 4px 5px rgba(46, 34, 20, 0.55));
}

/* ============ 推荐结果弹层 ============ */
.rec-mask {
  position: absolute; inset: 0;
  background: rgba(40, 30, 20, 0.45);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.rec-mask.show { opacity: 1; pointer-events: auto; }
.rec-modal {
  width: 82%;
  max-width: 300px;
  background: #fff8e9;
  border-radius: 20px;
  padding: 24px 20px 20px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  transform: translateY(24px) scale(0.92);
  transition: transform 0.3s cubic-bezier(.34,1.3,.64,1);
}
.rec-mask.show .rec-modal { transform: translateY(0) scale(1); }
.rec-loading { font-size: 14px; color: #8a7a60; line-height: 1.8; padding: 20px 0; }
.rec-loading .dot { display: inline-block; animation: blink 1.2s infinite; }
.rec-loading .dot:nth-child(2){ animation-delay: .2s; }
.rec-loading .dot:nth-child(3){ animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }
.rec-msg { font-size: 14px; color: #4a3a2a; line-height: 1.7; text-align: left; margin-bottom: 16px; }
.rec-reco { font-size: 12px; color: #9a8a70; letter-spacing: 1px; margin-bottom: 8px; }
.rec-name {
  font-family: "Yuanti SC","YouYuan","幼圆","PingFang SC",sans-serif;
  font-size: 20px; font-weight: 700; color: #3a4a6a; margin-bottom: 6px;
}
.rec-desc { font-size: 13px; color: #7a6a50; line-height: 1.6; margin-bottom: 16px; }
.rec-actions { display: flex; gap: 10px; }
.rec-actions button {
  flex: 1; padding: 11px 0; border: none; border-radius: 20px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.rec-start { background: linear-gradient(180deg, #7a9cc8 0%, #5a7aa8 100%); color: #fff; box-shadow: 0 3px 10px rgba(90,122,168,0.3); }
.rec-add { background: #ece0c8; color: #7a6a50; }
.rec-actions button:active { transform: scale(0.96); }
.rec-sec {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px dashed #e0d0b8;
  font-size: 12px; color: #9a8a70;
}
.rec-sec span { color: #6a5a42; font-weight: 600; }
.rec-close {
  margin-top: 14px; font-size: 12px; color: #b0a088;
  background: none; border: none; cursor: pointer; font-family: inherit;
}

/* ============ Toast ============ */
.toast {
  position: absolute;
  bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(40, 30, 20, 0.9);
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 400;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  max-width: 88%;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

</style>
</head>

<script>
(function() {
  'use strict';

  // ====== DOM ======
  const toast = document.getElementById('toast');
  const recInput = document.getElementById('recInput');
  const recBtn = document.getElementById('recBtn');
  const calBtn = document.getElementById('calBtn');
  const recMask = document.getElementById('recMask');

  const recResult = document.getElementById('recResult');
  const recMsg = document.getElementById('recMsg');

  const recDesc = document.getElementById('recDesc');
  const recStart = document.getElementById('recStart');
  const recAdd = document.getElementById('recAdd');
  const recSec = document.getElementById('recSec');
  const recSecName = document.getElementById('recSecName');
  const recClose = document.getElementById('recClose');

  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 判断输入是否为乱码/无意义内容（前端预检，减少无效调用）
  function isGarbled(text) {
    const s = String(text || '').trim();
    if (s.length < 2) return true;
    const hasChinese = /[\u4e00-\u9fa5]/.test(s);
    const hasWord = /[a-zA-Z]{2,}/.test(s); // 至少两个连续字母视为有单词
    if (!hasChinese && !hasWord) return true; // 既无中文也无英文单词 → 符号/数字/乱码
    const compact = s.replace(/[\s\p{P}]/gu, '');
    if (compact && new Set(compact).size === 1) return true; // 全是重复单字符
    return false;
  }

  // ====== 功能映射 ======
  const FUNC = {
    thought_box:       { name: '烦恼收纳箱',     desc: '把想说的话、放不下的事先写下来，收进箱子里。', page: 'box.html', dur: 10 },

    music:             { name: '音乐',           desc: '听点轻柔安神的音乐，陪你慢慢入睡。', page: 'sound.html', dur: 0 },
    sleep_audio:       { name: '助眠音频',       desc: '舒缓的声音引导，帮你放松入睡。', page: 'sound.html', dur: 0 },
    safety:            { name: '陪伴与支持',     desc: '此刻你并不孤单，我们更想先陪你聊一聊。', page: 'safety', dur: 0 }
  };

  // ====== 推荐引擎 prompt（只做需求识别+功能推荐，不做心理诊断） ======
  const REC_PROMPT = [
    '你是一个睡眠辅助应用的「需求识别与功能推荐」引擎。用户会描述自己为什么睡不着。请判断用户此刻最需要什么，从下面的功能里选一个最合适的作为主推荐（primary_function），再选一个作为次推荐（secondary_function）。',
    '',
    '功能列表（只能从这些 id 里选）：',
    '- thought_box：烦恼收纳箱——表达、倾诉、把想法写下来、记录明天要做的事、安放悬而未决的担心',
    '- thought_completion：引导入睡音频——反复回想某件事、后悔、反刍、对未来的担忧、需要把一件事"想完放下"',
    '- reading：睡前阅读——脑子活跃但没有具体烦恼、单纯不困、想转移注意力',
    '- relaxation：放松练习——身体紧绷、心跳快、坐立不安、身体很清醒',
    '- white_noise：白噪音——被环境噪音干扰、想要安静氛围',
    '- music：音乐——想听点安神的东西',
    '- sleep_audio：助眠音频——想要舒缓声音引导入睡',
    '',
    '映射提示：想表达/倾诉 → thought_box；回想过去/后悔/反刍 → thought_completion；未来担忧 → thought_completion；需要记住明天的事 → thought_box；身体紧绷/心跳/坐立不安 → relaxation；脑子活跃无具体担忧 → reading 或 thought_box；不困 → reading；环境噪音 → white_noise；想听安神 → music 或 white_noise；说不清具体原因、单纯就是睡不着（如"不知道，就是睡不着""没什么原因就是睡不着"）→ reading（睡前阅读）。',
    '',
    '要求：',
    '1. 不要诊断用户。不要写"你有焦虑症""你有情绪压抑"这类话；如需提及心理概念，用"这有点像……的模式"。',
    '2. message 用温暖、口语化的中文，一句话点出用户此刻的需求（例如"听起来你脑子里装了很多话，需要一个地方把它们安放下来。"），统一用"你"，不要长篇大论。',
    '3. 安全：如果用户提到自残、自杀、立即危险、被虐待等严重情况，primary_function 固定返回 "safety"，message 给予安抚与陪伴，并温和建议联系信任的人或专业帮助；此时 secondary_function 也返回 "safety"。',
    '4. 如果用户输入的是乱码、无意义的字符、随机键盘敲击，或你完全无法理解其含义，primary_function 固定返回 "unclear"，secondary_function 也返回 "unclear"，message 用温和、高情商、口语化的方式请用户重新表达（例如"我好像没太读懂你的意思，可以换个方式再跟我说说吗？"），不要指责。',
    '',
    '只输出 JSON，不要输出任何其他文字：',
    '{"need_type":"需求类型英文","primary_function":"主推荐功能id","secondary_function":"次推荐功能id","message":"一句话安抚+点出需求"}'
  ].join('\n');

  const DEEPSEEK_KEY = 'sk-069baa049ed24bb2972699d84184ac13';
  const API_URL = 'https://api.deepseek.com/chat/completions';

  function analyzeReason(input) {
    return new Promise(function(resolve, reject) {
      const ctrl = ('AbortController' in window) ? new AbortController() : null;
      const to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 60000) : null;
      const body = {
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: REC_PROMPT },
          { role: 'user', content: input }
        ],
        temperature: 0.5,
        max_tokens: 400,
        stream: false,
        response_format: { type: 'json_object' }
      };
      const opts = {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + DEEPSEEK_KEY
        },
        body: JSON.stringify(body)
      };
      if (ctrl) opts.signal = ctrl.signal;

      fetch(API_URL, opts).then(function(res) {
        if (to) clearTimeout(to);
        if (!res.ok) {
          return res.json().catch(function(){ return null; }).then(function(j) {
            const msg = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + res.status);
            throw new Error(msg);
          });
        }
        return res.json();
      }).then(function(j) {
        if (!j || !j.choices || !j.choices[0] || !j.choices[0].message || !j.choices[0].message.content) {
          throw new Error('模型没有返回内容，请重试');
        }
        let raw = String(j.choices[0].message.content).trim();
        raw = raw.replace(/^```(json)?/i, '').replace(/```\s*$/, '').trim();
        const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
        if (a >= 0 && b > a) raw = raw.slice(a, b + 1);
        const data = JSON.parse(raw);
        if (!data.primary_function) throw new Error('返回结构不完整');
        resolve(data);
      }).catch(function(e) {
        if (to) clearTimeout(to);
        if (e && e.name === 'AbortError') { reject(new Error('请求超时，请重试')); return; }
        reject(e);
      });
    });
  }

  // ====== 展示推荐 ======
  let currentRec = null;

  function showRecommend(data) {
    const pf = data.primary_function;
    const sec = data.secondary_function;
    const func = FUNC[pf] || FUNC.thought_box;
    currentRec = data;

    recLoading.hidden = true;
    recResult.hidden = false;
    recMsg.textContent = data.message || '';
    recName.textContent = func.name;
    recDesc.textContent = func.desc;

    // 安全路由：不推荐正常功能
    if (pf === 'safety') {
      recName.textContent = FUNC.safety.name;
      recDesc.textContent = '请优先联系你信任的人，或寻求专业帮助。你不是一个人，我们一直都在。';
      recStart.textContent = '我知道了';
      recAdd.hidden = true;
      recSec.hidden = true;
      currentRec.safety = true;
    } else if (pf === 'unclear') {
      // 高情商退回：没读懂，请用户重新输入
      recName.textContent = '再跟我说说';
      recDesc.textContent = '可以说说具体发生了什么，或者你此刻身体、心里的感觉。';
      recStart.textContent = '重新输入';
      recAdd.hidden = true;
      recSec.hidden = true;
      currentRec = { safety: true, unclear: true };
    } else {
      recStart.textContent = '立即开始';
      recAdd.hidden = false;
      if (sec && FUNC[sec] && sec !== pf) {
        recSec.hidden = false;
        recSecName.textContent = FUNC[sec].name;
      } else {
        recSec.hidden = true;
      }
      currentRec.safety = false;
    }
  }

  // 日历图标：跳转睡前日程
  if (calBtn) {
    calBtn.addEventListener('click', function() {
      location.href = 'routine.html';
    });
  }

  recBtn.addEventListener('click', function() {
    const text = recInput.value.trim();
    if (!text) { showToast('先写两句，告诉我你此刻的心情吧'); return; }
    if (isGarbled(text)) {
      showToast('我好像没太读懂你的意思，可以换种方式再跟我说说吗？');
      return;
    }
    recBtn.disabled = true;
    recBtn.textContent = '正在理解你的心情…';
    recLoading.hidden = false;
    recResult.hidden = true;
    recMask.classList.add('show');

    analyzeReason(text).then(function(data) {
      showRecommend(data);
    }).catch(function(e) {
      recMask.classList.remove('show');
      showToast('没能连上服务：' + (e.message || '请稍后再试'));
    }).finally(function() {
      recBtn.disabled = false;
      recBtn.textContent = '看看什么能帮到你';
    });
  });

  // 立即开始
  recStart.addEventListener('click', function() {
    if (!currentRec) return;
    if (currentRec.unclear) {
      recMask.classList.remove('show');
      recInput.focus();
      return;
    }
    if (currentRec.safety) {
      recMask.classList.remove('show');
      return;
    }
    const func = FUNC[currentRec.primary_function];
    if (func && func.page && func.page !== 'safety') {
      location.href = func.page;
    }
  });

  // 加入睡前流程
  recAdd.addEventListener('click', function() {
    if (!currentRec || currentRec.safety) return;
    const func = FUNC[currentRec.primary_function];
    try {
      localStorage.setItem('routine_add', JSON.stringify({
        type: currentRec.primary_function,
        name: func.name,
        dur: func.dur
      }));
    } catch(e) {}
    location.href = 'routine.html';
  });

  recClose.addEventListener('click', function() {
    recMask.classList.remove('show');
  });
  recMask.addEventListener('click', function(e) {
    if (e.target === recMask) recMask.classList.remove('show');
  });

  // ====== 各功能按钮跳转到对应独立页面 ======
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      const name = card.dataset.name;
      const map = {
        '引导入睡音频': 'caignick.html',
        '蔡格尼克': 'caignick.html',
        '白噪音': 'sound.html',
        '阅读倒计时': 'read.html',
        '放松练习': 'relax.html',
        '烦恼收藏箱': 'box.html'
      };
      if (map[name]) {
        location.href = map[name];
      } else {
        showToast('点击了 ' + name);
      }
    });
  });

  // 月亮 → 睡前流程
  const moonBtn = document.getElementById('moonBtn');
  if (moonBtn) {
    moonBtn.addEventListener('click', () => { location.href = 'routine.html'; });
  }

})();
</script>
