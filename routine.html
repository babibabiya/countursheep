<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>睡前流程 - 好好睡觉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #2a2418;
  overflow: hidden;
}
.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #f6e8d4;
  position: relative; overflow: hidden;
  padding: 0;
}
.phone {
  width: min(100vw, calc(100vh * 9 / 16));
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column;
  background:
    radial-gradient(120% 50% at 50% -8%, #fdeef0 0%, transparent 60%),
    radial-gradient(100% 50% at 50% 108%, #e7eefb 0%, transparent 60%),
    linear-gradient(180deg, #fdf5ec 0%, #f8eef6 55%, #eef2f9 100%);
}

/* 顶部 */
.header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px;
  position: relative; z-index: 10;
}
.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.8); border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 2px 8px rgba(180,150,160,0.18);
}
.back-btn svg { width: 18px; height: 18px; color: #9a7b8f; }
.header-title { text-align: center; }
.header-title .t { font-size: 17px; font-weight: 700; color: #6b4f6e; letter-spacing: 2px; }
.header-title .s { font-size: 11px; color: #a08a92; margin-top: 2px; }
.header .spacer { width: 38px; }

/* 就寝时间 */
.bedtime-row {
  flex-shrink: 0;
  margin: 4px 16px 10px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.75);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(180,150,160,0.12);
  position: relative; z-index: 10;
}
.bedtime-row .bl-label { font-size: 14px; font-weight: 600; color: #5d4a55; }
.bedtime-row input[type="time"] {
  font-size: 18px; font-weight: 700; color: #b579a0;
  border: none; background: transparent; outline: none;
  font-family: inherit;
}

/* 流程列表 */
.routine-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 16px 16px; scrollbar-width: none;
}
.routine-wrap::-webkit-scrollbar { display: none; }

.phone-down {
  display: flex; align-items: center; gap: 8px;
  margin: 6px 0 10px;
  color: #c98fb5; font-size: 12px; font-weight: 600; letter-spacing: 1px;
}
.phone-down::before, .phone-down::after {
  content: ''; flex: 1; height: 1px;
  background: repeating-linear-gradient(90deg, #d8b8cc 0 4px, transparent 4px 8px);
}

.act {
  display: flex; align-items: center;
  padding: 12px 12px;
  margin-bottom: 8px;
  background: #fff;
  border-radius: 14px;
  border: 2px solid rgba(216,183,200,0.35);
  box-shadow: 0 2px 8px rgba(180,150,160,0.1);
  position: relative;
}
.act.low { border-color: rgba(180,190,220,0.4); }
.act-time {
  font-size: 15px; font-weight: 800; color: #6b4f6e;
  font-variant-numeric: tabular-nums;
  width: 56px; flex-shrink: 0;
}
.act-body { flex: 1; min-width: 0; padding: 0 8px; }
.act-name { font-size: 14px; font-weight: 600; color: #4a3a2a; }
.act-meta { font-size: 11px; color: #a08a92; margin-top: 2px; }
.act-dur { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.act-dur button {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid #d8c4bc; background: #fdf6f0;
  color: #b579a0; font-size: 14px; cursor: pointer; line-height: 1;
}
.act-dur span { font-size: 12px; color: #7a6660; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.act-del {
  flex-shrink: 0; margin-left: 6px;
  width: 26px; height: 26px; border-radius: 50%;
  border: none; background: transparent; color: #c0a0a0;
  font-size: 18px; cursor: pointer; line-height: 1;
}
.act.updown { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; flex-shrink: 0; }
.act.updown button {
  width: 20px; height: 16px; border: none; background: transparent;
  color: #c0a0b0; font-size: 10px; cursor: pointer; line-height: 1;
}

/* 添加活动 */
.add-btn {
  width: 100%; padding: 13px;
  border: 2px dashed #d8b8cc; border-radius: 14px;
  background: rgba(255,255,255,0.5); color: #b579a0;
  font-size: 13px; font-weight: 600; cursor: pointer;
  margin-top: 4px;
}

/* 底部开始按钮 */
.start-bar {
  flex-shrink: 0;
  padding: 10px 16px 16px;
  position: relative; z-index: 10;
}
.start-bar button {
  width: 100%; padding: 14px 0;
  border: none; border-radius: 26px;
  background: linear-gradient(180deg, #d8a8c8 0%, #b888b8 100%);
  color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(180, 130, 170, 0.35);
  font-family: inherit;
}
.start-bar button:active { transform: scale(0.97); }

/* 弹层 */
.mask {
  position: absolute; inset: 0;
  background: rgba(40,30,20,0.45);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.mask.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 84%; max-width: 310px;
  background: #fff8e9; border-radius: 20px;
  padding: 22px 18px 18px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  transform: translateY(24px) scale(0.92);
  transition: transform 0.3s cubic-bezier(.34,1.3,.64,1);
  max-height: 80%;
  overflow-y: auto;
}
.mask.show .modal { transform: translateY(0) scale(1); }
.modal-title { text-align: center; font-size: 16px; font-weight: 700; color: #6b4f6e; letter-spacing: 2px; margin-bottom: 14px; }
.opt {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; margin-bottom: 8px;
  background: #fff; border-radius: 12px;
  border: 2px solid rgba(216,183,200,0.3);
  cursor: pointer;
}
.opt:active { transform: scale(0.98); }
.opt-name { font-size: 14px; font-weight: 600; color: #4a3a2a; }
.opt-desc { font-size: 11px; color: #a08a92; margin-top: 2px; }
.opt-add { color: #c98fb5; font-size: 13px; font-weight: 700; }
.custom-input {
  width: 100%; padding: 10px 12px; margin-bottom: 10px;
  border: 1px solid #e2d2b8; border-radius: 10px;
  font-size: 14px; outline: none; background: #fffdf8; color: #4a3a2a;
  font-family: inherit;
}
.modal-close {
  width: 100%; margin-top: 6px; padding: 11px;
  border: none; border-radius: 20px;
  background: #ece0c8; color: #7a6a50;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
}

.toast {
  position: absolute; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(40,30,20,0.9); color: #fff;
  padding: 10px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: all 0.3s;
  z-index: 400; white-space: nowrap; max-width: 88%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">

    <div class="header">
      <button class="back-btn" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <div class="header-title">
        <div class="t">今晚的睡前流程</div>
        <div class="s" id="totalInfo">共 50 分钟</div>
      </div>
      <div class="spacer"></div>
    </div>

    <div class="bedtime-row">
      <span class="bl-label">目标就寝时间</span>
      <input type="time" id="bedtimeInput" value="23:00">
    </div>

    <div class="routine-wrap" id="routineWrap"></div>

    <div class="start-bar">
      <button id="startBtn">开始今晚的流程</button>
    </div>

    <div class="mask" id="addMask">
      <div class="modal">
        <div class="modal-title">添加一个活动</div>
        <div id="addList"></div>
        <div class="modal-title" style="font-size:13px;letter-spacing:1px;margin-top:8px;">或自定义</div>
        <input class="custom-input" id="customName" placeholder="如：刷牙、洗澡、拉伸、整理书包">
        <button class="opt" id="customAdd" style="justify-content:center;border-style:dashed;"><span class="opt-name">+ 添加自定义活动</span></button>
        <button class="modal-close" id="addClose">取消</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== 功能类型定义 =====
  const TYPES = {
    thought_box:       { name: '烦恼收纳箱',   desc: '把想说的话写下来，收进箱子里', page: 'box.html',      screen: true  },
    thought_completion:{ name: '引导入睡音频', desc: '把一件事想完、放下',           page: 'caignick.html', screen: true  },
    reading:           { name: '睡前阅读',     desc: '放下手机读一会儿',             page: 'read.html',     screen: false },
    relaxation:        { name: '放松练习',     desc: '呼吸、冥想，让身体松弛',       page: 'relax.html',    screen: false },
    white_noise:       { name: '白噪音',       desc: '自然声音伴你入睡',             page: 'sound.html',    screen: false },
    music:             { name: '音乐',         desc: '轻柔安神的音乐',               page: 'sound.html',    screen: false },
    sleep_audio:       { name: '助眠音频',     desc: '舒缓声音引导入睡',             page: 'sound.html',    screen: false }
  };

  // ===== 默认流程 =====
  const DEFAULT_ROUTINE = {
    bedtime: '23:00',
    activities: [
      { type: 'thought_box',        name: '烦恼收纳箱',   dur: 10 },
      { type: 'reading',            name: '睡前阅读',     dur: 30 },
      { type: 'relaxation',         name: '放松练习',     dur: 10 },
      { type: 'white_noise',        name: '白噪音',       dur: 0 }
    ]
  };

  const STORE_KEY = 'sleep_routine';
  const STORE_ADD = 'routine_add';

  let routine;
  try {
    const saved = localStorage.getItem(STORE_KEY);
    routine = saved ? JSON.parse(saved) : null;
    if (!routine || !Array.isArray(routine.activities)) routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  } catch(e) { routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE)); }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(routine)); } catch(e) {}
  }

  // ===== 处理「加入睡前流程」传来的活动 =====
  try {
    const add = localStorage.getItem(STORE_ADD);
    if (add) {
      localStorage.removeItem(STORE_ADD);
      const a = JSON.parse(add);
      if (a && a.type && TYPES[a.type]) {
        const act = { type: a.type, name: TYPES[a.type].name, dur: (a.dur || 10) };
        // 插入到第一个低交互活动之前（即「放下手机」分割线位置）
        const idx = routine.activities.findIndex(x => !isScreenType(x.type));
        if (idx === -1) routine.activities.push(act);
        else routine.activities.splice(idx, 0, act);
        save();
        toast('已把「' + act.name + '」加入流程');
      }
    }
  } catch(e) {}

  function isScreenType(type) {
    const t = TYPES[type];
    return t ? t.screen : false;
  }

  // ===== 计算倒推时间 =====
  function parseBedtime(str) {
    const p = String(str || '23:00').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function fmtMin(min) {
    min = ((min % 1440) + 1440) % 1440;
    const h = Math.floor(min / 60), m = min % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  function calcTimes() {
    let t = parseBedtime(routine.bedtime);
    for (let i = routine.activities.length - 1; i >= 0; i--) {
      const a = routine.activities[i];
      a.end = t;
      a.start = t - (a.dur || 0);
      t = a.start;
    }
  }

  // ===== 渲染 =====
  const wrap = document.getElementById('routineWrap');
  const bedtimeInput = document.getElementById('bedtimeInput');
  const totalInfo = document.getElementById('totalInfo');

  function render() {
    calcTimes();
    const total = routine.activities.reduce((s, a) => s + (a.dur || 0), 0);
    totalInfo.textContent = total > 0 ? ('共 ' + total + ' 分钟') : '直接进入睡眠';

    wrap.innerHTML = '';
    // 找到第一个低交互活动（放下手机从这里开始）
    let phoneDownIdx = routine.activities.findIndex(a => !isScreenType(a.type));

    routine.activities.forEach((a, i) => {
      if (phoneDownIdx === i) {
        const pd = document.createElement('div');
        pd.className = 'phone-down';
        pd.textContent = '放下手机，从这里开始';
        wrap.appendChild(pd);
      }

      const el = document.createElement('div');
      el.className = 'act' + (isScreenType(a.type) ? '' : ' low');

      const time = document.createElement('div');
      time.className = 'act-time';
      time.textContent = a.dur > 0 ? fmtMin(a.start) : (fmtMin(a.end) + ' 就寝');

      const body = document.createElement('div');
      body.className = 'act-body';
      body.innerHTML = '<div class="act-name"></div><div class="act-meta"></div>';
      body.querySelector('.act-name').textContent = a.name;
      body.querySelector('.act-meta').textContent = TYPES[a.type] ? TYPES[a.type].desc : '自定义活动';

      const updown = document.createElement('div');
      updown.className = 'act updown';
      updown.innerHTML = '<button data-d="up">▲</button><button data-d="down">▼</button>';
      updown.querySelector('[data-d="up"]').addEventListener('click', e => { e.stopPropagation(); move(i, -1); });
      updown.querySelector('[data-d="down"]').addEventListener('click', e => { e.stopPropagation(); move(i, 1); });

      const dur = document.createElement('div');
      dur.className = 'act-dur';
      dur.innerHTML = '<button data-d="-">−</button><span></span><button data-d="+">+</button>';
      dur.querySelector('span').textContent = a.dur + ' 分';
      dur.querySelector('[data-d="-"]').addEventListener('click', e => { e.stopPropagation(); setDur(i, -5); });
      dur.querySelector('[data-d="+"]').addEventListener('click', e => { e.stopPropagation(); setDur(i, 5); });

      const del = document.createElement('button');
      del.className = 'act-del';
      del.textContent = '×';
      del.addEventListener('click', e => { e.stopPropagation(); removeAct(i); });

      el.appendChild(updown);
      el.appendChild(time);
      el.appendChild(body);
      el.appendChild(dur);
      el.appendChild(del);

      wrap.appendChild(el);
    });
    // 底部添加按钮始终在列表末尾
    if (typeof addBtn !== 'undefined') wrap.appendChild(addBtn);
  }

  function setDur(i, delta) {
    const a = routine.activities[i];
    a.dur = Math.max(0, (a.dur || 0) + delta);
    save(); render();
  }
  function removeAct(i) {
    routine.activities.splice(i, 1);
    save(); render();
  }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= routine.activities.length) return;
    const tmp = routine.activities[i];
    routine.activities[i] = routine.activities[j];
    routine.activities[j] = tmp;
    save(); render();
  }
  // ===== 开始流程：存进度，跳到第一个有页面的活动 =====
  function gotoProcessPage(proc, idx) {
    for (let i = idx; i < proc.activities.length; i++) {
      const a = proc.activities[i];
      if (a.page) {
        proc.index = i;
        proc.startedAt = Date.now();
        try { localStorage.setItem('sleep_process', JSON.stringify(proc)); } catch(e) {}
        location.href = a.page;
        return;
      }
    }
    // 没有更多有页面的活动，结束
    try { localStorage.removeItem('sleep_process'); } catch(e) {}
    toast('流程已完成，晚安');
  }

  function startProcess() {
    if (!routine.activities.length) { toast('先添加至少一个活动'); return; }
    const proc = {
      activities: routine.activities.map(function(a) {
        const t = TYPES[a.type];
        return { type: a.type, name: a.name, dur: a.dur || 0, page: t ? t.page : '' };
      }),
      index: 0,
      startedAt: Date.now()
    };
    gotoProcessPage(proc, 0);
  }

  // ===== 就寝时间 =====
  bedtimeInput.value = routine.bedtime;
  bedtimeInput.addEventListener('change', function() {
    routine.bedtime = this.value || '23:00';
    save(); render();
  });

  // ===== 添加活动 =====
  const addMask = document.getElementById('addMask');
  const addList = document.getElementById('addList');
  const customName = document.getElementById('customName');

  function openAdd() {
    addList.innerHTML = '';
    Object.keys(TYPES).forEach(function(key) {
      const t = TYPES[key];
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.innerHTML = '<div><div class="opt-name"></div><div class="opt-desc"></div></div><span class="opt-add">+ 添加</span>';
      opt.querySelector('.opt-name').textContent = t.name;
      opt.querySelector('.opt-desc').textContent = t.desc;
      opt.addEventListener('click', function() {
        routine.activities.push({ type: key, name: t.name, dur: key === 'white_noise' || key === 'music' || key === 'sleep_audio' ? 0 : 10 });
        save(); render(); addMask.classList.remove('show');
        toast('已添加「' + t.name + '」');
      });
      addList.appendChild(opt);
    });
    customName.value = '';
    addMask.classList.add('show');
  }

  document.getElementById('customAdd').addEventListener('click', function() {
    const name = customName.value.trim();
    if (!name) { toast('先给活动起个名字'); return; }
    routine.activities.push({ type: 'custom', name: name, dur: 10 });
    save(); render(); addMask.classList.remove('show');
    toast('已添加「' + name + '」');
  });
  document.getElementById('addClose').addEventListener('click', () => addMask.classList.remove('show'));
  addMask.addEventListener('click', e => { if (e.target === addMask) addMask.classList.remove('show'); });

  // 底部添加按钮（放列表底部）
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.id = 'addActBtn';
  addBtn.textContent = '+ 添加活动';
  addBtn.addEventListener('click', openAdd);

  // ===== 返回 =====
  document.getElementById('backBtn').addEventListener('click', () => {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });

  // ===== 开始流程 =====
  document.getElementById('startBtn').addEventListener('click', startProcess);

  // toast
  let toastTimer = null;
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  render();
})();
</script>

</body>
</html>
