<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>睡前一小时档案 - 好好睡觉</title>
<style>
:root{
  --paper:#F5F0E4;
  --card:#FBF8F0;
  --ink:#1C1814;
  --ink2:#6B6153;
  --ink3:#9A9080;
  --hair:#D9D0BC;
  --red:#A3271E;
  --red-bg:#F2E2DC;
  --green:#4A6B4E;
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
  --mono:"Menlo","Consolas","IBM Plex Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:pan-y;
  overscroll-behavior-x:contain;
}
.stage{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:#e8e0cd;
  position:relative;overflow:hidden;
}
.phone{
  width:min(100vw, calc(100vh * 9 / 16));
  aspect-ratio:9/16;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--paper);
  background-image:radial-gradient(rgba(28,24,20,.028) 1px, transparent 1px);
  background-size:5px 5px;
}

/* ===== 顶栏 ===== */
.header{
  flex-shrink:0;
  display:flex;align-items:center;
  padding:max(14px, env(safe-area-inset-top)) 14px 10px;
  position:relative;z-index:10;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--card);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink2);
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{width:18px;height:18px}

/* ===== 滚动内容 ===== */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px 26px 28px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}

.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:600}
.meta{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink2)}
.archive-head h1{font-size:clamp(20px,5vw,26px);font-weight:900;letter-spacing:.05em;margin:10px 0 8px;line-height:1.3}
.meta-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-top:10px}
.rule2{border:none;border-top:2px solid var(--ink);margin-top:12px}

.section-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink2);
  display:flex;align-items:center;gap:10px;margin:28px 0 4px;
}
.section-label::after{content:"";flex:1;border-top:1px solid var(--hair)}

/* 入睡时间 */
.sleep-row{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:18px 0 16px;border-bottom:1px solid var(--hair);gap:12px;flex-wrap:wrap;
}
.sleep-row .big{font-size:18px;font-weight:600;letter-spacing:.04em}
#sleepTime{
  font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--hair);border-radius:2px;
  padding:6px 12px;letter-spacing:.1em;
}
#sleepTime:focus{outline:none;border-color:var(--ink)}
.sleep-hint{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.1em;margin-top:8px}

/* 模块行 */
.item{
  border-bottom:1px solid var(--hair);
  padding:16px 0;display:grid;
  grid-template-columns:30px 1fr auto auto;align-items:center;column-gap:10px;
}
.item .no{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em}
.item .name{font-size:16px;font-weight:600;letter-spacing:.05em}
.item .name .en{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3);display:block;margin-top:3px;text-transform:uppercase}
.item .desc{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.6;font-weight:400}
.item.deadline .no{color:var(--red)}
.item.deadline .name{color:var(--red)}
.tag{
  display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  padding:2px 6px;border-radius:2px;margin-top:6px;text-transform:uppercase;
}
.tag.red{color:var(--red);background:var(--red-bg)}
.tag.green{color:var(--green);border:1px solid #5A7355}

/* 步进器 + 排序 */
.stepper{display:flex;align-items:center;border:1px solid var(--hair);border-radius:2px;background:var(--card)}
.stepper button{
  font-family:var(--mono);font-size:14px;color:var(--ink);background:none;border:none;
  width:30px;height:32px;cursor:pointer;line-height:1;
}
.stepper button:disabled{color:var(--hair);cursor:default}
.stepper .val{font-family:var(--mono);font-size:12px;font-weight:600;min-width:52px;text-align:center;letter-spacing:.05em}
.stepper .val small{font-weight:400;color:var(--ink3);font-size:9px}
.stepper .val.skip{color:var(--ink3);font-weight:400}
.order{display:flex;flex-direction:column;gap:2px}
.order button{
  font-family:var(--mono);font-size:10px;color:var(--ink3);background:none;border:1px solid var(--hair);
  width:20px;height:16px;border-radius:2px;cursor:pointer;line-height:1;padding:0;
}
.order .del{margin-left:0}

/* 自定义 */
.add-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.add-row input[type=text]{
  flex:1;min-width:140px;font-family:var(--serif);font-size:13px;color:var(--ink);
  background:var(--card);border:1px solid var(--hair);border-radius:2px;padding:9px 11px;letter-spacing:.05em;
}
.add-row input[type=number]{
  font-family:var(--mono);font-size:13px;color:var(--ink);width:70px;
  background:var(--card);border:1px solid var(--hair);border-radius:2px;padding:9px 11px;letter-spacing:.05em;
}
.add-row input:focus{outline:none;border-color:var(--ink)}
.add-row button{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--paper);
  background:var(--ink);border:none;border-radius:2px;padding:10px 18px;cursor:pointer;text-transform:uppercase;
}
.del{font-family:var(--mono);font-size:10px;color:var(--ink3);background:none;border:none;cursor:pointer}

/* 汇总 */
.summary{margin-top:34px}
.timeline{margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em}
.tl-row{display:grid;grid-template-columns:96px 12px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--hair)}
.tl-row .t{color:var(--ink);font-weight:500}
.tl-row .dot{width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.tl-row.deadzone .dot{background:var(--red)}
.tl-row.deadzone .t,.tl-row.deadzone .n{color:var(--red)}
.tl-row .n{font-family:var(--serif);font-size:12px;letter-spacing:.05em}
.tl-row .d{color:var(--ink3)}
.tl-blank{color:var(--ink3);font-family:var(--serif);font-size:12px;letter-spacing:.05em}
.bar{height:6px;border:1px solid var(--ink);border-radius:2px;margin:12px 0 8px;position:relative;background:var(--card);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .3s}
.bar .fill.over{background:var(--red)}
.total-line{display:flex;justify-content:space-between;align-items:baseline}
.total-line .tt{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.05em}
.total-line .tt small{font-size:10px;color:var(--ink3);font-weight:400}
.error{font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:.08em;margin-top:10px;line-height:1.9;display:none}
.error.show{display:block}

/* CTA */
.cta{
  display:block;width:100%;margin-top:28px;
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
  color:var(--paper);background:var(--ink);border:none;border-radius:2px;
  padding:16px 0;cursor:pointer;
}
.cta:active{background:#000}
.cta:disabled{background:var(--hair);color:var(--ink3);cursor:not-allowed}
.notes{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.12em;margin-top:14px;line-height:2}

.toast{
  position:absolute;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(28,24,20,.92);color:var(--paper);
  padding:10px 18px;border-radius:20px;font-size:12px;
  opacity:0;pointer-events:none;transition:all .3s;
  z-index:400;white-space:nowrap;max-width:88%;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  .scroll{padding:6px 16px 24px}
  .item{grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:12px;position:relative}
  .item .no{grid-row:1;grid-column:1;align-self:start;padding-top:3px}
  .item > div:nth-child(2){grid-row:1;grid-column:2;min-width:0;padding-right:70px}
  .item .stepper{grid-row:2;grid-column:1/-1;justify-self:start}
  .item .order{position:absolute;top:12px;right:0;flex-direction:row;gap:4px}
  .add-row{flex-direction:column;align-items:stretch}
  .add-row input[type=text],.add-row input[type=number]{width:100%;min-width:0}
  .tl-row{grid-template-columns:78px 12px 1fr;gap:8px}
  .tl-row .d{display:none}
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">

    <div class="header">
      <button class="back-btn" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
    </div>

    <div class="scroll" id="scroll">
      <header class="archive-head">
        <div class="kicker">EVENING ARCHIVE · N°01</div>
        <h1>睡前一小时 · 规划档案</h1>
        <div class="meta-row">
          <span class="meta">FORM 01 · PRE-SLEEP SCHEDULE</span>
          <span class="meta" id="metaDate"></span>
        </div>
        <hr class="rule2">
      </header>

      <!-- 目标入睡时间 -->
      <div class="section-label">01 / 目标入睡时间 — SLEEP TIME</div>
      <div class="sleep-row">
        <div>
          <div class="big">今晚打算几点入睡</div>
          <div class="sleep-hint">档案时段按你的安排自动倒推</div>
        </div>
        <input type="time" id="sleepTime" value="23:00">
      </div>

      <!-- 模块清单 -->
      <div class="section-label">02 / 一小时内容 — MODULES</div>
      <div id="itemList"></div>

      <!-- 自定义 -->
      <div class="add-row">
        <input type="text" id="customName" placeholder="自定义内容名称" maxlength="20">
        <input type="number" id="customMin" placeholder="分钟" min="1" step="5">
        <button id="addBtn">归档 +</button>
      </div>

      <!-- 汇总 -->
      <div class="summary">
        <div class="section-label">03 / 档案封存 — SUMMARY</div>
        <div class="bar"><div class="fill" id="barFill"></div></div>
        <div class="total-line">
          <span class="tt" id="totalText">0 <small>MIN</small></span>
          <span class="meta" id="startEndText"></span>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="error" id="errorMsg"></div>
        <button class="cta" id="startBtn">封存 · 开始睡前一小时</button>
        <div class="notes">
          ※ 时长可自由安排，无上限限制<br>
          ※ 睡前 15 分钟为无屏时段，烦恼收藏箱不得排入（红线区）<br>
          ※ 封存后将依次进入各环节，请将设备搁置一旁
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

  </div>
</div>

<script>
(function() {
  'use strict';

  /* ============ 功能模块（映射到真实页面） ============ */
  const BUILTIN = [
    { key:'worry', name:'烦恼收藏箱', en:'WORRY BOX',   desc:'把烦心事写下来，封存入档', min:10, page:'box.html',      screen:true,  tag:'red', tagText:'需屏幕 · 禁入睡前15分钟' },
    { key:'audio', name:'安睡引导音频', en:'GUIDED AUDIO', desc:'人声引导，逐步放松入眠', min:15, page:'caignick.html', screen:true,  tag:null },
    { key:'relax', name:'放松练习',   en:'RELAXATION',  desc:'渐进式肌肉放松 / 呼吸练习', min:10, page:'relax.html',   screen:false, tag:null },
    { key:'read',  name:'睡前阅读',   en:'READING',     desc:'纸质书为宜，弱光下慢读', min:15, page:'read.html',     screen:false, tag:null },
    { key:'noise', name:'白噪音',     en:'WHITE NOISE', desc:'雨声、风声等均匀底噪',   min:0,  page:'sound.html',   screen:false, tag:null },
  ];

  let items = BUILTIN.map(b => ({ ...b, builtin:true }));
  const MAX_MIN = 60, DEADZONE = 15;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ============ 日期 ============ */
  const now = new Date();
  $('metaDate').textContent = `${now.getFullYear()}·${pad(now.getMonth()+1)}·${pad(now.getDate())} — 落定`;

  /* ============ 解析入睡时间 ============ */
  function sleepDate() {
    const [h,m] = ($('sleepTime').value || '23:00').split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d < new Date()) d.setDate(d.getDate() + 1);
    return d;
  }
  function fmtHM(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  /* ============ 调度（倒推各模块时间） ============ */
  function schedule() {
    const sleep = sleepDate();
    const total = items.reduce((s, i) => s + i.min, 0);
    // 档案时段按实际总时长倒推（不强制 60 分钟）
    let cursor = new Date(sleep.getTime() - total * 60000);
    return {
      sleep,
      rows: items.map(it => {
        const start = new Date(cursor.getTime());
        const end = new Date(cursor.getTime() + it.min * 60000);
        cursor = end;
        return { it, start, end };
      })
    };
  }

  /* ============ 渲染 ============ */
  function render() {
    const list = $('itemList');
    list.innerHTML = '';
    const { sleep, rows } = schedule();
    items.forEach((it, i) => {
      const inDeadzone = it.key === 'worry' && it.min > 0 && rows[i].end.getTime() > sleep.getTime() - DEADZONE * 60000;
      const row = document.createElement('div');
      row.className = 'item' + (inDeadzone ? ' deadline' : '');
      const minv = 0, maxv = 600;
      row.innerHTML = `
        <div class="no">N°${pad(i+1)}</div>
        <div>
          <div class="name">${it.name}<span class="en">${it.en || 'CUSTOM'}</span></div>
          ${it.desc ? `<div class="desc">${it.desc}</div>` : ''}
          ${it.tag === 'red' ? `<span class="tag red">${it.tagText}</span>` : ''}
        </div>
        <div class="stepper">
          <button data-a="dec" ${it.min <= minv ? 'disabled' : ''}>−</button>
          <div class="val ${it.min === 0 ? 'skip' : ''}">${it.min === 0 ? '跳过' : it.min + '<small> MIN</small>'}</div>
          <button data-a="inc" ${it.min >= maxv ? 'disabled' : ''}>＋</button>
        </div>
        <div class="order">
          <button data-a="up" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button data-a="down" ${i === items.length - 1 ? 'disabled' : ''}>▼</button>
          ${!it.builtin ? '<button class="del" data-a="del">删</button>' : ''}
        </div>`;
      row.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          const a = b.dataset.a;
          if (a === 'dec') it.min = Math.max(minv, it.min - 5);
          if (a === 'inc') it.min = Math.min(maxv, it.min + 5);
          if (a === 'up' && i > 0) { [items[i-1], items[i]] = [items[i], items[i-1]]; }
          if (a === 'down' && i < items.length - 1) { [items[i+1], items[i]] = [items[i], items[i+1]]; }
          if (a === 'del') { items.splice(i, 1); }
          render();
        });
      });
      list.appendChild(row);
    });
    updateSummary();
    save();
  }

  /* ============ 汇总 / 校验 ============ */
  function updateSummary() {
    const { sleep, rows } = schedule();
    const total = items.reduce((s, i) => s + i.min, 0);
    const fill = $('barFill');
    fill.style.width = Math.min(100, total / MAX_MIN * 100) + '%';
    fill.classList.remove('over');
    $('totalText').innerHTML = `${total} <small>MIN</small>`;
    $('startEndText').textContent = `档案时段 ${fmtHM(new Date(sleep.getTime() - total * 60000))} — ${fmtHM(sleep)}`;

    const tl = $('timeline');
    tl.innerHTML = '';
    rows.forEach((r, i) => {
      if (r.it.min === 0) return;
      const deadzone = r.it.key === 'worry' && r.end.getTime() > sleep.getTime() - DEADZONE * 60000;
      const row = document.createElement('div');
      row.className = 'tl-row' + (deadzone ? ' deadzone' : '');
      row.innerHTML = `<span class="t">${fmtHM(r.start)}–${fmtHM(r.end)}</span><span class="dot"></span><span class="n">${r.it.name}</span><span class="d">${r.it.min} MIN</span>`;
      tl.appendChild(row);
    });
    validate(total, sleep, rows);
  }

  function validate(total, sleep, rows) {
    const err = $('errorMsg');
    const msgs = [];
    if (total === 0) msgs.push('× 档案为空：请至少为一个模块安排时长');
    rows.forEach(r => {
      if (r.it.key === 'worry' && r.it.min > 0 && r.end.getTime() > sleep.getTime() - DEADZONE * 60000)
        msgs.push(`× 烦恼收藏箱（${fmtHM(r.start)}–${fmtHM(r.end)}）落入睡前 ${DEADZONE} 分钟无屏禁区，请缩短或移到更早`);
    });
    if (msgs.length) {
      err.innerHTML = msgs.join('<br>');
      err.classList.add('show');
      $('startBtn').disabled = true;
    } else {
      err.classList.remove('show');
      $('startBtn').disabled = false;
    }
  }

  /* ============ 存储 ============ */
  const STORE_KEY = 'sleep_archive';
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ bedtime: $('sleepTime').value, items: items.map(i => ({ key: i.key, name: i.name, min: i.min, builtin: i.builtin })) })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!s) return;
      if (s.bedtime) $('sleepTime').value = s.bedtime;
      if (Array.isArray(s.items)) {
        items = s.items.map(o => {
          const b = BUILTIN.find(x => x.key === o.key);
          return b ? { ...b, min: o.min, builtin:true } : { key: o.key || ('c'+Date.now()), name: o.name, en:'CUSTOM', desc:'自定义条目', min: o.min, page:'', screen:false, tag:null, builtin:false };
        });
      }
    } catch (e) {}
  }

  /* ============ 自定义条目 ============ */
  $('addBtn').addEventListener('click', () => {
    const name = $('customName').value.trim();
    const min = parseInt($('customMin').value, 10);
    if (!name) { $('customName').focus(); return; }
    if (!min || min < 1) { $('customMin').focus(); return; }
    items.push({ key:'c' + Date.now(), name, en:'CUSTOM', desc:'自定义条目', min:Math.max(1, min), page:'', screen:false, tag:null, builtin:false });
    $('customName').value = ''; $('customMin').value = '';
    render();
  });

  /* ============ 返回 ============ */
  $('backBtn').addEventListener('click', () => {
    window.history.length > 1 ? history.back() : (location.href = 'index.html');
  });

  /* ============ 封存 · 开始执行 ============ */
  $('startBtn').addEventListener('click', () => {
    const rows = schedule().rows.filter(r => r.it.min > 0);
    if (!rows.length) { toast('先为至少一个模块安排时长'); return; }
    const proc = {
      activities: rows.map(r => ({
        type: r.it.key,
        name: r.it.name,
        dur: r.it.min,
        page: r.it.page || ''
      })),
      index: -1,
      startedAt: Date.now()
    };
    // 跳到第一个有真实页面的活动（无页面自定义活动自动跳过）
    for (let i = 0; i < proc.activities.length; i++) {
      if (proc.activities[i].page) {
        proc.index = i;
        proc.startedAt = Date.now();
        try { localStorage.setItem('sleep_process', JSON.stringify(proc)); } catch (e) {}
        location.href = proc.activities[i].page;
        return;
      }
    }
    try { localStorage.removeItem('sleep_process'); } catch (e) {}
    toast('档案已封存，晚安');
  });

  $('sleepTime').addEventListener('change', () => { save(); updateSummary(); });

  /* ============ 初始化 ============ */
  load();
  render();
})();
